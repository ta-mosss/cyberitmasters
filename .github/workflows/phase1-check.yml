name: Phase 1 Security Check

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  phase1-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run phase1:check
      - run: npm run build
