// Use transaction for atomic increment
async function nextTicketNumber() {
  const ref = db.collection("meta").doc("counter");
  const result = await db.runTransaction(async (transaction) => {
    const doc = await transaction.get(ref);
    const current = doc.exists ? doc.data().val : 1000;
    const next = current + 1;
    transaction.set(ref, { val: next });
    return next;
  });
  return result;
}

async function fsAdd(t) { await db.collection("tickets").doc(t.ref).set(t); }
async function fsUpdate(ref, ch) { await db.collection("tickets").doc(ref).update({ ...ch, updatedAt: ts() }); }
async function fsNote(ref, txt, type = "note", engineer = "") {
  const s = await db.collection("tickets").doc(ref).get();
  const notes = [...(s.data().notes || []), { txt, at: ts(), type, engineer }];
  await db.collection("tickets").doc(ref).update({ notes, updatedAt: ts() });
}
function ts() { return new Date().toISOString(); }
function makeTktRef(num) { return `CIM-${String(num).padStart(4,"0")}`; }

/* ── WHATSAPP URL ── */
function waUrl(phone, msg) {
  const clean = String(phone || "").replace(/[^0-9]/g, "");
  // If starts with 0, assume SA and add 27; else if starts with +, keep; otherwise assume international
  let num = clean;
  if (clean.startsWith("0")) {
    num = "27" + clean.slice(1);
  } else if (!clean.startsWith("27") && clean.length === 10) {
    // Possibly SA without 0
    num = "27" + clean;
  }
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

function AuthLogin({ onLogin, onBack, theme, toggleTheme }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      // Check if email is in admin list (or custom claim)
      const user = cred.user;
      const token = await user.getIdTokenResult();
      if (token.claims.admin || CFG.adminEmails.includes(user.email)) {
        onLogin(user);
      } else {
        await auth.signOut();
        setError("Access denied. You are not an admin.");
      }
    } catch (err) {

    }
    setLoading(false);
  };
