<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cyber I.T Masters — Support Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',sans-serif;transition:background 0.3s,color 0.3s;}

/* ── THEME VARIABLES ── */
body.dark{
  --bg:#050810;--bg2:#080D18;--bg3:#0D1624;--bg4:#050810;
  --border:#0F1C2E;--border2:#1E2A3A;
  --text:#E2E8F0;--text2:#94A3B8;--text3:#475569;--text4:#334155;
  --card:#080D18;--sidebar:#080D18;
  color:#E2E8F0;background:#050810;
}
body.light{
  --bg:#F0F4F8;--bg2:#FFFFFF;--bg3:#EBF0F7;--bg4:#F8FAFC;
  --border:#DDE3EE;--border2:#C8D1E0;
  --text:#1A2332;--text2:#4A5568;--text3:#718096;--text4:#A0AEC0;
  --card:#FFFFFF;--sidebar:#FFFFFF;
  color:#1A2332;background:#F0F4F8;
}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00C896!important;box-shadow:0 0 0 3px rgba(0,200,150,0.1)!important;}
input[type="file"]{display:none;}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.4);}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes chatPop{from{opacity:0;transform:scale(0.92) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes presencePulse{0%,100%{box-shadow:0 0 0 0 rgba(0,200,150,0.4);}50%{box-shadow:0 0 0 5px rgba(0,200,150,0);}}

.fu{animation:fadeUp 0.35s ease forwards;}
.si{animation:slideIn 0.3s ease forwards;}

/* ── LAYOUT ── */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}
.sidebar{width:240px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.sidebar-logo .brand{display:flex;align-items:center;gap:10px;}
.sidebar-logo .icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00C896,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.sidebar-logo .name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.01em;line-height:1.2;}
.sidebar-logo .sub{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:0.04em;text-transform:uppercase;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-label{font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:0.1em;padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;transition:all 0.15s;border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:var(--bg3);color:var(--text2);}
.nav-item.active{background:rgba(0,200,150,0.1);color:#00C896;font-weight:600;}
.nav-item .ni{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-item .badge{margin-left:auto;background:#EF4444;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;font-family:'IBM Plex Mono',monospace;}
.sidebar-bottom{padding:12px 10px;border-top:1px solid var(--border);}
.status-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-radius:8px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#00C896;box-shadow:0 0 6px #00C896;animation:pulse 2s infinite;}
.status-text{font-size:11px;color:var(--text3);font-weight:500;}

/* ── TOPBAR ── */
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-size:16px;font-weight:700;color:var(--text);}
.topbar-sub{font-size:12px;color:var(--text3);}
.topbar-right{display:flex;align-items:center;gap:8px;}

/* ── CONTENT ── */
.page-content{flex:1;overflow-y:auto;padding:24px;}
.main-layout{display:flex;min-height:100vh;}
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;}
.card-body{padding:20px;}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;color:var(--text);}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--text);margin-bottom:2px;}
.stat-lbl{font-size:11px;color:var(--text3);font-weight:500;}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.span2{grid-column:1/-1;}
.field-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;}
.field-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-size:13px;transition:border 0.2s,box-shadow 0.2s;width:100%;}
.field-input::placeholder{color:var(--text4);}
select.field-input{cursor:pointer;}
textarea.field-input{resize:vertical;min-height:88px;line-height:1.6;}
.field-error{font-size:11px;color:#F87171;margin-top:2px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#00C896,#0EA5E9);color:#050810;padding:10px 20px;font-size:13px;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text2);padding:9px 18px;font-size:13px;}
.btn-secondary:hover{border-color:var(--border2);color:var(--text);}
.btn-ghost{background:transparent;color:var(--text3);padding:8px 14px;font-size:13px;border:none;}
.btn-ghost:hover{color:var(--text2);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-wa{background:#25D366;color:#fff;padding:10px 18px;font-size:13px;border-radius:8px;}
.btn-email{background:#3B82F6;color:#fff;padding:10px 18px;font-size:13px;border-radius:8px;}
.btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#F87171;padding:8px 14px;font-size:12px;}
.btn-pdf{background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);color:#FB923C;padding:8px 14px;font-size:12px;}

/* ── BADGE / STATUS ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;}

/* ── SLA INDICATOR ── */
.sla-ok{color:#10B981;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.sla-warn{color:#F59E0B;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;animation:blink 1.5s infinite;}
.sla-breach{color:#EF4444;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;animation:blink 0.8s infinite;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:0.08em;padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--bg);font-size:13px;color:var(--text2);vertical-align:middle;}
.tbl tr:hover td{background:rgba(0,200,150,0.02);}
.tbl tr.selected td{background:rgba(0,200,150,0.04);}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;}

/* ── DETAIL PANEL ── */
.detail-panel{width:420px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.detail-panel.hidden{display:none;}
.detail-header{padding:16px 20px;border-bottom:1px solid var(--border);}
.detail-body{flex:1;overflow-y:auto;padding:16px 20px;}
.detail-row{display:flex;padding:8px 0;border-bottom:1px solid var(--border);}
.detail-key{font-size:11px;color:var(--text3);width:100px;flex-shrink:0;padding-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.detail-val{font-size:12px;color:var(--text2);flex:1;}

/* ── DETAIL TABS ── */
.detail-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.detail-tab{flex:1;padding:10px 8px;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all 0.15s;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:0.02em;text-transform:uppercase;}
.detail-tab.active{color:#00C896;border-bottom-color:#00C896;background:transparent;}
.detail-tab:hover:not(.active){color:var(--text2);background:var(--bg3);}
.detail-tab-badge{background:#EF4444;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;font-family:'IBM Plex Mono',monospace;vertical-align:middle;}
.detail-tab-new{background:rgba(0,200,150,0.2);color:#00C896;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px;animation:pulse 2s infinite;vertical-align:middle;}

/* ── SECTION HEADER ── */
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.section-num{width:28px;height:28px;border-radius:7px;background:rgba(0,200,150,0.1);border:1px solid rgba(0,200,150,0.25);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#00C896;flex-shrink:0;}
.section-title{font-size:14px;font-weight:700;color:var(--text);}

/* ── CHIPS ── */
.radio-chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px;}
.chip{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--text3);transition:all 0.2s;user-select:none;}
.chip.active{border-color:#00C896;background:rgba(0,200,150,0.08);color:#00C896;font-weight:600;}

/* ── SEARCH ── */
.searchbar{position:relative;}
.searchbar input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-size:13px;}
.searchbar::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:15px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.5);animation:toastIn 0.3s ease;}
.toast.ok{background:#00C896;color:#050810;}
.toast.error{background:#EF4444;color:#fff;}
.toast.info{background:#0EA5E9;color:#fff;}

/* ── PORTAL ── */
.portal-wrap{min-height:100vh;background:var(--bg);}
.portal-header{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);}
.portal-header-inner{max-width:760px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;height:58px;}
.portal-main{max-width:760px;margin:0 auto;padding:40px 20px 80px;}

/* ── QUICK LINKS ── */
.ql-bar{background:var(--bg2);border-bottom:1px solid var(--border);}
.ql-inner{max-width:760px;margin:0 auto;padding:9px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ql-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;}

/* ── NOTES ── */
.note-item{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:6px;border:1px solid var(--border);}
.note-text{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:4px;}
.note-meta{font-size:10px;color:var(--text4);font-family:'IBM Plex Mono',monospace;}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:16px 0;}

/* ── PHOTO UPLOAD ── */
.photo-drop{border:2px dashed var(--border2);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;}
.photo-drop:hover,.photo-drop.over{border-color:#00C896;background:rgba(0,200,150,0.03);}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.photo-thumb{position:relative;}
.photo-thumb img{width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid rgba(0,200,150,0.3);}
.photo-rm{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#EF4444;border:none;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}

/* ── WA PREVIEW ── */
.wa-preview{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;}
.wa-bubble{background:rgba(0,200,150,0.08);border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;}

/* ── SPINNER ── */
.spinner-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);flex-direction:column;gap:16px;}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(0,200,150,0.2);border-top-color:#00C896;animation:spin 0.75s linear infinite;}

/* ── MODAL OVERLAY ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-body{padding:20px;}

/* ── INVENTORY / PARTS ── */
.part-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.part-name{flex:1;font-size:13px;color:var(--text);}
.part-qty{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2);width:40px;text-align:center;}
.part-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}

/* ── KNOWN FIXES LIBRARY ── */
.fix-card{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;}
.fix-card:hover{border-color:#00C896;background:rgba(0,200,150,0.03);}
.fix-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.fix-desc{font-size:11px;color:var(--text3);line-height:1.55;}

/* ── CLIENT HISTORY ── */
.history-ticket{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.history-ref{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#00C896;margin-bottom:3px;}
.history-issue{font-size:12px;color:var(--text2);}

/* ── FOLLOWUP ── */
.followup-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.followup-overdue{color:#EF4444;font-size:11px;font-weight:700;}
.followup-pending{color:#F59E0B;font-size:11px;font-weight:700;}
.followup-done{color:#10B981;font-size:11px;font-weight:700;}

/* ── THEME TOGGLE ── */
.theme-toggle{width:36px;height:20px;border-radius:10px;background:var(--border2);border:none;position:relative;cursor:pointer;transition:background 0.3s;flex-shrink:0;}
.theme-toggle::after{content:"";position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#00C896;transition:left 0.3s;}
body.dark .theme-toggle::after{left:3px;}
body.light .theme-toggle::after{left:19px;}

/* ════════════════════════════════════════════════════
   LIVE CHAT STYLES
════════════════════════════════════════════════════ */
.chat-panel{display:flex;flex-direction:column;height:100%;min-height:0;}
.chat-engineer-bar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:5px;min-height:0;}
.chat-msg{display:flex;gap:8px;align-items:flex-start;animation:chatPop 0.2s ease;}
.chat-msg.mine{flex-direction:row-reverse;}
.chat-bubble{max-width:84%;padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.55;word-break:break-word;}
.chat-msg:not(.mine) .chat-bubble{background:var(--bg3);color:var(--text2);border-radius:4px 12px 12px 12px;border:1px solid var(--border);}
.chat-msg.mine .chat-bubble{background:linear-gradient(135deg,#00C896,#0EA5E9);color:#050810;border-radius:12px 4px 12px 12px;}
.chat-meta{font-size:9px;color:var(--text4);margin-top:3px;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.chat-msg.mine .chat-meta{justify-content:flex-end;}
.chat-sys-msg{text-align:center;font-size:10px;color:var(--text4);padding:4px 8px;font-style:italic;border-radius:10px;background:var(--bg3);margin:2px auto;max-width:240px;}
.chat-input-bar{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:6px;background:var(--card);flex-shrink:0;}
.chat-textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--text);font-size:12px;resize:none;min-height:36px;max-height:80px;font-family:inherit;line-height:1.5;}
.chat-textarea:focus{outline:none;border-color:#00C896;box-shadow:0 0 0 3px rgba(0,200,150,0.1);}
.chat-avatar{width:26px;height:26px;border-radius:50%;background:rgba(0,200,150,0.12);border:1px solid rgba(0,200,150,0.3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#00C896;flex-shrink:0;margin-top:2px;font-family:'IBM Plex Mono',monospace;}
.chat-avatar.alt{background:rgba(14,165,233,0.12);border-color:rgba(14,165,233,0.3);color:#0EA5E9;}
.wa-fwd-btn{display:inline-flex;align-items:center;gap:3px;background:rgba(37,211,102,0.12);border:1px solid rgba(37,211,102,0.25);color:#25D366;padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.wa-fwd-btn:hover{background:rgba(37,211,102,0.22);}

/* ── SLA HELPERS ── */
function getSLAInfo(ticket){
  if(!ticket||!ticket.createdAt||!ticket.priority) return null;
  const hours=SLA_HOURS[ticket.priority]||24;
  const created=new Date(ticket.createdAt).getTime();
  const deadline=created+(hours*3600*1000);
  const now=Date.now();
  const diff=deadline-now;
  const diffH=Math.round(diff/3600000);
  if(ticket.status==="resolved"||ticket.status==="closed") return{status:"done",label:"Resolved"};
  if(diff<0) return{status:"breach",label:`Breached ${Math.abs(diffH)}h ago`};
  if(diff<3600*1000*2) return{status:"warn",label:`${diffH}h left`};
  return{status:"ok",label:`${diffH}h left`};
}
function SLABadge({ticket}){
  const info=getSLAInfo(ticket);
  if(!info||info.status==="done") return null;
  const cls=info.status==="breach"?"sla-breach":info.status==="warn"?"sla-warn":"sla-ok";
  return<span className={cls}>⏱ {info.label}</span>;
}

/* ── FOLLOW-UP TRACKER MODAL ── */
function FollowUpModal({tickets,onClose}){
  const now=Date.now();
  const tracked=tickets.filter(t=>t.status!=="closed"&&t.status!=="resolved").map(t=>{
    const created=new Date(t.createdAt).getTime();
    const diff48=created+(48*3600*1000)-now;
    const overdue=diff48<0;
    const hours=Math.round(Math.abs(diff48)/3600000);
    return{...t,diff48,overdue,hours};
  }).sort((a,b)=>a.diff48-b.diff48);
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box fu">
        <div className="modal-header"><div className="card-title">📅 48hr Follow-Up Tracker</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>

/* ════════════════════════════════════════════════════
   LIVE CHAT COMPONENT  ← NEW
════════════════════════════════════════════════════ */
function TicketChat({ticket, activeEngineer, onWaForward}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [typing,setTyping]=useState({});
  const [sending,setSending]=useState(false);
  const endRef=useRef();
  const typingTimer=useRef();
  const initDone=useRef(false);

  // Announce presence
  useEffect(()=>{
    if(!activeEngineer||activeEngineer==="Unassigned") return;
    const pr=presenceRef(activeEngineer);
    pr.set({online:true,lastSeen:Date.now(),ticket:ticket.ref});
    const disc=pr.onDisconnect();
    disc.set({online:false,lastSeen:Date.now(),ticket:""});
    return()=>{ pr.set({online:false,lastSeen:Date.now(),ticket:""}); };
  },[activeEngineer,ticket.ref]);

  // Subscribe to messages
  useEffect(()=>{
    const ref=chatRef(ticket.ref);
    const handler=snap=>{
      const data=snap.val()||{};
      const list=Object.entries(data).map(([id,m])=>({id,...m})).sort((a,b)=>a.at-b.at);
      setMsgs(list);
      setTimeout(()=>endRef.current&&endRef.current.scrollIntoView({behavior:"smooth"}),60);
    };
    ref.on("value",handler);
    return()=>ref.off("value",handler);
  },[ticket.ref]);

  // Subscribe to typing
  useEffect(()=>{
    const ref=typingRef(ticket.ref);
    const handler=snap=>setTyping(snap.val()||{});
    ref.on("value",handler);
    return()=>ref.off("value",handler);
  },[ticket.ref]);

  // Auto-post system message on first open
  useEffect(()=>{
    if(!initDone.current&&activeEngineer&&activeEngineer!=="Unassigned"){
      initDone.current=true;
    }
  },[activeEngineer,ticket.ref]);

  const handleTyping=()=>{
    if(!activeEngineer||activeEngineer==="Unassigned") return;
    const nameKey=activeEngineer.replace(/\s+/g,"_");
    typingRef(ticket.ref).child(nameKey).set(true);
    clearTimeout(typingTimer.current);
    typingTimer.current=setTimeout(()=>typingRef(ticket.ref).child(nameKey).remove(),2200);
  };

  const send=async()=>{
    if(!input.trim()||!activeEngineer||activeEngineer==="Unassigned") return;
    setSending(true);
    const text=input.trim();
    setInput("");
    const nameKey=activeEngineer.replace(/\s+/g,"_");
    typingRef(ticket.ref).child(nameKey).remove();
    await sendChatMsg(ticket.ref,activeEngineer,text,"text");
    setSending(false);
  };

  const typingNames=Object.keys(typing)
    .filter(k=>k.replace(/_/g," ")!==activeEngineer&&typing[k]===true)
    .map(k=>k.replace(/_/g," "));

  const fmtTime=at=>new Date(at).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit"});
  const colors=["#00C896","#0EA5E9","#8B5CF6","#EC4899","#F59E0B"];
  const colorFor=name=>colors[Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%colors.length];

  if(!activeEngineer||activeEngineer==="Unassigned"){
    return(
      <div style={{padding:24,textAlign:"center",color:"var(--text4)"}}>
        <div style={{fontSize:28,marginBottom:10}}>💬</div>
        <div style={{fontSize:13,fontWeight:600,color:"var(--text3)",marginBottom:6}}>Select your engineer profile</div>
        <div style={{fontSize:12,color:"var(--text4)"}}>Go to the assignment dropdown to set your name and join the live chat.</div>
      </div>
    );
  }

  return(
    <div className="chat-panel">
      {/* Header bar */}
      <div className="chat-engineer-bar">
        <div className="chat-avatar" style={{background:`${colorFor(activeEngineer)}20`,borderColor:`${colorFor(activeEngineer)}50`,color:colorFor(activeEngineer)}}>
          {activeEngineer[0].toUpperCase()}
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"var(--text)"}}>{activeEngineer}</div>
          <div style={{fontSize:9,color:AC,fontFamily:"'IBM Plex Mono',monospace",textTransform:"uppercase",letterSpacing:"0.06em"}}>● Online · {ticket.ref}</div>
        </div>
        <div style={{marginLeft:"auto",fontSize:10,color:"var(--text4)"}}>
          {msgs.filter(m=>m.type!=="system").length} messages
        </div>
      </div>

      {/* Messages */}
      <div className="chat-messages">
        {msgs.length===0&&(
          <div className="chat-sys-msg" style={{marginTop:16,maxWidth:260}}>
            Team chat for {ticket.ref} · Start the conversation
          </div>
        )}
        {msgs.map((m,i)=>{
          if(m.type==="system") return(
            <div key={m.id||i} className="chat-sys-msg">{m.text}</div>
          );
          const isMe=m.from===activeEngineer;
          const clr=colorFor(m.from||"?");
          return(
            <div key={m.id||i} className={`chat-msg${isMe?" mine":""}`}>
              {!isMe&&(
                <div className="chat-avatar" style={{background:`${clr}18`,borderColor:`${clr}40`,color:clr}}>
                  {(m.from||"?")[0].toUpperCase()}
                </div>
              )}
              <div style={{maxWidth:"84%"}}>
                {!isMe&&<div style={{fontSize:9,fontWeight:700,color:clr,marginBottom:2,textTransform:"uppercase",letterSpacing:"0.05em"}}>{m.from}</div>}
                <div className="chat-bubble">{m.text}</div>
                <div className={`chat-meta`}>
                  <span>{fmtTime(m.at)}</span>
                  {!isMe&&ticket.phone&&(
                    <button className="wa-fwd-btn" onClick={()=>onWaForward&&onWaForward(ticket,m.text)}>
                      💬 WA
                    </button>
                  )}
                </div>
              </div>
            </div>
          );
        })}
        <div ref={endRef}/>
      </div>

      {/* Typing indicator */}
      <div className="typing-bar">
        {typingNames.length>0&&`✍️ ${typingNames.join(", ")} ${typingNames.length===1?"is":"are"} typing…`}
      </div>

      {/* Input bar */}
      <div className="chat-input-bar">
        <textarea
          className="chat-textarea"
          rows={2}
          value={input}
          onChange={e=>{setInput(e.target.value);handleTyping();}}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder={`Message team… (Enter to send, Shift+Enter for newline)`}
          disabled={sending}
        />
        <button
          className="btn btn-primary btn-sm"
          style={{alignSelf:"flex-end",padding:"8px 14px",minWidth:56}}
          onClick={send}
          disabled={sending||!input.trim()}
        >
          {sending?"…":"↑ Send"}
        </button>
      </div>
    </div>
  );
}

/* ── SIGNOFF MODAL ── */
function SignoffModal({ticket,clientName,setClientName,clientPosition,setClientPosition,onSave,onClose}){
  const [satisfaction,setSatisfaction]=React.useState(""); // "yes"|"no"|"partial"
  const [serviceRating,setServiceRating]=React.useState(0);
  const [responseTime,setResponseTime]=React.useState("");
  const [wouldRecommend,setWouldRecommend]=React.useState("");
  const [clientFeedback,setClientFeedback]=React.useState("");
  const [signoffStep,setSignoffStep]=React.useState(1); // 1=survey, 2=signature

  const RATINGS=[1,2,3,4,5];
  const ratingLabels={1:"Very Poor",2:"Poor",3:"Average",4:"Good",5:"Excellent"};
  const AC="#00C896";

  // Wire up signature pad when step=2
  React.useEffect(()=>{
    if(signoffStep!==2) return;
    const canvas=document.getElementById("signature-pad");
    if(!canvas) return;
    const ctx=canvas.getContext("2d");
    let drawing=false;
    const getXY=(e)=>{const rect=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return[src.clientX-rect.left,src.clientY-rect.top];};
    const start=(e)=>{e.preventDefault();drawing=true;const[x,y]=getXY(e);ctx.beginPath();ctx.moveTo(x,y);};
    const move=(e)=>{e.preventDefault();if(!drawing)return;const[x,y]=getXY(e);ctx.lineWidth=2;ctx.lineCap="round";ctx.strokeStyle="#00C896";ctx.lineTo(x,y);ctx.stroke();};
    const stop=()=>{drawing=false;};
    canvas.addEventListener("mousedown",start);
    canvas.addEventListener("mousemove",move);
    canvas.addEventListener("mouseup",stop);
    canvas.addEventListener("touchstart",start,{passive:false});
    canvas.addEventListener("touchmove",move,{passive:false});
    canvas.addEventListener("touchend",stop);
    const clearBtn=document.getElementById("clearSignature");
    const clearFn=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);};
    if(clearBtn) clearBtn.addEventListener("click",clearFn);
    return()=>{
      canvas.removeEventListener("mousedown",start);
      canvas.removeEventListener("mousemove",move);
      canvas.removeEventListener("mouseup",stop);
      canvas.removeEventListener("touchstart",start);
      canvas.removeEventListener("touchmove",move);
      canvas.removeEventListener("touchend",stop);
      if(clearBtn) clearBtn.removeEventListener("click",clearFn);
    };
  },[signoffStep]);

  const satisfactionOk=satisfaction==="yes"||satisfaction==="partial";

  const SurveyChip=({val,label,active,color,onClick})=>(
    <button onClick={onClick} style={{padding:"8px 16px",borderRadius:8,border:`2px solid ${active?color:"var(--border)"}`,background:active?color+"18":"var(--bg)",color:active?color:"var(--text3)",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}>
      {label}
    </button>
  );

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal-box fu" style={{maxWidth:640}}>
        <div className="modal-header">
          <div>
            <div style={{fontSize:16,fontWeight:700,color:"var(--text)"}}>✍ Client Sign-Off — {ticket.ref}</div>
            <div style={{fontSize:12,color:"var(--text3)",marginTop:2}}>{ticket.clientName||ticket.name}
              {" · "}
              <span style={{color:signoffStep===1?AC:"var(--text4)",fontWeight:600}}>Step 1: Satisfaction</span>
              {" → "}
              <span style={{color:signoffStep===2?AC:"var(--text4)",fontWeight:600}}>Step 2: Signature</span>
            </div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">

          {/* ── STEP 1: SATISFACTION SURVEY ── */}
          {signoffStep===1&&(
            <div>
              <div style={{background:"rgba(0,200,150,0.06)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:10,padding:"12px 16px",marginBottom:18,fontSize:13,color:"var(--text2)"}}>
                📋 Please answer a few quick questions before the client signs off. This helps us maintain service quality.
              </div>

              {/* Q1 — Overall satisfaction */}
              <div style={{marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:8}}>1. Is the client satisfied with the service and outcome? <span style={{color:"#F87171"}}>*</span></div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <SurveyChip val="yes" label="✅ Yes — Fully Satisfied" active={satisfaction==="yes"} color="#10B981" onClick={()=>setSatisfaction("yes")}/>
                  <SurveyChip val="partial" label="⚠️ Partially Satisfied" active={satisfaction==="partial"} color="#F59E0B" onClick={()=>setSatisfaction("partial")}/>
                  <SurveyChip val="no" label="❌ Not Satisfied" active={satisfaction==="no"} color="#EF4444" onClick={()=>setSatisfaction("no")}/>
                </div>
                {satisfaction==="no"&&(
                  <div style={{marginTop:10,padding:"10px 14px",background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:8,fontSize:12,color:"#F87171"}}>
                    ⚠️ Client is not satisfied. Please resolve any outstanding issues before proceeding to sign-off. You may still record the sign-off after discussion.
                  </div>
                )}
              </div>

              {/* Q2 — Service Rating */}
              <div style={{marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:8}}>2. How would the client rate our overall service quality?</div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  {RATINGS.map(r=>(
                    <button key={r} onClick={()=>setServiceRating(r)} style={{width:40,height:40,borderRadius:8,border:`2px solid ${serviceRating>=r?"#F59E0B":"var(--border)"}`,background:serviceRating>=r?"rgba(245,158,11,0.15)":"var(--bg)",color:serviceRating>=r?"#F59E0B":"var(--text4)",fontSize:18,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}>
                      ★
                    </button>
                  ))}
                  {serviceRating>0&&<span style={{fontSize:12,color:"#F59E0B",fontWeight:700,marginLeft:4}}>{ratingLabels[serviceRating]}</span>}
                </div>
              </div>

              {/* Q3 — Response time */}
              <div style={{marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:8}}>3. Was the response and turnaround time acceptable?</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {["Yes, very prompt","Acceptable","Could be faster","Too slow"].map(opt=>(
                    <SurveyChip key={opt} label={opt} active={responseTime===opt} color={AC} onClick={()=>setResponseTime(opt)}/>
                  ))}
                </div>
              </div>

              {/* Q4 — Would recommend */}
              <div style={{marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:8}}>4. Would the client recommend Cyber I.T Masters to others?</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <SurveyChip label="👍 Definitely Yes" active={wouldRecommend==="yes"} color="#10B981" onClick={()=>setWouldRecommend("yes")}/>
                  <SurveyChip label="🤔 Maybe" active={wouldRecommend==="maybe"} color="#F59E0B" onClick={()=>setWouldRecommend("maybe")}/>
                  <SurveyChip label="👎 Probably Not" active={wouldRecommend==="no"} color="#EF4444" onClick={()=>setWouldRecommend("no")}/>
                </div>
              </div>

              {/* Q5 — Additional feedback */}
              <div style={{marginBottom:20}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:6}}>5. Any additional comments or feedback from the client? (optional)</div>
                <textarea className="field-input" style={{minHeight:72,marginTop:2}} value={clientFeedback} onChange={e=>setClientFeedback(e.target.value)} placeholder="e.g. Engineer was very helpful and professional..."/>
              </div>

              {/* Google Review nudge */}
              {(satisfaction==="yes"||(satisfaction==="partial"&&serviceRating>=3))&&(
                <div style={{background:"rgba(251,191,36,0.07)",border:"1px solid rgba(251,191,36,0.25)",borderRadius:10,padding:"12px 16px",marginBottom:18,display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:28}}>⭐</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:2}}>Remind client to leave a Google Review</div>
                    <div style={{fontSize:11,color:"var(--text3)",marginBottom:6}}>It only takes 30 seconds and helps our business grow. Show the client this link:</div>
                    <a href={CFG.googleReview} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,background:"#F59E0B",color:"#050810",padding:"6px 14px",borderRadius:7,fontSize:12,fontWeight:700,textDecoration:"none"}}>
                      ⭐ Open Google Review →
                    </a>
                  </div>
                </div>
              )}

              <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                <button className="btn btn-primary" disabled={!satisfaction} onClick={()=>{if(satisfaction)setSignoffStep(2);}}>
                  {satisfaction?"Next — Capture Signature →":"Select satisfaction to continue"}
                </button>
              </div>
            </div>
          )}

          {/* ── STEP 2: NAME + SIGNATURE ── */}
          {signoffStep===2&&(
            <div>
              {satisfaction==="partial"&&(
                <div style={{background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:8,padding:"8px 14px",marginBottom:14,fontSize:12,color:"#F59E0B"}}>
                  ⚠️ Partial satisfaction recorded — ensure any pending items are logged in the ticket notes.
                </div>
              )}
              {satisfaction==="no"&&(
                <div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:8,padding:"8px 14px",marginBottom:14,fontSize:12,color:"#F87171"}}>
                  ⚠️ Client recorded as not satisfied. Sign-off is being captured for documentation purposes.
                </div>
              )}
              {serviceRating>0&&(
                <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:20,padding:"4px 12px",marginBottom:14,fontSize:11,color:"#F59E0B",fontWeight:700}}>
                  {"★".repeat(serviceRating)}{"☆".repeat(5-serviceRating)} {ratingLabels[serviceRating]} rating recorded
                </div>
              )}
              <div style={{display:"flex",gap:10,marginBottom:12}}>
                <div style={{flex:1}}>
                  <Lbl c="Client Name *"/>
                  <input className="field-input" style={{marginTop:4}} type="text" placeholder="Full name" value={clientName} onChange={e=>setClientName(e.target.value)}/>
                </div>
                <div style={{flex:1}}>
                  <Lbl c="Position / Designation"/>
                  <input className="field-input" style={{marginTop:4}} type="text" placeholder="e.g. IT Manager, Owner" value={clientPosition} onChange={e=>setClientPosition(e.target.value)}/>
                </div>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Client Signature</div>
              <canvas id="signature-pad" width="600" height="180" style={{width:"100%",border:"1px solid var(--border2)",borderRadius:10,background:"#fff",display:"block",touchAction:"none"}}/>
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button id="clearSignature" className="btn btn-secondary btn-sm">🗑 Clear Signature</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>setSignoffStep(1)}>← Back to Survey</button>
                <div style={{flex:1}}/>
                <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                <button className="btn btn-primary" onClick={()=>onSave(ticket,{satisfaction,serviceRating,responseTime,wouldRecommend,clientFeedback})}>✅ Save Sign-Off</button>
              </div>
              {ticket.clientSignoff?.signed&&(
                <div style={{marginTop:12,background:"rgba(16,185,129,0.08)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#10B981"}}>
                  ✓ Previously signed by <strong>{ticket.clientSignoff.clientName}</strong> on {new Date(ticket.clientSignoff.signedAt).toLocaleString("en-ZA")}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Admin({tickets,loading,authed,onAuth,onUpdate,onAddNote,onBack,onNewTicket,theme,toggleTheme}){
  const [pw,setPw]=useState(""); const [pwErr,setPwErr]=useState("");
  const [sel,setSel]=useState(null);
  const [fSt,setFSt]=useState("all"); const [fTy,setFTy]=useState("all"); const [fEng,setFEng]=useState("all");
  const [srch,setSrch]=useState("");
  const [note,setNote]=useState(""); const [eqRef,setEqRef]=useState("");
  const [saving,setSaving]=useState(false);
  const [activeTab,setActiveTab]=useState("tickets");
  const [detailTab,setDetailTab]=useState("overview"); // ← NEW: overview | chat | notes | actions

  /* ── NEW: engineer identity & presence ── */
  const [activeEngineer,setActiveEngineer]=useState("Unassigned");
  const [onlineEngineers,setOnlineEngineers]=useState({});
  const [chatCounts,setChatCounts]=useState({}); // ticketRef → message count

  /* ── NEW: track chat unread per ticket ── */
  const [lastRead,setLastRead]=useState({}); // ticketRef → timestamp when chat tab last opened

  // Modals
  const [statusModal,setStatusModal]=useState(null);
  const [partsModal,setPartsModal]=useState(null);
  const [historyModal,setHistoryModal]=useState(null);
  const [fixesModal,setFixesModal]=useState(false);
  const [followUpModal,setFollowUpModal]=useState(false);
  const [signoffModal,setSignoffModal]=useState(null);
  const [clientName,setClientName]=useState("");
  const [clientPosition,setClientPosition]=useState("");

  /* ── NEW: Subscribe to presence from RTDB ── */
  useEffect(()=>{
    if(!authed) return;
    const ref=rtdb.ref("presence");
    const handler=snap=>setOnlineEngineers(snap.val()||{});
    ref.on("value",handler);
    return()=>ref.off("value",handler);
  },[authed]);

  /* ── NEW: Subscribe to chat message counts (lightweight) ── */
  useEffect(()=>{
    if(!authed||!tickets.length) return;
    const unsubs=[];
    tickets.forEach(t=>{
      const ref=chatRef(t.ref);
      const handler=snap=>{
        const count=snap.numChildren();
        setChatCounts(prev=>({...prev,[t.ref]:count}));
      };
      ref.on("value",handler);
      unsubs.push(()=>ref.off("value",handler));
    });
    return()=>unsubs.forEach(u=>u());
  },[authed,tickets.length]);

  /* ── SIGNATURE PAD EFFECT ── */
  useEffect(()=>{
    if(!signoffModal) return;
    const canvas=document.getElementById("signature-pad");
    if(!canvas) return;
    const ctx=canvas.getContext("2d");
    let drawing=false;
    const getXY=(e)=>{
      const rect=canvas.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      return[src.clientX-rect.left,src.clientY-rect.top];
    };
    const start=(e)=>{e.preventDefault();drawing=true;const[x,y]=getXY(e);ctx.beginPath();ctx.moveTo(x,y);};
    const move=(e)=>{e.preventDefault();if(!drawing)return;const[x,y]=getXY(e);ctx.lineWidth=2;ctx.lineCap="round";ctx.strokeStyle="#00C896";ctx.lineTo(x,y);ctx.stroke();};
    const stop=()=>{drawing=false;};
    canvas.addEventListener("mousedown",start);
    canvas.addEventListener("mousemove",move);
    canvas.addEventListener("mouseup",stop);
    canvas.addEventListener("touchstart",start,{passive:false});
    canvas.addEventListener("touchmove",move,{passive:false});
    canvas.addEventListener("touchend",stop);
    // Clear button
    const clearBtn=document.getElementById("clearSignature");
    const clearFn=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);};
    if(clearBtn) clearBtn.addEventListener("click",clearFn);
    return()=>{
      canvas.removeEventListener("mousedown",start);
      canvas.removeEventListener("mousemove",move);
      canvas.removeEventListener("mouseup",stop);
      canvas.removeEventListener("touchstart",start);
      canvas.removeEventListener("touchmove",move);
      canvas.removeEventListener("touchend",stop);
      if(clearBtn) clearBtn.removeEventListener("click",clearFn);
    };
  },[signoffModal]);

  /* ── SAVE CLIENT SIGN-OFF ── */
  const saveClientSignoff=async(ticket)=>{
    if(!clientName.trim()){alert("Please enter the client name.");return;}
    const canvas=document.getElementById("signature-pad");
    const signatureImage=canvas.toDataURL("image/png");
    try{
      await db.collection("tickets").doc(ticket.ref).update({
        clientSignoff:{signed:true,clientName,clientPosition,signedAt:new Date().toISOString(),signatureImage},
        status:"awaiting-signoff",
        updatedAt:ts()
      });
      try{await sendSysMsg(ticket.ref,`Client sign-off captured — ${clientName} (${clientPosition||"no position"})`);}catch(e){}
      showToast("Client sign-off saved ✓");
      setSignoffModal(null);
    }catch(e){console.error(e);alert("Failed to save sign-off. Please try again.");}
  };

  const tryLogin=()=>{if(pw===CFG.adminPw)onAuth();else setPwErr("Incorrect password");};

  if(!authed)return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="card fu" style={{maxWidth:340,width:"100%",padding:32}}>
        <div style={{width:44,height:44,borderRadius:11,background:`linear-gradient(135deg,${AC},${AC2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,marginBottom:16}}>🔐</div>
        <div style={{fontSize:20,fontWeight:700,color:"var(--text)",marginBottom:4}}>Admin Access</div>
        <div style={{fontSize:13,color:"var(--text3)",marginBottom:20}}>Sign in to manage your tickets</div>
        <Lbl c="Password"/>
        <input className="field-input" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryLogin()} placeholder="Enter password" autoFocus style={{marginBottom:8,marginTop:4}}/>
        {pwErr&&<div style={{color:"#F87171",fontSize:12,marginBottom:8}}>{pwErr}</div>}
        <button className="btn btn-primary" style={{width:"100%",marginTop:8}} onClick={tryLogin}>Login →</button>
        <button onClick={onBack} className="btn btn-ghost" style={{width:"100%",marginTop:8,fontSize:12}}>← Back to Customer Portal</button>
      </div>
    </div>
  );

  const filtered=tickets.filter(t=>{
    if(fSt!=="all"&&t.status!==fSt)return false;
    if(fTy!=="all"&&t.serviceType!==fTy)return false;
    if(fEng!=="all"&&(t.assignedEngineer||"Unassigned")!==fEng)return false;
    const hay=`${t.ref} ${t.clientName||""} ${t.name||""} ${t.issueTitle||""} ${t.problemDescription||""} ${t.phone||""} ${t.company||""}`.toLowerCase();
    if(srch&&!hay.includes(srch.toLowerCase()))return false;
    return true;
  });

  const tk=sel?tickets.find(t=>t.ref===sel):null;
  const counts=Object.keys(ST).reduce((a,k)=>{a[k]=tickets.filter(t=>t.status===k).length;return a;},{});
  const overdueCount=tickets.filter(t=>{const info=getSLAInfo(t);return info&&info.status==="breach";}).length;

  /* ── NEW: count online engineers ── */
  const onlineList=Object.entries(onlineEngineers)
    .filter(([,v])=>v&&v.online)
    .map(([k,v])=>({name:k.replace(/_/g," "),...v}));

  /* ── NEW: unread chat count for selected ticket ── */
  const chatUnread=(ref)=>{
    const total=chatCounts[ref]||0;
    const read=lastRead[ref]||0;
    return total>0&&read===0?total:0; // simple: show count until user opens chat tab
  };

  const totalChatActivity=Object.values(chatCounts).reduce((a,c)=>a+c,0);

  const doStatusClick=(ticket,newStatus)=>{
    if(newStatus==="closed"&&!ticket.clientSignoff?.signed){
      alert("A client sign-off is required before closing this ticket. Please use the ✍ Client Sign-Off button in the Actions tab.");
      return;
    }
    if(NOTIFY_STATUSES.includes(newStatus)){
      setStatusModal({ticket,newStatus});
    } else {
      onUpdate(ticket.ref,{status:newStatus});
    }
  };

  const confirmStatusUpdate=async(statement)=>{
    const {ticket,newStatus}=statusModal;
    await onUpdate(ticket.ref,{status:newStatus});
    if(statement.trim()){
      await onAddNote(ticket.ref,`[Status → ${ST[newStatus]?.l}] ${statement}`,"engineer-note","");
    }
    // NEW: post system message to chat
    try{await sendSysMsg(ticket.ref,`Status updated to "${ST[newStatus]?.l}" by ${activeEngineer}${statement?` · ${statement.slice(0,80)}`:""}`)}catch(e){}
    setStatusModal(null);
  };

  const doNote=async()=>{if(!note.trim())return;setSaving(true);await onAddNote(sel,note.trim());setNote("");setSaving(false);};
  const doQuote=async()=>{setSaving(true);await onUpdate(sel,{quotationRef:eqRef});setSaving(false);};
  const doAssign=async(eng)=>{
    await onUpdate(tk.ref,{assignedEngineer:eng});
    // NEW: if the active engineer changes, update their presence
    if(eng!=="Unassigned") setActiveEngineer(eng);
    // NEW: log to chat
    try{await sendSysMsg(tk.ref,`Assigned to ${eng}`)}catch(e){}
  };
  const doSaveParts=async(parts)=>{setSaving(true);await onUpdate(partsModal.ref,{parts});setPartsModal(null);setSaving(false);};

  /* ── NEW: WA forward handler for chat messages ── */
  const handleWaForward=(ticket,msgText)=>{
    const url=waUrl(ticket.phone,
      `📋 *${ticket.ref}* — Update from ${CFG.bizName}\n\n${msgText}\n\n_Reply to this message with your reference number to respond._`
    );
    window.open(url,"_blank");
  };

  /* ── NEW: open chat tab and mark as read ── */
  const openChatTab=()=>{
    setDetailTab("chat");
    if(sel) setLastRead(prev=>({...prev,[sel]:Date.now()}));
  };

  return(
    <div className="main-layout">
      {/* Modals */}
      {statusModal&&<StatusUpdateModal ticket={statusModal.ticket} newStatus={statusModal.newStatus} onConfirm={confirmStatusUpdate} onCancel={()=>setStatusModal(null)}/>}
      {partsModal&&<PartsModal ticket={partsModal} onSave={doSaveParts} onClose={()=>setPartsModal(null)}/>}
      {historyModal&&<ClientHistoryModal ticket={historyModal} allTickets={tickets} onClose={()=>setHistoryModal(null)}/>}
      {fixesModal&&<KnownFixesModal onInsert={txt=>setNote(n=>n?n+"\n\n"+txt:txt)} onClose={()=>setFixesModal(false)}/>}
      {followUpModal&&<FollowUpModal tickets={tickets} onClose={()=>setFollowUpModal(false)}/>}
      {signoffModal&&<SignoffModal ticket={signoffModal} clientName={clientName} setClientName={setClientName} clientPosition={clientPosition} setClientPosition={setClientPosition} onSave={saveClientSignoff} onClose={()=>setSignoffModal(null)}/>}

      {/* ── SIDEBAR ── */}
      <div className="sidebar">
        <div className="sidebar-logo">
          <div className="brand">
            <div className="icon">⚡</div>
            <div><div className="name">{CFG.bizName}</div><div className="sub">Admin Portal</div></div>
          </div>
        </div>
        <div className="sidebar-nav">
          <div className="nav-section">
            <div className="nav-label">Tickets</div>
            <button className={`nav-item${activeTab==="tickets"?" active":""}`} onClick={()=>setActiveTab("tickets")}><span className="ni">🎫</span>All Tickets{tickets.length>0&&<span className="badge">{tickets.length}</span>}</button>
            <button className={`nav-item${activeTab==="new"?" active":""}`} onClick={()=>setActiveTab("new")}><span className="ni">✏️</span>Log New Ticket</button>
          </div>

          {/* ── NEW: Live Chat nav section ── */}
          <div className="nav-section">
            <div className="nav-label">Live Chat</div>
            <div className="nav-item" style={{cursor:"default"}}>
              <span className="ni">💬</span>
              <span style={{flex:1}}>Team Chat</span>
              {totalChatActivity>0&&<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:AC}}>{totalChatActivity}</span>}
            </div>
            {/* Online engineers */}
            <div style={{padding:"4px 8px 6px"}}>
              <div style={{fontSize:9,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:5,paddingLeft:4}}>Online Now</div>
              {onlineList.length===0&&(
                <div style={{fontSize:10,color:"var(--text4)",padding:"4px 8px"}}>No engineers online</div>
              )}
              {onlineList.map(e=>(
                <div key={e.name} className="presence-row">
                  <div className="presence-online-dot"/>
                  <span className="presence-name">{e.name}</span>
                  {e.ticket&&<span style={{fontSize:9,color:AC,fontFamily:"'IBM Plex Mono',monospace",marginLeft:"auto"}}>{e.ticket}</span>}
                </div>
              ))}
            </div>
            {/* My engineer identity */}
            <div style={{padding:"4px 10px 2px"}}>
              <div style={{fontSize:9,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Your Identity</div>
              <select className="field-input" style={{fontSize:11,padding:"5px 8px"}} value={activeEngineer} onChange={e=>setActiveEngineer(e.target.value)}>
                {ENGINEERS.map(eng=><option key={eng}>{eng}</option>)}
              </select>
            </div>
          </div>

          <div className="nav-section">
            <div className="nav-label">Status Filter</div>
            <button className={`nav-item${fSt==="all"?" active":""}`} onClick={()=>setFSt("all")}><span className="ni">📋</span>All<span style={{marginLeft:"auto",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:"var(--text3)"}}>{tickets.length}</span></button>
            {Object.entries(ST).map(([k,v])=>(
              <button key={k} className={`nav-item${fSt===k?" active":""}`} onClick={()=>setFSt(k)} style={{color:fSt===k?v.c:undefined,background:fSt===k?v.c+"14":undefined}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:v.c,display:"inline-block",flexShrink:0}}/>
                {v.l}<span style={{marginLeft:"auto",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:"var(--text3)"}}>{counts[k]||0}</span>
              </button>
            ))}

                  {/* ── TAB: LIVE CHAT (NEW) ── */}

                  {detailTab==="notes"&&(

                            <div className="note-text">{n.txt}</div>
                            <div className="note-meta">{new Date(n.at).toLocaleString("en-ZA")}</div>
                          </div>
                        ))}
                      </div>

                      <button className="btn btn-primary btn-sm" onClick={doNote} disabled={saving}>{saving?"Saving…":"Add Note"}</button>
                    </div>
                  )}

                  {/* ── TAB: QUICK ACTIONS (NEW) ── */}
                  {detailTab==="actions"&&(
                    <div className="detail-body">

                      <div style={{marginBottom:16}}>

                          💬 WhatsApp Smart Sync
                        </div>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>

                          <a href={waUrl(CFG.wa,buildBusinessMsg(tk))} target="_blank" rel="noreferrer" className="btn btn-sm" style={{background:"rgba(14,165,233,0.1)",border:"1px solid rgba(14,165,233,0.2)",color:AC2}}>📲 Notify Business</a>
                          {tk.email&&<a href={`mailto:${tk.email}?subject=Re: Ticket ${tk.ref}`} className="btn btn-email btn-sm">✉️ Email Client</a>}
                        </div>
                        {/* Status-based WA messages */}
                        <div style={{fontSize:10,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6,marginTop:12}}>Quick Status WA Messages</div>
                        <div style={{display:"flex",flexDirection:"column",gap:5}}>
                          {NOTIFY_STATUSES.map(s=>(
                            <a key={s} href={waUrl(tk.phone,buildStatusUpdateMsg(tk,s,"See update below."))} target="_blank" rel="noreferrer"
                              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,border:`1px solid ${ST[s]?.c||"var(--border)"}20`,background:`${ST[s]?.c||"var(--bg)"}10`,fontSize:11,fontWeight:600,color:ST[s]?.c||"var(--text2)",textDecoration:"none"}}>
                              <span style={{fontSize:14}}>{{resolved:"✅",closed:"🔒",awaiting:"📦","in-progress":"🔧"}[s]||"📋"}</span>
                              Send "{ST[s]?.l}" WA Update
                            </a>
                          ))}
                        </div>
                      </div>

                      <div className="divider"/>

                      {/* Document Actions */}
                      <div style={{fontSize:10,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Documents & History</div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                        <button className="btn btn-pdf btn-sm" onClick={()=>generateJobCard(tk)}>🖨️ Job Card PDF</button>
                        <button className="btn btn-secondary btn-sm" onClick={()=>setHistoryModal(tk)}>👤 Client History</button>
                        <button className="btn btn-secondary btn-sm" onClick={()=>setPartsModal(tk)}>🔩 Manage Parts</button>
                        <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>setFixesModal(true)}>💡 Known Fixes</button>
                        <button className="btn btn-primary btn-sm" onClick={()=>{setClientName(tk.clientName||tk.name||"");setClientPosition("");setSignoffModal(tk);}}>✍ Client Sign-Off</button>
                      </div>
                      {tk.clientSignoff?.signed&&(
                        <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"#10B981",color:"#fff",padding:"5px 12px",borderRadius:20,fontWeight:700,fontSize:12,marginBottom:8}}>
                          ✓ Client Signed — {tk.clientSignoff.clientName}
                          {tk.clientSignoff.signatureImage&&<img src={tk.clientSignoff.signatureImage} alt="sig" style={{height:24,borderRadius:4,background:"#fff",marginLeft:4}}/>}
                        </div>
                      )}

                      <div className="divider"/>

                      {/* Chat to WA bridge */}
                      <div style={{fontSize:10,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>
                        🔗 Chat → WhatsApp Bridge
                      </div>
                      <div style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",marginBottom:8,fontSize:12,color:"var(--text3)",lineHeight:1.6}}>
                        Open the <strong style={{color:AC}}>💬 Chat</strong> tab and tap the <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,background:"rgba(37,211,102,0.12)",color:"#25D366",padding:"1px 5px",borderRadius:4}}>💬 WA</span> button next to any message to instantly forward it to the client on WhatsApp.
                      </div>
                      <button className="btn btn-primary btn-sm" onClick={openChatTab} style={{width:"100%"}}>
                        Open Team Chat →
                      </button>
                    </div>
                  )}
                </>
              )}
              {!tk&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",color:"var(--text4)",fontSize:14,flexDirection:"column",gap:8}}>
                  <span style={{fontSize:32}}>📋</span>
                  <span>Select a ticket to view details</span>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

  const [dbLoading,setDbLoading]=useState(true);
  const [lastTicket,setLastTicket]=useState(null);
  const [adminAuthed,setAdminAuthed]=useState(false);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"ok"});
  const [theme,setTheme]=useState("dark");

  const toggleTheme=()=>{
    setTheme(t=>{
      const next=t==="dark"?"light":"dark";
      document.body.className=next;
      return next;
    });
  };

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3000);};

  useEffect(()=>{
    const unsub=db.collection("tickets").orderBy("createdAt","desc")
      .onSnapshot(snap=>{setTickets(snap.docs.map(d=>({id:d.id,...d.data()})));setDbLoading(false);},
      err=>{console.error(err);setDbLoading(false);showToast("Firebase error","error");});
    return()=>unsub();
  },[]);

  const addTicket=async(form)=>{
    setSaving(true);
    try{
      const num=await nextTicketNumber();
      const ref=makeTktRef(num);
      const ticket={...form,ref,ticketNumber:num,status:"open",createdAt:ts(),updatedAt:ts(),notes:[],quotationRef:"",parts:[],assignedEngineer:form.assignedEngineer||"Unassigned",clientSignoff:{signed:false,clientName:"",clientPosition:"",signedAt:null,signatureImage:""}};
      await db.collection("tickets").doc(ref).set(ticket);
      // NEW: post opening system message to RTDB chat
      try{await sendSysMsg(ref,`Ticket ${ref} created — ${SVCS.find(s=>s.id===form.serviceType)?.label||form.serviceType}`);}catch(e){}
      setLastTicket(ticket);
      if(view==="admin")showToast(`Ticket ${ref} created ✓`);
      else setView("success");
    }catch(e){console.error(e);showToast("Failed to save ticket","error");}
    setSaving(false);
  };

  const updateTicket=async(ref,changes)=>{try{await fsUpdate(ref,changes);showToast("Updated ✓");}catch(e){console.error(e);showToast("Update failed","error");}};
  const addNote=async(ref,txt,type="note",engineer="")=>{try{await fsNote(ref,txt,type,engineer);showToast("Note added ✓");}catch(e){console.error(e);showToast("Note failed","error");}};

  if(dbLoading)return<Spinner/>;

  return(
    <>
      {view==="portal"&&(
        <div style={{minHeight:"100vh",background:"var(--bg)"}}>
          <TicketForm mode="customer" onSubmit={addTicket} saving={saving} theme={theme} toggleTheme={toggleTheme}/>
          <button onClick={()=>setView("admin")}
            style={{position:"fixed",bottom:20,right:20,background:`linear-gradient(135deg,${AC},${AC2})`,color:"#050810",border:"none",borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",zIndex:100,boxShadow:"0 4px 20px rgba(0,200,150,0.3)"}}>
            🔐 Admin
          </button>
        </div>
      )}
      {view==="success"&&lastTicket&&<SuccessScreen ticket={lastTicket} onBack={()=>setView("portal")}/>}
      {view==="admin"&&<Admin tickets={tickets} loading={dbLoading} authed={adminAuthed} onAuth={()=>setAdminAuthed(true)} onUpdate={updateTicket} onAddNote={addNote} onBack={()=>setView("portal")} onNewTicket={addTicket} theme={theme} toggleTheme={toggleTheme}/>}
      <Toast msg={toast.msg} type={toast.type}/>
    </>
  );
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
</body>
</html>
