<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',sans-serif;transition:background 0.3s,color 0.3s;}

/* ── THEME VARIABLES ── */
body.dark{
  --bg:#050810;--bg2:#080D18;--bg3:#0D1624;--bg4:#050810;
  --border:#0F1C2E;--border2:#1E2A3A;
  --text:#E2E8F0;--text2:#94A3B8;--text3:#475569;--text4:#334155;
  --card:#080D18;--sidebar:#080D18;
  color:#E2E8F0;background:#050810;
}
body.light{
  --bg:#F0F4F8;--bg2:#FFFFFF;--bg3:#EBF0F7;--bg4:#F8FAFC;
  --border:#DDE3EE;--border2:#C8D1E0;
  --text:#1A2332;--text2:#4A5568;--text3:#718096;--text4:#A0AEC0;
  --card:#FFFFFF;--sidebar:#FFFFFF;
  color:#1A2332;background:#F0F4F8;
}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00C896!important;box-shadow:0 0 0 3px rgba(0,200,150,0.1)!important;}
input[type="file"]{display:none;}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.4);}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.fu{animation:fadeUp 0.35s ease forwards;}
.si{animation:slideIn 0.3s ease forwards;}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;}
.card-body{padding:20px;}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;color:var(--text);}

/* ── FORMS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.field-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;}
.field-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 13px;color:var(--text);font-size:13px;transition:border 0.2s,box-shadow 0.2s;width:100%;}
.field-input::placeholder{color:var(--text4);}
select.field-input{cursor:pointer;}
textarea.field-input{resize:vertical;min-height:88px;line-height:1.6;}
.field-error{font-size:11px;color:#F87171;margin-top:2px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#00C896,#0EA5E9);color:#050810;padding:10px 20px;font-size:13px;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text2);padding:9px 18px;font-size:13px;}
.btn-secondary:hover{border-color:var(--border2);color:var(--text);}
.btn-ghost{background:transparent;color:var(--text3);padding:8px 14px;font-size:13px;border:none;}
.btn-ghost:hover{color:var(--text2);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-wa{background:#25D366;color:#fff;padding:10px 18px;font-size:13px;border-radius:8px;}
.btn-email{background:#3B82F6;color:#fff;padding:10px 18px;font-size:13px;border-radius:8px;}

/* ── BADGE / STATUS ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;}

/* ── SEARCH & UTILITY ── */
.searchbar{position:relative;}
.searchbar input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-size:13px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.5);animation:toastIn 0.3s ease;}
.toast.ok{background:#00C896;color:#050810;}
.toast.error{background:#EF4444;color:#fff;}
.toast.info{background:#0EA5E9;color:#fff;}

/* ── PORTAL ── */
.portal-wrap{min-height:100vh;background:var(--bg);}
.portal-header{background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);}
.portal-header-inner{max-width:760px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;height:58px;}
.portal-main{max-width:760px;margin:0 auto;padding:40px 20px 80px;}

/* ── QUICK LINKS ── */
.ql-bar{background:var(--bg2);border-bottom:1px solid var(--border);}
.ql-inner{max-width:760px;margin:0 auto;padding:9px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ql-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;}

/* ── PHOTO UPLOAD ── */
.photo-drop{border:2px dashed var(--border2);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;}
.photo-drop:hover,.photo-drop.over{border-color:#00C896;background:rgba(0,200,150,0.03);}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.photo-thumb{position:relative;}
.photo-thumb img{width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid rgba(0,200,150,0.3);}
.photo-rm{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#EF4444;border:none;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}

/* ── WA PREVIEW ── */
.wa-preview{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;}
.wa-bubble{background:rgba(0,200,150,0.08);border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.7;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;}

/* ── SPINNER ── */
.spinner-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);flex-direction:column;gap:16px;}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(0,200,150,0.2);border-top-color:#00C896;animation:spin 0.75s linear infinite;}

/* ── RADIO CHIPS ── */
.radio-chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px;}
.chip{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);color:var(--text3);transition:all 0.2s;user-select:none;}
.chip.active{border-color:#00C896;background:rgba(0,200,150,0.08);color:#00C896;font-weight:600;}

/* ── THEME TOGGLE ── */
.theme-toggle{width:36px;height:20px;border-radius:10px;background:var(--border2);border:none;position:relative;cursor:pointer;transition:background 0.3s;flex-shrink:0;}
.theme-toggle::after{content:"";position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#00C896;transition:left 0.3s;}
body.dark .theme-toggle::after{left:3px;}
body.light .theme-toggle::after{left:19px;}

/* ── MOBILE ── */
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
  .portal-header-inner{padding:0 16px;}
}

/* ── ENHANCED MOBILE FIXES ── */
.support-cards{display:grid;}
.review-grid{display:grid;}
.header-actions{display:flex;gap:8px;align-items:center;}

@media (max-width:600px){
  .portal-main{padding:20px 14px 60px;}
  .support-cards,.review-grid{grid-template-columns:1fr !important;}
  .hero-title{font-size:24px !important;line-height:1.3 !important;}
  .header-actions a{display:none;}
  .ql-inner{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;}
  .ql-tag{flex-shrink:0;}
  .btn,.btn-sm{width:100%;}
  .card-body{padding:16px;}
  .portal-header-inner{padding:0 12px;}
}


/* ===== MOBILE-FIRST OPTIMIZATION PACK ===== */
@media (max-width:768px){

  .portal-main{
    padding:16px 12px 48px !important;
  }

  .portal-header-inner{
    height:auto !important;
    min-height:58px;
    padding:10px 12px !important;
    gap:10px;
  }

  .support-cards,
  .review-grid,
  .form-grid{
    grid-template-columns:1fr !important;
  }

  .hero-title{
    font-size:22px !important;
    line-height:1.25 !important;
  }

  .card{
    border-radius:14px;
  }

  .card-body{
    padding:14px !important;
  }

  .card-header{
    padding:14px !important;
  }

  .btn,
  .btn-sm,
  .btn-primary,
  .btn-secondary,
  .btn-wa,
  .btn-email{
    width:100%;
    min-height:44px;
  }

  .radio-chips{
    gap:6px;
  }

  .chip{
    flex:1 1 calc(50% - 6px);
    text-align:center;
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ql-inner{
    overflow-x:auto;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .ql-inner::-webkit-scrollbar{
    display:none;
  }

  .ql-tag{
    flex-shrink:0;
  }

  .photo-thumb img{
    width:64px;
    height:64px;
  }

  .wa-bubble{
    font-size:11px;
    overflow-wrap:anywhere;
  }

  .header-actions a{
    display:none !important;
  }

  input.field-input,
  select.field-input,
  textarea.field-input{
    font-size:16px !important; /* prevents iOS zoom */
  }
}

@media (max-width:480px){

  .ticket-steps{
    overflow-x:auto;
    padding-bottom:4px;
  }

  .ticket-steps span{
    font-size:10px !important;
  }

  .chip{
    flex:1 1 100%;
  }

  .portal-main{
    padding:12px 10px 40px !important;
  }

  .card{
    border-radius:12px;
  }
}

</style>

/* ── FIRESTORE HELPERS ── */
async function nextTicketNumber(){
  const ref=db.collection("meta").doc("counter");
  const snap=await ref.get();
  let n=snap.exists?snap.data().val+1:1001;
  await ref.set({val:n});
  return n;
}
function makeTktRef(num){return`CIM-${String(num).padStart(4,"0")}`;}
function ts(){return new Date().toISOString();}
async function fsAdd(t){await db.collection("tickets").doc(t.ref).set(t);}

function waUrl(phone,msg){
  const clean=String(phone||"").replace(/[^0-9]/g,"");
  const num=clean.startsWith("0")?"27"+clean.slice(1):clean;
  return`https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

/* ── TINY UI ATOMS ── */

function Field({l,e,span,children}){return<div className={`form-field${span?" span2":""}`}><Lbl c={l}/>{children}{e&&<div className="field-error">{e}</div>}</div>;}
function Toast({msg,type}){if(!msg)return null;return<div className={`toast ${type||"ok"}`}>{msg}</div>;}
const fi={className:"field-input"};

/* ════════════════════════════════════════════════════
   TICKET FORM (PUBLIC CUSTOMER VERSION)
════════════════════════════════════════════════════ */
function TicketForm({onSubmit,saving,theme,toggleTheme}){
  const [svc,setSvc]=useState("");
  const [f,setF]=useState({
    clientName:"",company:"",phone:"",email:"",address:"",
    deviceType:"",manufacturer:"",modelNumber:"",serialNumber:"",operatingSystem:"",warrantyStatus:"Unknown",
    issueTitle:"",issueDetail:"",problemDescription:"",accessories:"",
    urgency:"Standard (3–5 days)",conditionOnArrival:"Good – No visible damage",
    physicalDamage:"",devicePassword:"",priority:"Medium",contactMethod:"whatsapp",
    preferredDate:"",preferredTime:"",authorized:false,
  });
  const [photos,setPhotos]=useState([]);
  const [err,setErr]=useState({});
  const [step,setStep]=useState(1);
  const fRef=useRef();
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const addPhotos=e=>{const files=Array.from(e.target.files||[]);Promise.all(files.slice(0,5-photos.length).map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({name:f.name,src:rd.result});rd.readAsDataURL(f);})))
    .then(imgs=>setPhotos(p=>[...p,...imgs].slice(0,5)));};
  const onDrop=e=>{e.preventDefault();const files=Array.from(e.dataTransfer.files||[]).filter(f=>f.type.startsWith("image/"));Promise.all(files.slice(0,5-photos.length).map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({name:f.name,src:rd.result});rd.readAsDataURL(f);})))
    .then(imgs=>setPhotos(p=>[...p,...imgs].slice(0,5)));};

  const validate=()=>{
    const e={};
    if(!f.clientName.trim()) e.clientName="Required";
    if(!f.phone.trim()) e.phone="Required";
    if(!svc) e.svc="Please select a service type";
    if(svc==="device"){
      if(!f.deviceType) e.deviceType="Required";

      if(!f.authorized) e.authorized="Authorization required";
    } else {
      if(!f.issueTitle.trim()) e.issueTitle="Required";
    }
    setErr(e);return!Object.keys(e).length;
  };

  const handleSubmit=()=>{
    if(!validate())return;
    onSubmit({...f,serviceType:svc,photos:photos.map(p=>p.name),loggedBy:"customer"});

  const previewTicket={ref:"CIM-XXXX",clientName:f.clientName||"Customer",name:f.clientName,phone:f.phone,email:f.email,company:f.company,priority:f.priority,serviceType:svc,issueTitle:f.issueTitle,problemDescription:f.problemDescription,issueDetail:f.issueDetail,deviceType:f.deviceType,manufacturer:f.manufacturer,modelNumber:f.modelNumber,serialNumber:f.serialNumber,address:f.address,devicePassword:f.devicePassword,loggedBy:"customer",createdAt:new Date().toISOString()};

          </div>

      <div className="ql-bar">
        <div className="ql-inner">
          <span style={{fontSize:10,color:"var(--text4)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em"}}>Quick Links:</span>

        </div>
      </div>

      <div className="portal-main">
        <div style={{marginBottom:28}} className="fu">
          <div style={{display:"inline-flex",alignItems:"center",gap:7,background:"rgba(0,200,150,0.08)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:20,padding:"5px 14px",marginBottom:12}}>

          <p style={{color:"var(--text3)",fontSize:14}}>We'll reach out via WhatsApp or Email — your choice.</p>
        </div>

        <div className="support-cards" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:22}}>🖥️</span>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:2}}>Remote Support?</div><div style={{fontSize:11,color:"var(--text3)"}}>Download AnyDesk first.</div></div>
            <div style={{display:"flex",gap:5}}>
              <a href={CFG.adWin} target="_blank" rel="noreferrer" style={{fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"4px 8px"}}>Win</a>
              <a href={CFG.adMac} target="_blank" rel="noreferrer" style={{fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"4px 8px"}}>Mac</a>
            </div>
          </div>
          <div style={{background:"var(--bg2)",border:"1px solid rgba(14,165,233,0.2)",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:22}}>📊</span>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:2}}>Invoices &amp; Quotes</div><div style={{fontSize:11,color:"var(--text3)"}}>View your billing history.</div></div>
            <a href={CFG.zoho} target="_blank" rel="noreferrer" style={{fontSize:11,fontWeight:700,color:"#fff",background:AC2,borderRadius:6,padding:"6px 10px",whiteSpace:"nowrap"}}>Open →</a>
          </div>
        </div>

        <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:24}}>
          {["Service","Details","Review"].map((s,i)=>(
            <React.Fragment key={i}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",border:`2px solid ${step>=i+1?AC:"var(--border2)"}`,background:step>i?AC:"transparent",color:step>i?"#050810":step===i+1?AC:"var(--text4)",transition:"all 0.25s",flexShrink:0}}>{step>i?"✓":i+1}</div>
                <span style={{fontSize:12,fontWeight:600,color:step>=i+1?"var(--text2)":"var(--text4)",whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i<2&&<div style={{flex:1,height:1,background:step>i+1?AC:"var(--border2)",margin:"0 10px",transition:"all 0.25s",minWidth:20}}/>}
            </React.Fragment>
          ))}
        </div>

        {step===1&&(
          <div className="card fu">
            <div className="card-header"><div className="card-title">What type of support is needed?</div></div>
            <div className="card-body">
              {err.svc&&<div style={{color:"#F87171",fontSize:12,marginBottom:12}}>{err.svc}</div>}
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
                {SVCS.map(sv=>(
                  <button key={sv.id} onClick={()=>setSvc(sv.id)}
                    style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:10,border:`2px solid ${svc===sv.id?AC:"var(--border)"}`,background:svc===sv.id?"rgba(0,200,150,0.06)":"var(--bg)",cursor:"pointer",textAlign:"left",fontFamily:"inherit",position:"relative",transition:"all 0.2s"}}>
                    <span style={{fontSize:24,flexShrink:0}}>{sv.icon}</span>
                    <div>
                      <div style={{fontSize:14,fontWeight:600,color:"var(--text)",marginBottom:2}}>{sv.label}</div>
                      <div style={{fontSize:11,color:"var(--text3)"}}>
                        {sv.id==="device"&&"Hand in a device for diagnosis & repair"}
                        {sv.id==="remote"&&"Remote screen share / desktop assistance"}
                        {sv.id==="onsite"&&"Engineer visits your premises"}
                      </div>
                    </div>
                    {svc===sv.id&&<span style={{position:"absolute",right:14,color:AC,fontSize:18,fontWeight:700}}>✓</span>}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",justifyContent:"flex-end"}}>
                <button className="btn btn-primary" onClick={()=>{if(!svc){setErr({svc:"Please select a service"});}else{setErr({});setStep(2);}}} disabled={!svc}>Continue →</button>
              </div>
            </div>
          </div>
        )}

        {step===2&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}} className="fu">
            <div className="card">
              <div className="card-header"><div className="card-title">Contact Information</div></div>
              <div className="card-body">
                <div className="form-grid">
                  <Field l="Company"><input {...fi} value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Company name"/></Field>
                  <Field l="Full Name *" e={err.clientName}><input {...fi} value={f.clientName} onChange={e=>set("clientName",e.target.value)} placeholder="John Doe"/></Field>
                  <Field l="Phone / WhatsApp *" e={err.phone}><input {...fi} value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="+27 72 665 0565"/></Field>
                  <Field l="Email Address"><input {...fi} type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="john@example.com"/></Field>
                  {svc==="onsite"&&<Field l="Address" span><input {...fi} value={f.address} onChange={e=>set("address",e.target.value)} placeholder="123 Main St, Sandton"/></Field>}
                  {svc==="onsite"&&<><Field l="Preferred Date"><input {...fi} type="date" value={f.preferredDate} onChange={e=>set("preferredDate",e.target.value)}/></Field><Field l="Preferred Time"><input {...fi} type="time" value={f.preferredTime} onChange={e=>set("preferredTime",e.target.value)}/></Field></>}
                </div>
              </div>
            </div>
            {svc==="device"&&(
              <div className="card">
                <div className="card-header"><div className="card-title">Device Information</div></div>
                <div className="card-body">
                  <div className="form-grid">
                    <Field l="Device Type *" e={err.deviceType}><select {...fi} value={f.deviceType} onChange={e=>set("deviceType",e.target.value)}><option value="">Select type…</option>{DEVT.map(d=><option key={d}>{d}</option>)}</select></Field>
                    <Field l="Manufacturer *" e={err.manufacturer}><input {...fi} value={f.manufacturer} onChange={e=>set("manufacturer",e.target.value)} placeholder="Dell, Apple, HP…"/></Field>
                    <Field l="Model Number" span><input {...fi} value={f.modelNumber} onChange={e=>set("modelNumber",e.target.value)} placeholder="MacBook Pro 13″ A2251…"/></Field>
                    <Field l="Serial Number"><input {...fi} value={f.serialNumber} onChange={e=>set("serialNumber",e.target.value)} placeholder="SN-XXXXXXX"/></Field>
                    <Field l="OS / Version"><input {...fi} value={f.operatingSystem} onChange={e=>set("operatingSystem",e.target.value)} placeholder="Windows 11 Pro…"/></Field>
                    <Field l="Warranty" span><div className="radio-chips">{WARR.map(w=><div key={w} className={`chip${f.warrantyStatus===w?" active":""}`} onClick={()=>set("warrantyStatus",w)}>{w}</div>)}</div></Field>
                    <Field l="Condition" span><div className="radio-chips">{COND.map(c=><div key={c} className={`chip${f.conditionOnArrival===c?" active":""}`} onClick={()=>set("conditionOnArrival",c)}>{c}</div>)}</div></Field>
                    <Field l="Physical Damage" span><input {...fi} value={f.physicalDamage} onChange={e=>set("physicalDamage",e.target.value)} placeholder="Describe any damage…"/></Field>
                    <Field l="Accessories" span><input {...fi} value={f.accessories} onChange={e=>set("accessories",e.target.value)} placeholder="Charger, bag, mouse…"/></Field>
                    <Field l="Device Password" span><input {...fi} value={f.devicePassword} onChange={e=>set("devicePassword",e.target.value)} placeholder="PIN / password (optional)"/></Field>
                  </div>
                </div>
              </div>
            )}
            <div className="card">
              <div className="card-header"><div className="card-title">{svc==="device"?"Problem Description":"Issue Details"}</div></div>
              <div className="card-body">
                <div className="form-grid">
                  {svc==="device"
                    ?<Field l="Problem Description *" e={err.problemDescription} span><textarea {...fi} value={f.problemDescription} onChange={e=>set("problemDescription",e.target.value)} placeholder="Describe the issue in detail…" style={{minHeight:80}}/></Field>
                    :<>
                      <Field l="Issue Title *" e={err.issueTitle} span><input {...fi} value={f.issueTitle} onChange={e=>set("issueTitle",e.target.value)} placeholder="e.g. Email not syncing on Outlook"/></Field>
                      <Field l="Detailed Description" span><textarea {...fi} value={f.issueDetail} onChange={e=>set("issueDetail",e.target.value)} placeholder="Steps to reproduce, error messages…" style={{minHeight:80}}/></Field>
                    </>
                  }
                  <Field l="Priority">
                    <div className="radio-chips">{PRIS.map(p=><div key={p} className={`chip${f.priority===p?" active":""}`} onClick={()=>set("priority",p)}>{p}</div>)}</div>
                  </Field>
                  <Field l="Urgency">
                    <div className="radio-chips">{URG.map(u=><div key={u} className={`chip${f.urgency===u?" active":""}`} onClick={()=>set("urgency",u)}>{u}</div>)}</div>
                  </Field>
                  <Field l="Preferred Contact" span>
                    <div className="radio-chips">
                      {[["whatsapp","💬 WhatsApp"],["email","✉️ Email"],["phone","📞 Call"]].map(([v,l])=>(
                        <div key={v} className={`chip${f.contactMethod===v?" active":""}`} onClick={()=>set("contactMethod",v)}>{l}</div>
                      ))}
                    </div>
                  </Field>
                  {svc==="device"&&(
                    <div className="form-field span2">
                      <Lbl c="Photos (optional — up to 5)"/>
                      <div className="photo-drop" onClick={()=>fRef.current.click()} onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add("over");}} onDragLeave={e=>e.currentTarget.classList.remove("over")} onDrop={e=>{e.currentTarget.classList.remove("over");onDrop(e);}}>
                        <input type="file" ref={fRef} accept="image/*" multiple onChange={addPhotos}/>
                        {photos.length===0?<span style={{fontSize:12,color:"var(--text4)"}}>Drag &amp; drop or click to upload device photos</span>:(
                          <div className="photo-grid">
                            {photos.map((p,i)=>(
                              <div key={i} className="photo-thumb">
                                <img src={p.src} alt={p.name}/>
                                <button className="photo-rm" onClick={e=>{e.stopPropagation();setPhotos(ps=>ps.filter((_,j)=>j!==i));}}>✕</button>
                              </div>
                            ))}
                            {photos.length<5&&<div style={{width:72,height:72,border:"1px dashed var(--border2)",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"var(--text4)",cursor:"pointer"}}>+</div>}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
            {svc==="device"&&(
              <div className="card">
                <div className="card-body">
                  <label style={{display:"flex",gap:10,cursor:"pointer",alignItems:"flex-start"}}>
                    <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${f.authorized?"#00C896":"var(--border2)"}`,background:f.authorized?"#00C896":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all 0.2s"}} onClick={()=>set("authorized",!f.authorized)}>
                      {f.authorized&&<span style={{color:"#050810",fontSize:11,fontWeight:700}}>✓</span>}
                    </div>
                    <div>
                      <div style={{fontSize:13,color:"var(--text)",fontWeight:600,marginBottom:2}}>I authorise {CFG.bizName} to diagnose and assess my device *</div>
                      <div style={{fontSize:11,color:"var(--text3)"}}>A quotation will be provided before any repair work begins.</div>
                    </div>
                  </label>
                  {err.authorized&&<div style={{color:"#F87171",fontSize:11,marginTop:8}}>{err.authorized}</div>}
                </div>
              </div>
            )}
            {step===2&&(
              <div style={{display:"flex",gap:10,justifyContent:"space-between"}}>
                <button className="btn btn-secondary" onClick={()=>setStep(1)}>← Back</button>
                <button className="btn btn-primary" onClick={()=>{if(validate())setStep(3);}} disabled={saving}>Review →</button>
              </div>
            )}
          </div>
        )}

        {step===3&&(
          <div className="fu">
            <div className="card" style={{marginBottom:14}}>
              <div className="card-header"><div className="card-title">📋 Review & Confirm</div></div>
              <div className="card-body">
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:10,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>WhatsApp Preview — Customer Confirmation</div>
                  <div className="wa-preview"><div className="wa-bubble">{buildCustomerMsg(previewTicket)}</div></div>
                </div>
                <div className="review-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:12,marginBottom:16}}>
                  {[
                    ["Name",f.clientName],["Phone",f.phone],
                    f.email&&["Email",f.email],f.company&&["Company",f.company],
                    ["Service",SVCS.find(s=>s.id===svc)?.label],["Priority",f.priority],
                    svc==="device"&&f.manufacturer&&["Device",`${f.manufacturer} ${f.modelNumber}`],
                    svc==="device"&&["Issue",f.problemDescription],
                    svc!=="device"&&["Issue",f.issueTitle],
                  ].filter(Boolean).map(([k,v],i)=>(
                    <div key={i} style={{padding:"6px 8px",background:"var(--bg3)",borderRadius:6}}>
                      <div style={{fontSize:9,fontWeight:700,color:"var(--text4)",textTransform:"uppercase",marginBottom:2}}>{k}</div>
                      <div style={{color:"var(--text2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v||"—"}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:10,justifyContent:"space-between"}}>
                  <button className="btn btn-secondary" onClick={()=>setStep(2)}>← Edit</button>
                  <button className="btn btn-primary" onClick={handleSubmit} disabled={saving}>
                    {saving?"Creating ticket…":"✓ Submit Ticket"}
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   SUCCESS SCREEN (PUBLIC)
════════════════════════════════════════════════════ */
function SuccessScreen({ticket,onBack}){
  const [copied,setCopied]=useState(false);
  const copy=()=>{try{navigator.clipboard.writeText(ticket.ref);}catch{}setCopied(true);setTimeout(()=>setCopied(false),2000);};
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <header className="portal-header">
        <div className="portal-header-inner">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:9,background:`linear-gradient(135deg,${AC},${AC2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚡</div>
            <div><div style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>{CFG.bizName}</div><div style={{fontSize:10,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{CFG.tagline}</div></div>
          </div>
        </div>
      </header>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div className="card fu" style={{maxWidth:480,width:"100%",textAlign:"center",padding:36}}>
          <div style={{width:64,height:64,borderRadius:"50%",background:"rgba(0,200,150,0.12)",border:`2px solid ${AC}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,color:AC,margin:"0 auto 20px"}}>✓</div>
          <h2 style={{fontSize:22,fontWeight:800,color:"var(--text)",marginBottom:6}}>Ticket Created!</h2>
          <p style={{color:"var(--text3)",marginBottom:14,fontSize:13}}>Ticket reference number:</p>
          <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--bg)",border:`1px solid ${AC}`,borderRadius:10,padding:"12px 16px",marginBottom:8,justifyContent:"space-between"}}>
            <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:22,color:AC,fontWeight:600}}>{ticket.ref}</span>
            <button onClick={copy} className="btn btn-secondary btn-sm">{copied?"Copied!":"Copy"}</button>
          </div>
          <p style={{color:"var(--text4)",fontSize:11,marginBottom:24}}>Use this reference in all communications &amp; to link quotations.</p>
          <div style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:10,padding:16,marginBottom:16}}>
            <p style={{fontSize:11,fontWeight:700,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Send WhatsApp Confirmations</p>
            <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
              <a href={waUrl(ticket.phone,buildCustomerMsg(ticket))} target="_blank" rel="noreferrer" className="btn btn-wa">💬 Send to Customer</a>
              <a href={waUrl(CFG.wa,buildBusinessMsg(ticket))} target="_blank" rel="noreferrer" className="btn btn-sm" style={{background:"rgba(14,165,233,0.12)",border:"1px solid rgba(14,165,233,0.2)",color:AC2}}>📲 Send to {CFG.bizName}</a>
            </div>
          </div>
          {ticket.email&&<a href={`mailto:${ticket.email}?subject=Support Ticket ${ticket.ref}&body=Hi ${ticket.clientName||ticket.name},%0D%0A%0D%0AYour ticket ${ticket.ref} has been received.%0D%0A%0D%0A${CFG.bizName}`} className="btn btn-email btn-sm" style={{marginBottom:16,display:"inline-flex"}}>✉️ Send Email Confirmation</a>}
          <br/>
          <a href={CFG.zoho} target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm" style={{marginBottom:16,display:"inline-flex"}}>📊 View Zoho Portal</a>
          <br/>
          <button onClick={onBack} className="btn btn-ghost">Log Another Ticket</button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   ROOT (PUBLIC ONLY - NO ADMIN)
════════════════════════════════════════════════════ */
function Root(){
  const [view,setView]=useState("portal");
  const [lastTicket,setLastTicket]=useState(null);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"ok"});
  const [theme,setTheme]=useState("dark");

  const toggleTheme=()=>{
    setTheme(t=>{
      const next=t==="dark"?"light":"dark";
      document.body.className=next;
      return next;
    });
  };

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3000);};

  const addTicket=async(form)=>{
    setSaving(true);
    try{
      const num=await nextTicketNumber();
      const ref=makeTktRef(num);
      const ticket={...form,ref,ticketNumber:num,status:"open",createdAt:ts(),updatedAt:ts(),notes:[],quotationRef:"",parts:[],assignedEngineer:"Unassigned"};
      await fsAdd(ticket);
      setLastTicket(ticket);
      setView("success");
    }catch(e){console.error(e);showToast("Failed to save ticket","error");}
    setSaving(false);
  };

  return(
    <>
      {view==="portal"&&(
        <div style={{minHeight:"100vh",background:"var(--bg)"}}>
          <TicketForm onSubmit={addTicket} saving={saving} theme={theme} toggleTheme={toggleTheme}/>
        </div>
      )}
      {view==="success"&&lastTicket&&<SuccessScreen ticket={lastTicket} onBack={()=>setView("portal")}/>}
      <Toast msg={toast.msg} type={toast.type}/>
    </>
  );
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
</body>
</html>
