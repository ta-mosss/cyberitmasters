<style>
/* ── Design Tokens (MG Brand Colors) ───────────────────────── */
:root{
  --bg:#0a2418;
  --surface:#0e3322;
  --card:#14452d;
  --card-hover:#1a593a;
  --border:#2a6b48;
  --border-subtle:rgba(255,255,255,.06);
  --accent:#34d399;
  --accent2:#6ee7b7;
  --accent3:#f97316;
  --text:#f0fdf4;
  --muted:#a7f3d0;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-accent:0 15px 40px rgba(52,211,153,.15);
  --radius:20px;
  --radius-sm:14px;
  --heading-font:'Bebas Neue',sans-serif;
  --body-font:'Outfit',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --portal-bg:rgba(5,8,16,0.96);
  --portal-border:rgba(52,211,153,.18);
  --portal-btn-from:#34d399;
  --portal-btn-to:#10b981;
  --portal-text:#050810;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background: radial-gradient(circle at top right,rgba(52,211,153,.12),transparent 35%),
              radial-gradient(circle at bottom left,rgba(110,231,183,.08),transparent 35%),
              var(--bg);
  color:var(--text);
  font-family:var(--body-font);
  font-size:16px;
  line-height:1.6;
  overflow-x:hidden;
}

/* ── Skip Link ───────────────────────────────────────────── */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;background:var(--accent);color:var(--bg);font-family:var(--mono);font-size:.8rem;font-weight:700;padding:.6rem 1.2rem;border-radius:0 0 var(--radius-sm) var(--radius-sm);z-index:9999;text-decoration:none;}
.skip-link:focus{position:fixed;left:50%;transform:translateX(-50%);top:0;width:auto;height:auto;outline:2px solid var(--accent2);}

/* ── POPIA Cookie Banner ─────────────────────────────────── */
.cookie-banner{position:fixed;bottom:0;left:0;right:0;z-index:99999;background:rgba(5,8,16,0.98);border-top:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;backdrop-filter:blur(12px);transform:translateY(0);transition:transform .4s ease;}
.cookie-banner.hidden{transform:translateY(110%);pointer-events:none;}
.cookie-banner-text{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.3px;flex:1;min-width:260px;}
.cookie-banner-text a{color:var(--accent2);text-decoration:none;}
.cookie-banner-actions{display:flex;gap:.75rem;flex-shrink:0;}
.cookie-btn{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:.55rem 1.2rem;border-radius:8px;cursor:pointer;border:none;}
.cookie-btn.accept{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--bg);}
.cookie-btn.decline{background:transparent;border:1px solid var(--border);color:var(--muted);}

/* ── Scanline FX ─────────────────────────────────────────── */
@keyframes scanline{0%{transform:translateY(-100%);}100%{transform:translateY(100vh);}}
.scan-line{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(52,211,153,0.3),transparent);animation:scanline 8s linear infinite;pointer-events:none;z-index:500;opacity:.3;}

/* ── Navigation ─────────────────────────────────────────── */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,36,24,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border-subtle);box-shadow:0 4px 20px rgba(0,0,0,.2);padding:0 2rem;}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:1rem;}
.nav-logo{display:flex;align-items:center;gap:.65rem;text-decoration:none;flex-shrink:0;}
.nav-logo img{height:58px;width:auto;display:block;object-fit:contain;}
.nav-logo-text{font-family:var(--heading-font);font-size:1.35rem;letter-spacing:2px;color:var(--accent);white-space:nowrap;line-height:1;}
.nav-logo-text span{color:var(--accent2);}
.nav-links{display:flex;gap:.2rem;list-style:none;flex-wrap:wrap;}
.nav-links a{font-family:var(--mono);font-size:.65rem;color:var(--muted);text-decoration:none;padding:.3rem .6rem;border:1px solid transparent;border-radius:3px;transition:all .2s;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase;}
.nav-links a:hover,.nav-links a.active{color:var(--accent);border-color:var(--accent);background:rgba(52,211,153,0.05);}
.nav-cta{display:inline-flex;align-items:center;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a2418;font-weight:700;text-decoration:none;font-family:var(--mono);font-size:.75rem;letter-spacing:.5px;transition:opacity .2s;}
.nav-cta:hover{opacity:.88;}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:1px solid var(--border);padding:.5rem .6rem;cursor:pointer;border-radius:6px;}
.hamburger span{display:block;width:20px;height:2px;background:var(--accent);transition:all .3s;transform-origin:center;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

/* ── Services Dropdown ───────────────────────────────────── */
.services-dropdown-btn{background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(110,231,183,.08));border:1px solid rgba(52,211,153,.25);border-radius:12px;color:#a7f3d0;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:10px 14px;}
.services-dropdown-menu{display:none;position:absolute;top:46px;left:0;background:rgba(10,36,24,.98);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;min-width:280px;z-index:9999;box-shadow:0 20px 40px rgba(0,0,0,.35);backdrop-filter:blur(18px);}
.services-dropdown-menu a{display:block;padding:14px;border-radius:10px;color:#fff;text-decoration:none;transition:background .2s;}
.services-dropdown-menu a:hover{background:rgba(52,211,153,.08);}
.services-dropdown-nav{position:relative;display:flex;align-items:center;}

/* ── Mobile Drawer ────────────────────────────────────────── */
.mobile-drawer{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(10,36,24,.98);border-bottom:1px solid var(--border);padding:1.5rem 2rem;z-index:999;flex-direction:column;gap:.25rem;overflow-y:auto;max-height:calc(100vh - 64px);}
.mobile-drawer.open{display:flex;}
.mobile-drawer a{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-decoration:none;padding:.7rem 0;border-bottom:1px solid var(--border);letter-spacing:1px;text-transform:uppercase;}
.mobile-drawer a:hover{color:var(--accent);}

/* ── Hero Section ────────────────────────────────────────── */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:6rem 2rem 4rem;overflow:hidden;scroll-margin-top:64px;}
.hero-bg-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;}
.orb1{width:600px;height:600px;background:rgba(52,211,153,0.06);top:-200px;right:-100px;}
.orb2{width:400px;height:400px;background:rgba(110,231,183,0.04);bottom:-100px;left:100px;}
.hero-inner{position:relative;z-index:1;max-width:1200px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
.hero-tag{font-family:var(--mono);font-size:.75rem;color:var(--accent2);letter-spacing:3px;text-transform:uppercase;margin-bottom:1.5rem;display:flex;align-items:center;gap:.75rem;}
.hero-tag::before{content:'';display:inline-block;width:40px;height:1px;background:var(--accent2);}
.hero-logo-badge{display:flex;justify-content:flex-start;margin-bottom:1.5rem;}
.hero h1{font-family:var(--heading-font);font-size:clamp(3rem,5vw,5.5rem);line-height:.95;letter-spacing:2px;margin-bottom:1.5rem;}
.hero h1 .accent-word{color:var(--accent);}
.hero h1 .accent2-word{color:var(--accent2);}
.hero-sub{font-size:1rem;color:var(--muted);max-width:480px;margin-bottom:2.5rem;font-weight:300;line-height:1.7;}
.hero-cta-group{display:flex;gap:1rem;flex-wrap:wrap;}
.hero-right{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.hero-right-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));border:1px solid var(--border-subtle);border-radius:var(--radius);padding:1.8rem 1.5rem;transition:all .3s ease;}
.hero-right-card:hover{transform:translateY(-6px);background:var(--card-hover);border-color:rgba(52,211,153,.35);}
.hero-right-card .rc-icon{font-size:1.8rem;display:block;margin-bottom:.75rem;color:var(--accent);}
.hero-right-card h4{font-family:var(--heading-font);font-size:1.1rem;letter-spacing:1px;margin-bottom:.4rem;}
.hero-right-card p{font-size:.78rem;color:var(--muted);}
.hero-right-card.highlight-card{grid-column:span 2;background:rgba(52,211,153,0.05);border-top:2px solid var(--accent);display:flex;align-items:center;gap:1.5rem;padding:1.2rem 1.5rem;}
.hero-right-card.highlight-card .rc-num{font-family:var(--heading-font);font-size:3rem;color:var(--accent);letter-spacing:2px;line-height:1;flex-shrink:0;}

/* ── Buttons ─────────────────────────────────────────────── */
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);font-family:var(--mono);font-size:.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:.85rem 2rem;border:none;cursor:pointer;text-decoration:none;display:inline-block;border-radius:var(--radius-sm);box-shadow:0 10px 25px rgba(52,211,153,.25);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(52,211,153,.35);opacity:.9;}
.btn-outline{border:1px solid var(--accent2);color:var(--accent2);font-family:var(--mono);font-size:.8rem;letter-spacing:1px;text-transform:uppercase;padding:.85rem 2rem;background:transparent;cursor:pointer;text-decoration:none;display:inline-block;border-radius:var(--radius-sm);}
.btn-outline:hover{background:rgba(110,231,183,0.1);}

/* ── Page Sections ───────────────────────────────────────── */
.page-section{position:relative;z-index:1;padding:5rem 2rem;scroll-margin-top:64px;}
.page-section:nth-child(even){background:var(--surface);}
.section-inner{max-width:1200px;margin:0 auto;}
.section-eyebrow{font-family:var(--mono);font-size:.7rem;color:var(--accent);letter-spacing:4px;text-transform:uppercase;margin-bottom:.75rem;}
.section-title{font-family:var(--heading-font);font-size:clamp(2.5rem,5vw,4.5rem);letter-spacing:2px;line-height:1;margin-bottom:1rem;}
.section-sub{color:var(--muted);max-width:600px;font-size:1.05rem;font-weight:300;margin-bottom:3rem;line-height:1.7;}
.section-divider{display:flex;align-items:center;gap:1rem;margin-bottom:3rem;}
.section-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.section-marker{font-family:var(--mono);font-size:.65rem;color:var(--accent);letter-spacing:3px;text-transform:uppercase;opacity:.5;margin-bottom:.5rem;}

/* ── Service Cards ───────────────────────────────────────── */
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:3rem;}
.service-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));border:1px solid var(--border-subtle);border-radius:var(--radius);padding:2rem;transition:all .3s ease;box-shadow:var(--shadow);}
.service-card:hover{transform:translateY(-6px);background:var(--card-hover);border-color:rgba(52,211,153,.35);}
.service-icon{font-size:2rem;margin-bottom:1rem;display:block;color:var(--accent);}
.service-card h3{font-family:var(--heading-font);font-size:1.4rem;letter-spacing:1px;margin-bottom:.5rem;}
.service-card p{color:var(--muted);font-size:.9rem;line-height:1.6;}

/* ── Pricing/Packages Grid ───────────────────────────────── */
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-bottom:3rem;}
.pricing-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));border:1px solid var(--border-subtle);border-radius:var(--radius);padding:2.5rem 2rem;transition:all .3s ease;position:relative;}
.pricing-card.featured{border-color:rgba(52,211,153,.4);background:linear-gradient(135deg,rgba(52,211,153,.08),rgba(110,231,183,.04));}
.pricing-card.featured::before{content:'Most Popular';position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);font-family:var(--mono);font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:.3rem 1rem;border-radius:0 0 8px 8px;}
.pricing-name{font-family:var(--heading-font);font-size:2rem;letter-spacing:2px;margin-bottom:1rem;}
.pricing-price{font-family:var(--heading-font);font-size:3rem;color:var(--accent);line-height:1;margin-bottom:.25rem;}
.pricing-price span{font-family:var(--body-font);font-size:.9rem;color:var(--muted);font-weight:300;}
.pricing-features{list-style:none;margin:1.5rem 0;}
.pricing-features li{font-size:.85rem;color:var(--muted);padding:.4rem 0;display:flex;align-items:center;gap:.6rem;}
.pricing-features li::before{content:'✓';color:var(--accent2);font-weight:700;}

/* ── Certifications Badges ───────────────────────────────── */
.badge-grid{display:flex;flex-wrap:wrap;gap:1rem;margin:2rem 0;}
.cert-badge{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:40px;padding:.6rem 1.5rem;font-family:var(--mono);font-size:.75rem;letter-spacing:1px;color:var(--accent2);}

/* ── Contact Info Cards ──────────────────────────────────── */
.contact-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-bottom:2rem;}
.contact-info-card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));border:1px solid var(--border-subtle);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;}
.contact-info-card i{font-size:2rem;color:var(--accent2);margin-bottom:1rem;}
.contact-info-card h3{font-family:var(--heading-font);font-size:1.2rem;margin-bottom:.5rem;}
.contact-info-card a{color:var(--accent2);text-decoration:none;}

/* ── Contact Form ────────────────────────────────────────── */
.contact-form-wrap{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));border:1px solid var(--border-subtle);border-radius:var(--radius);padding:2.5rem;margin-top:2rem;}
.form-grid{display:grid;gap:1rem;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-group{display:flex;flex-direction:column;}
.form-label{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:.4rem;}
.form-input,.form-select,.form-textarea{width:100%;background:#0b1527;border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-sm);color:var(--text);padding:.75rem 1rem;font-size:.9rem;outline:none;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(52,211,153,.12);}
.form-error{font-family:var(--mono);font-size:.65rem;color:var(--accent3);margin-top:.3rem;display:none;}
.form-error.visible{display:block;}

/* ── Footer ──────────────────────────────────────────────── */
footer{background:var(--surface);border-top:1px solid var(--border);padding:4rem 2rem 2rem;}
.footer-inner{max-width:1200px;margin:0 auto;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:3rem;margin-bottom:3rem;}
.footer-brand-logo{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;}
.footer-brand-logo img{height:52px;width:auto;}
.footer-brand-logo-text{font-family:var(--heading-font);font-size:1.6rem;letter-spacing:3px;color:var(--accent);line-height:1;}
.footer-brand-logo-text span{color:var(--accent2);}
.footer-brand p{font-size:.85rem;color:var(--muted);line-height:1.7;}
.contact-list{list-style:none;}
.contact-list li{padding:.35rem 0;display:flex;gap:.6rem;font-family:var(--mono);font-size:.78rem;color:var(--muted);}
.contact-list a{color:var(--accent2);text-decoration:none;}
.footer-col h4{font-family:var(--heading-font);font-size:1.1rem;letter-spacing:2px;margin-bottom:1.2rem;}
.footer-links{list-style:none;}
.footer-links li{margin-bottom:.5rem;}
.footer-links a{font-size:.85rem;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:.5rem;}
.footer-links a::before{content:'›';color:var(--accent);}
.footer-links a:hover{color:var(--accent);}
.footer-bottom{border-top:1px solid var(--border);padding-top:1.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.footer-bottom p{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:1px;}

/* ── WhatsApp & Ticket Float ──────────────────────────────── */
.wa-float{position:fixed;bottom:5.5rem;right:2rem;z-index:999;}
.wa-btn{width:56px;height:56px;background:#25d366;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.6rem;border-radius:16px;color:white;box-shadow:0 0 20px rgba(37,211,102,0.3);transition:transform .2s;}
.wa-btn:hover{transform:scale(1.05);}
.ticket-float{position:fixed;left:20px;bottom:90px;z-index:999;background:linear-gradient(135deg,var(--portal-btn-from),var(--portal-btn-to));color:var(--portal-text);text-decoration:none;padding:12px 16px;border-radius:var(--radius-sm);font-weight:700;font-family:var(--mono);font-size:.7rem;display:flex;align-items:center;gap:.5rem;}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:900px){
  .hero-inner{grid-template-columns:1fr;}
  .hero-right{display:none;}
}
@media(max-width:768px){
  nav{padding:0 1rem;}
  .hero{padding:5.5rem 1rem 3rem;min-height:auto;}
  .nav-links{display:none;}
  .hamburger{display:flex;}
  .nav-cta{display:none;}
  .services-grid,.pricing-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr;gap:2rem;}
  .page-section{padding:4rem 1rem;}
  .section-title{font-size:clamp(2rem,10vw,3rem);}
}
@media(max-width:480px){
  .hero-tag{font-size:.62rem;}
  .nav-logo-text{font-size:1rem;}
}
img,iframe{max-width:100%;height:auto;}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
