<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cyber I.T Masters - Client Sign-Off Portal</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;padding:20px}
.card{max-width:900px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:0}.ticket{background:#eef7ff;padding:10px;border-radius:8px;margin:12px 0}
.q{margin:20px 0}.btn{background:#00C896;border:none;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
canvas{border:2px dashed #ccc;border-radius:10px;width:100%;height:220px}
</style>
</head>
<body>
<div class="card">
<h1>✍ Client Sign-Off</h1>
<div class="ticket" id="ticketInfo">Loading ticket...</div>

<h3>1. Is the client satisfied with the service and outcome?</h3>
<label><input type="radio" name="sat" value="Yes"> Yes</label>
<label><input type="radio" name="sat" value="Partial"> Partially Satisfied</label>
<label><input type="radio" name="sat" value="No"> Not Satisfied</label>

<h3>2. Service Rating</h3>
<input type="range" min="1" max="5" id="serviceRating">

<h3>3. Engineer Rating</h3>
<input type="range" min="1" max="5" id="engineerRating">

<h3>4. NPS Score (0-10)</h3>
<input type="number" min="0" max="10" id="nps">

<h3>5. Comments / Outstanding Issues</h3>
<textarea id="comments" style="width:100%;height:120px"></textarea>

<h3>Google Review</h3>
<a target="_blank" href="https://g.page/r/CUSUmJkZZNmSEBM/review">⭐ Leave a Google Review</a>

<h3>Client Signature</h3>
<canvas id="sig"></canvas>
<br><br>
<button class="btn" onclick="submitSignoff()">Submit Sign-Off & Close Ticket</button>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBpoDnbWKvWQdvcZnhUZwFr24iox2fWJto",
authDomain:"test-bot-49f99.firebaseapp.com",
projectId:"test-bot-49f99",
storageBucket:"test-bot-49f99.firebasestorage.app",
messagingSenderId:"522231357803",
appId:"1:522231357803:web:bf65a73d1df7269615ac2e"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const ticketRef=new URLSearchParams(location.search).get("ticket");
document.getElementById("ticketInfo").innerText="Ticket: "+ticketRef;

db.collection("tickets").doc(ticketRef).get().then(d=>{
 if(d.exists){
  const t=d.data();
  document.getElementById("ticketInfo").innerHTML="<b>"+ticketRef+"</b><br>"+(t.clientName||"")+"<br>"+(t.issueTitle||"");
 }
});

const pad=new SignaturePad(document.getElementById("sig"));

async function submitSignoff(){
 if(pad.isEmpty()){alert("Please sign.");return;}
 const signoff={
 satisfaction:document.querySelector('input[name="sat"]:checked')?.value||"",
 serviceRating:document.getElementById("serviceRating").value,
 engineerRating:document.getElementById("engineerRating").value,
 nps:document.getElementById("nps").value,
 comments:document.getElementById("comments").value,
 signature:pad.toDataURL(),
 signedAt:new Date().toISOString()
 };

 await db.collection("tickets").doc(ticketRef).update({
   status:"closed",
   clientSignoff:signoff,
   updatedAt:new Date().toISOString()
 });

 await db.collection("client_signoffs").add({
   ticketRef,
   ...signoff
 });

 alert("Sign-off completed. Ticket closed.");
}
</script>
</body>
</html>
