<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cyber I.T Masters — Track My Ticket</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{min-height:100%;height:100%;}
body{
  font-family:'Outfit',sans-serif;
  background:#02040A;
  color:#E2EAF4;
  -webkit-font-smoothing:antialiased;
}
:root{
  --ac:#00C896;
  --ac2:#0EA5E9;
  --bg:#02040A;
  --bg2:#070C18;
  --bg3:#0B1220;
  --border:#0E1A2E;
  --border2:#162338;
  --text:#E2EAF4;
  --text2:#8DA4BE;
  --text3:#445E7A;
  --text4:#253449;
  --card:#070C18;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ANIMATIONS */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,200,150,0.15);}50%{box-shadow:0 0 40px rgba(0,200,150,0.35);}}
@keyframes scanline{0%{transform:translateY(-100%);}100%{transform:translateY(100vh);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes countUp{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}
@keyframes borderPulse{0%,100%{border-color:rgba(0,200,150,0.3);}50%{border-color:rgba(0,200,150,0.7);}}
@keyframes slideRight{from{width:0;}to{width:var(--w);}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
@keyframes float{0%,100%{transform:translateY(0px);}50%{transform:translateY(-6px);}}

.fu{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;}
.fu2{animation:fadeUp 0.5s 0.1s cubic-bezier(0.16,1,0.3,1) both;}
.fu3{animation:fadeUp 0.5s 0.2s cubic-bezier(0.16,1,0.3,1) both;}
.fu4{animation:fadeUp 0.5s 0.3s cubic-bezier(0.16,1,0.3,1) both;}
.fu5{animation:fadeUp 0.5s 0.4s cubic-bezier(0.16,1,0.3,1) both;}

/* GRID BACKGROUND */
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,200,150,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,200,150,0.03) 1px, transparent 1px);
  background-size:60px 60px;
}
.grid-bg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,200,150,0.06) 0%, transparent 70%);
}

/* HEADER */
.portal-header{
  position:sticky;top:0;z-index:50;
  background:rgba(2,4,10,0.85);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.portal-header-inner{
  max-width:900px;margin:0 auto;
  padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 0 20px rgba(0,200,150,0.3);
}
.brand-text-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.02em;}
.brand-text-sub{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:0.08em;}
.live-indicator{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  background:rgba(0,200,150,0.08);
  border:1px solid rgba(0,200,150,0.2);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:pulse 2s infinite;}
.live-text{font-size:11px;font-weight:600;color:var(--ac);font-family:'IBM Plex Mono',monospace;}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:48px 24px 80px;position:relative;z-index:1;}

/* LOGIN CARD */
.login-card{
  max-width:460px;margin:0 auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px;
  position:relative;overflow:hidden;
  animation:glow 4s ease infinite;
}
.login-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(0,200,150,0.04) 0%,rgba(14,165,233,0.02) 100%);
  pointer-events:none;
}
.login-hero{text-align:center;margin-bottom:36px;}
.login-icon{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;
  font-size:34px;margin:0 auto 18px;
  box-shadow:0 8px 32px rgba(0,200,150,0.3);
  animation:float 3s ease-in-out infinite;
}
.login-title{font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-0.03em;}
.login-sub{font-size:14px;color:var(--text3);line-height:1.5;}

/* FORM ELEMENTS */
.form-group{margin-bottom:18px;}
.form-label{
  display:block;font-size:11px;font-weight:700;
  color:var(--text3);text-transform:uppercase;
  letter-spacing:0.1em;margin-bottom:8px;
}
.form-label span{color:var(--ac);margin-left:4px;}
.form-input{
  width:100%;background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:10px;padding:13px 16px;
  color:var(--text);font-size:15px;font-family:'Outfit',sans-serif;
  transition:all 0.2s;
}
.form-input:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(0,200,150,0.1);
  background:rgba(11,18,32,0.9);
}
.form-input::placeholder{color:var(--text4);}
.form-input.mono{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.05em;}

.btn-login{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#02040A;font-size:15px;font-weight:800;
  border:none;border-radius:10px;cursor:pointer;
  font-family:'Outfit',sans-serif;letter-spacing:0.01em;
  transition:all 0.2s;margin-top:8px;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,200,150,0.35);}
.btn-login:active{transform:translateY(0);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.error-msg{
  background:rgba(239,68,68,0.08);
  border:1px solid rgba(239,68,68,0.25);
  border-radius:8px;padding:11px 14px;
  color:#F87171;font-size:13px;font-weight:500;
  margin-top:12px;display:flex;align-items:center;gap:8px;
}
.help-text{
  margin-top:24px;padding-top:20px;
  border-top:1px solid var(--border);
  font-size:12px;color:var(--text3);text-align:center;line-height:1.7;
}
.help-text strong{color:var(--text2);}

/* TICKET VIEW */
.ticket-header{margin-bottom:32px;}
.ticket-ref-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.ticket-ref{
  font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;
  color:var(--ac);letter-spacing:0.03em;
}
.ticket-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.03em;line-height:1.2;margin-bottom:6px;}
.ticket-meta-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.ticket-meta-item{
  display:flex;align-items:center;gap:5px;
  font-size:13px;color:var(--text3);font-weight:500;
}

/* STATUS BADGE */
.status-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;
}
.status-dot{width:6px;height:6px;border-radius:50%;}

/* BIG STATUS */
.big-status-card{
  border-radius:16px;padding:28px;margin-bottom:24px;
  border:1px solid;position:relative;overflow:hidden;
}
.big-status-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--sc-bg) 0%, transparent 60%);
  opacity:0.4;pointer-events:none;border-radius:16px;
}
.big-status-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;opacity:0.7;}
.big-status-value{font-size:32px;font-weight:900;letter-spacing:-0.03em;margin-bottom:4px;}
.big-status-desc{font-size:14px;opacity:0.75;line-height:1.5;}

/* PROGRESS TRACK */
.progress-track{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:24px 28px;margin-bottom:24px;
}
.progress-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:20px;}
.steps{display:flex;align-items:flex-start;gap:0;position:relative;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.step:not(:last-child)::after{
  content:'';position:absolute;
  top:16px;left:50%;width:100%;height:2px;
  background:var(--border2);z-index:0;
}
.step:not(:last-child).done::after,
.step:not(:last-child).active::after{background:linear-gradient(90deg,var(--ac),var(--border2));}
.step:not(:last-child).done::after{background:var(--ac);}
.step-circle{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;z-index:1;
  background:var(--bg3);border:2px solid var(--border2);
  color:var(--text3);flex-shrink:0;transition:all 0.3s;
  font-family:'IBM Plex Mono',monospace;
}
.step.done .step-circle{background:var(--ac);border-color:var(--ac);color:#02040A;}
.step.active .step-circle{
  background:rgba(0,200,150,0.15);border-color:var(--ac);
  color:var(--ac);box-shadow:0 0 16px rgba(0,200,150,0.3);
  animation:borderPulse 2s infinite;
}
.step-label{font-size:10px;font-weight:600;color:var(--text3);text-align:center;margin-top:8px;text-transform:uppercase;letter-spacing:0.05em;max-width:70px;line-height:1.3;}
.step.active .step-label{color:var(--ac);}
.step.done .step-label{color:var(--text2);}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.info-card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:6px;}
.info-card-value{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;}
.info-card-value.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ac);}

/* ACTIVITY TIMELINE */
.timeline{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 28px;margin-bottom:24px;}
.timeline-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:20px;}
.timeline-list{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);position:relative;}
.tl-item:last-child{border-bottom:none;}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0;padding-top:2px;}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid;}
.tl-line{width:2px;flex:1;background:var(--border);margin-top:4px;}
.tl-item:last-child .tl-line{display:none;}
.tl-content{flex:1;min-width:0;}
.tl-note{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:4px;word-break:break-word;}
.tl-meta{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;display:flex;gap:10px;flex-wrap:wrap;}
.tl-type-tag{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
  padding:1px 6px;border-radius:8px;align-self:flex-start;margin-left:auto;flex-shrink:0;
}
.tl-empty{text-align:center;padding:24px;color:var(--text3);font-size:13px;}

/* DEVICE CARD */
.device-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 28px;margin-bottom:24px;}
.device-card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:16px;}
.device-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;}
.device-row{padding:6px 0;border-bottom:1px solid var(--border);}
.device-row:last-child{border-bottom:none;}
.device-key{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:2px;}
.device-val{font-size:13px;color:var(--text2);}

/* NEED HELP BANNER */
.help-banner{
  background:linear-gradient(135deg,rgba(0,200,150,0.06),rgba(14,165,233,0.04));
  border:1px solid rgba(0,200,150,0.15);
  border-radius:16px;padding:24px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  flex-wrap:wrap;
}
.help-banner-text h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px;}
.help-banner-text p{font-size:13px;color:var(--text3);line-height:1.5;}
.btn-wa{
  display:inline-flex;align-items:center;gap:8px;
  background:#25D366;color:#fff;
  padding:11px 20px;border-radius:10px;
  font-size:14px;font-weight:700;text-decoration:none;
  font-family:'Outfit',sans-serif;transition:all 0.2s;
  white-space:nowrap;border:none;cursor:pointer;
  flex-shrink:0;
}
.btn-wa:hover{background:#22BF5B;transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,211,102,0.3);}

/* SIGNOFF BANNER */
.signoff-banner{
  background:linear-gradient(135deg,rgba(249,115,22,0.08),rgba(249,115,22,0.03));
  border:1px solid rgba(249,115,22,0.3);
  border-radius:16px;padding:22px 28px;margin-bottom:24px;
  animation:borderPulse 2s ease infinite;
}
.signoff-banner-title{font-size:15px;font-weight:700;color:#FB923C;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.signoff-banner-text{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px;}
.btn-signoff{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#F97316,#FB923C);color:#fff;
  padding:11px 22px;border-radius:10px;
  font-size:13px;font-weight:700;text-decoration:none;
  font-family:'Outfit',sans-serif;transition:all 0.2s;
}
.btn-signoff:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(249,115,22,0.35);}

/* SIGNOFF DONE BADGE */
.signoff-done{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);
  border-radius:10px;padding:10px 16px;
  font-size:13px;font-weight:700;color:#10B981;margin-bottom:16px;
}

/* LOGOUT */
.btn-logout{
  background:transparent;border:1px solid var(--border2);
  color:var(--text3);padding:7px 14px;border-radius:8px;
  font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;
  transition:all 0.2s;
}
.btn-logout:hover{border-color:var(--border2);color:var(--text2);}

/* SPINNER */
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(0,200,150,0.15);border-top-color:var(--ac);animation:spin 0.7s linear infinite;}
.spinner-page{display:flex;align-items:center;justify-content:center;min-height:300px;flex-direction:column;gap:16px;}
.spinner-page p{font-size:14px;color:var(--text3);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.6);animation:toastIn 0.3s ease;display:flex;align-items:center;gap:8px;}
.toast.ok{background:var(--ac);color:#02040A;}
.toast.error{background:#EF4444;color:#fff;}
.toast.info{background:var(--ac2);color:#fff;}

/* SLA */
.sla-ok{color:#10B981;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.sla-warn{color:#F59E0B;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;animation:pulse 1.5s infinite;}
.sla-breach{color:#EF4444;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;animation:pulse 0.8s infinite;}

/* NOT FOUND */
.not-found{text-align:center;padding:60px 20px;}
.not-found-icon{font-size:64px;margin-bottom:20px;display:block;}
.not-found-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px;}
.not-found-sub{font-size:14px;color:var(--text3);line-height:1.6;margin-bottom:28px;}
.btn-back{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#02040A;
  padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;
  border:none;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s;
}
.btn-back:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,200,150,0.3);}

/* RESPONSIVE */
@media(max-width:640px){
  .info-grid{grid-template-columns:1fr;}
  .device-grid{grid-template-columns:1fr;}
  .help-banner{flex-direction:column;align-items:flex-start;}
  .login-card{padding:28px 20px;}
  .page{padding:28px 16px 60px;}
  .steps{gap:0;}
  .step-label{font-size:9px;max-width:55px;}
}

body.light-mode{background:#ffffff !important;color:#111827 !important;}
body.light-mode .portal-header,
body.light-mode .login-card,
body.light-mode .info-card,
body.light-mode .timeline,
body.light-mode .device-card,
body.light-mode .progress-track{background:#ffffff !important;color:#111827 !important;}
.dark-toggle{
padding:8px 12px;border-radius:8px;border:1px solid #ccc;cursor:pointer;background:#fff;
}
.logo-img{height:38px;width:auto;border-radius:6px;}

</style>

};

/* ── STATUS → STEP INDEX (for progress track) ── */
const STATUS_STEP={
  open:0,"in-progress":1,awaiting:1,quoted:1,resolved:2,"awaiting-signoff":2,closed:3
};

const SLA_HOURS={Urgent:4,High:8,Medium:24,Low:48};
const SVCS=[
  {id:"device",label:"Device Drop-off",icon:"💻"},
  {id:"remote",label:"Remote Support",icon:"🌐"},
  {id:"onsite",label:"On-Site Support",icon:"🔧"},
];

/* ── HELPERS ── */
function ts(){return new Date().toISOString();}
function fmtDate(d){if(!d)return"—";return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});}
function fmtDateTime(d){if(!d)return"—";return new Date(d).toLocaleString("en-ZA",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function normalisePhone(p){if(!p)return"";const c=String(p).replace(/[^0-9]/g,"");return c.startsWith("0")?"27"+c.slice(1):c;}
function waUrl(phone,msg){return`https://wa.me/${normalisePhone(phone)}?text=${encodeURIComponent(msg)}`;}

function getSLAInfo(ticket){
  if(!ticket||!ticket.createdAt||!ticket.priority)return null;
  if(ticket.status==="resolved"||ticket.status==="closed")return{status:"done",label:"Resolved"};
  const hours=SLA_HOURS[ticket.priority]||24;
  const deadline=new Date(ticket.createdAt).getTime()+(hours*3600*1000);
  const diff=deadline-Date.now();
  const diffH=Math.round(diff/3600000);
  if(diff<0)return{status:"breach",label:`Breached ${Math.abs(diffH)}h ago`};
  if(diff<3600*1000*2)return{status:"warn",label:`${diffH}h left`};
  return{status:"ok",label:`${diffH}h left`};
}

/* ── ATOMS ── */
function Toast({msg,type}){if(!msg)return null;return<div className={`toast ${type||"ok"}`}>{msg}</div>;}

function StatusBadge({s}){
  const v=ST[s]||{l:s,c:"#64748B",icon:"•"};
  return(
    <span className="status-badge" style={{background:v.c+"18",color:v.c,border:`1px solid ${v.c}30`}}>
      <span className="status-dot" style={{background:v.c}}/>
      {v.l}
    </span>
  );
}

function SLABadge({ticket}){
  const info=getSLAInfo(ticket);
  if(!info||info.status==="done")return null;
  const cls=info.status==="breach"?"sla-breach":info.status==="warn"?"sla-warn":"sla-ok";
  return<span className={cls}>⏱ {info.label}</span>;
}

/* ══════════════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════════════ */
function LoginScreen({onLogin}){
  const [ticketId,setTicketId]=useState("");
  const [phone,setPhone]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const handleLogin=async(e)=>{
    e&&e.preventDefault();
    const tid=ticketId.trim().toUpperCase();
    const ph=phone.trim();
    if(!tid||!ph){setError("Please enter both your Ticket ID and cell number.");return;}

    setLoading(true);setError("");
    try{
      const snap=await db.collection("tickets").doc(tid).get();
      if(!snap.exists){
        setError("Ticket not found. Please check your Ticket ID and try again.");
        setLoading(false);return;
      }
      const data=snap.data();
      // Normalise both phone numbers for comparison
      const storedPhone=normalisePhone(data.phone||"");
      const enteredPhone=normalisePhone(ph);
      if(!storedPhone||enteredPhone!==storedPhone){
        setError("Incorrect cell number. Please use the number you registered with.");
        setLoading(false);return;
      }
      onLogin({id:snap.id,...data});
    }catch(err){
      console.error(err);
      setError("Connection error. Please try again.");
    }
    setLoading(false);
  };

  return(
    <div className="page" style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"calc(100vh - 64px)"}}>
      <div className="login-card fu">
        <div className="login-hero">
          <div className="login-icon">🎫</div>
          <h1 className="login-title">Track Your Ticket</h1>
          <p className="login-sub">Enter your ticket reference and the cell number you provided when logging the ticket.</p>
        </div>

        <form onSubmit={handleLogin}>
          <div className="form-group">
            <label className="form-label">Ticket ID <span>*</span></label>
            <input
              className="form-input mono"
              type="text"
              placeholder="CIM-0001"
              value={ticketId}
              onChange={e=>setTicketId(e.target.value.toUpperCase())}
              autoCapitalize="characters"
              autoComplete="off"
              spellCheck={false}
            />
          </div>
          <div className="form-group">
            <label className="form-label">Cell Number <span>*</span></label>
            <input
              className="form-input"
              type="tel"
              placeholder="e.g. 0712345678 or +27712345678"
              value={phone}
              onChange={e=>setPhone(e.target.value)}
              autoComplete="tel"
            />
          </div>

          {error&&(
            <div className="error-msg">
              <span style={{fontSize:16}}>⚠️</span>
              <span>{error}</span>
            </div>
          )}

          <button className="btn-login" type="submit" disabled={loading}>
            {loading?(
              <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                <span style={{width:18,height:18,borderRadius:"50%",border:"2px solid rgba(0,0,0,0.2)",borderTopColor:"#02040A",animation:"spin 0.7s linear infinite",display:"inline-block"}}/>
                Verifying…
              </span>
            ):"View My Ticket →"}
          </button>
        </form>

        <div className="help-text">
          <strong>Can't find your ticket?</strong><br/>
          Contact us on WhatsApp or email<br/>
          <strong>support@mbulahenigroup.co.za</strong>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   PROGRESS TRACK
══════════════════════════════════════════════ */
function ProgressTrack({status}){
  const STEPS=[
    {label:"Logged",icon:"📋"},
    {label:"In Progress",icon:"🔧"},
    {label:"Resolved",icon:"✅"},
    {label:"Closed",icon:"🔒"},
  ];
  const activeStep=STATUS_STEP[status]??0;
  return(
    <div className="progress-track fu3">
      <div className="progress-title">Ticket Progress</div>
      <div className="steps">
        {STEPS.map((s,i)=>{
          const isDone=i<activeStep;
          const isActive=i===activeStep;
          return(
            <div key={i} className={`step${isDone?" done":isActive?" active":""}`}>
              <div className="step-circle">
                {isDone?"✓":isActive?s.icon:i+1}
              </div>
              <div className="step-label">{s.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   TIMELINE
══════════════════════════════════════════════ */
function Timeline({notes,status}){
  const NOTE_STYLE={
    "status-change":{c:"#3B82F6",bg:"rgba(59,130,246,0.08)",label:"Status Update"},
    "engineer-note": {c:"#00C896",bg:"rgba(0,200,150,0.08)",label:"Engineer Note"},
    "note":          {c:"#8DA4BE",bg:"rgba(141,164,190,0.08)",label:"Note"},
    "system":        {c:"#475569",bg:"rgba(71,85,105,0.08)",label:"System"},
  };

  const allItems=[
    // Opening system entry
    {txt:"Ticket created and logged in our system.",at:"", type:"system",isOpen:true},
    ...(notes||[]).filter(n=>n.type!=="internal-only"),
  ].reverse();

  return(
    <div className="timeline fu4">
      <div className="timeline-title">Activity Log</div>
      {allItems.length===0&&<div className="tl-empty">No updates yet. Check back soon.</div>}
      <div className="timeline-list">
        {allItems.map((n,i)=>{
          const style=NOTE_STYLE[n.type]||NOTE_STYLE["note"];
          return(
            <div key={i} className="tl-item">
              <div className="tl-dot-wrap">
                <div className="tl-dot" style={{background:style.c,borderColor:style.c+"55"}}/>
                {i<allItems.length-1&&<div className="tl-line"/>}
              </div>
              <div className="tl-content">
                <div className="tl-note">{n.txt}</div>
                <div className="tl-meta">
                  {n.engineer&&<span>👤 {n.engineer}</span>}
                  {n.at&&<span>{fmtDateTime(n.at)}</span>}
                  {n.isOpen&&<span style={{fontStyle:"italic"}}>Ticket opened</span>}
                  <span className="tl-type-tag" style={{background:style.bg,color:style.c}}>{style.label}</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   ROOT
══════════════════════════════════════════════ */
function Root(){
  const [ticket,setTicket]=useState(null);
  const [toast,setToast]=useState({msg:"",type:"ok"});
  const [liveTicket,setLiveTicket]=useState(null);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3200);};

  // Once logged in, subscribe to live Firestore updates for this ticket
  useEffect(()=>{
    if(!ticket)return;
    const unsub=db.collection("tickets").doc(ticket.id)
      .onSnapshot(snap=>{
        if(snap.exists)setLiveTicket({id:snap.id,...snap.data()});
      },err=>console.error(err));
    return()=>unsub();
  },[ticket?.id]);

  const currentTicket=liveTicket||ticket;

  const handleLogout=()=>{setTicket(null);setLiveTicket(null);};

  return(
    <div>
      <div className="grid-bg"/>
      <header className="portal-header">
        <div className="portal-header-inner">
          <div className="brand">
            <img className="logo-img" src="logo.png" alt="Cyber I.T Masters Logo" />
            <div>
              <div className="brand-text-name">{CFG.bizName}</div>
              <div className="brand-text-sub">Client Ticket Portal</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {currentTicket&&(
              <button className="btn-logout" onClick={handleLogout}>← Back</button>
            )}
            <div className="live-indicator">
              <div className="live-dot"/>
              <span className="live-text">LIVE</span><button className="dark-toggle" onClick={()=>document.body.classList.toggle("light-mode")}>🌙/☀️</button>
            </div>
          </div>
        </div>
      </header>

      {!ticket?(
        <LoginScreen onLogin={t=>{setTicket(t);showToast(`Welcome back — ${t.ref}`,"info");}}/>
      ):(
        currentTicket?<TicketView ticket={currentTicket} onLogout={handleLogout}/>
        :<div className="spinner-page"><div className="spinner"/><p>Loading ticket…</p></div>
      )}

      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
