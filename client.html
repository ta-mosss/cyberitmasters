<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cyber I.T Masters — Track My Ticket</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{min-height:100%;height:100%;}
body{
  font-family:'Outfit',sans-serif;
  background:#02040A;
  color:#E2EAF4;
  -webkit-font-smoothing:antialiased;
}
:root{
  --ac:#00C896;
  --ac2:#0EA5E9;
  --bg:#02040A;
  --bg2:#070C18;
  --bg3:#0B1220;
  --border:#0E1A2E;
  --border2:#162338;
  --text:#E2EAF4;
  --text2:#8DA4BE;
  --text3:#445E7A;
  --text4:#253449;
  --card:#070C18;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ANIMATIONS */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,200,150,0.15);}50%{box-shadow:0 0 40px rgba(0,200,150,0.35);}}
@keyframes scanline{0%{transform:translateY(-100%);}100%{transform:translateY(100vh);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes countUp{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}
@keyframes borderPulse{0%,100%{border-color:rgba(0,200,150,0.3);}50%{border-color:rgba(0,200,150,0.7);}}
@keyframes slideRight{from{width:0;}to{width:var(--w);}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
@keyframes float{0%,100%{transform:translateY(0px);}50%{transform:translateY(-6px);}}

.fu{animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;}
.fu2{animation:fadeUp 0.5s 0.1s cubic-bezier(0.16,1,0.3,1) both;}
.fu3{animation:fadeUp 0.5s 0.2s cubic-bezier(0.16,1,0.3,1) both;}
.fu4{animation:fadeUp 0.5s 0.3s cubic-bezier(0.16,1,0.3,1) both;}
.fu5{animation:fadeUp 0.5s 0.4s cubic-bezier(0.16,1,0.3,1) both;}

/* GRID BACKGROUND */
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,200,150,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,200,150,0.03) 1px, transparent 1px);
  background-size:60px 60px;
}
.grid-bg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,200,150,0.06) 0%, transparent 70%);
}

/* HEADER */
.portal-header{
  position:sticky;top:0;z-index:50;
  background:rgba(2,4,10,0.85);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.portal-header-inner{
  max-width:900px;margin:0 auto;
  padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 0 20px rgba(0,200,150,0.3);
}
.brand-text-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.02em;}
.brand-text-sub{font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:0.08em;}
.live-indicator{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  background:rgba(0,200,150,0.08);
  border:1px solid rgba(0,200,150,0.2);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:pulse 2s infinite;}
.live-text{font-size:11px;font-weight:600;color:var(--ac);font-family:'IBM Plex Mono',monospace;}

/* PAGE */
.page{max-width:900px;margin:0 auto;padding:48px 24px 80px;position:relative;z-index:1;}

/* LOGIN CARD */
.login-card{
  max-width:460px;margin:0 auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px;
  position:relative;overflow:hidden;
  animation:glow 4s ease infinite;
}
.login-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(0,200,150,0.04) 0%,rgba(14,165,233,0.02) 100%);
  pointer-events:none;
}
.login-hero{text-align:center;margin-bottom:36px;}
.login-icon{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  display:flex;align-items:center;justify-content:center;
  font-size:34px;margin:0 auto 18px;
  box-shadow:0 8px 32px rgba(0,200,150,0.3);
  animation:float 3s ease-in-out infinite;
}
.login-title{font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-0.03em;}
.login-sub{font-size:14px;color:var(--text3);line-height:1.5;}

/* FORM ELEMENTS */
.form-group{margin-bottom:18px;}
.form-label{
  display:block;font-size:11px;font-weight:700;
  color:var(--text3);text-transform:uppercase;
  letter-spacing:0.1em;margin-bottom:8px;
}
.form-label span{color:var(--ac);margin-left:4px;}
.form-input{
  width:100%;background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:10px;padding:13px 16px;
  color:var(--text);font-size:15px;font-family:'Outfit',sans-serif;
  transition:all 0.2s;
}
.form-input:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(0,200,150,0.1);
  background:rgba(11,18,32,0.9);
}
.form-input::placeholder{color:var(--text4);}
.form-input.mono{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.05em;}

.btn-login{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#02040A;font-size:15px;font-weight:800;
  border:none;border-radius:10px;cursor:pointer;
  font-family:'Outfit',sans-serif;letter-spacing:0.01em;
  transition:all 0.2s;margin-top:8px;
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,200,150,0.35);}
.btn-login:active{transform:translateY(0);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.error-msg{
  background:rgba(239,68,68,0.08);
  border:1px solid rgba(239,68,68,0.25);
  border-radius:8px;padding:11px 14px;
  color:#F87171;font-size:13px;font-weight:500;
  margin-top:12px;display:flex;align-items:center;gap:8px;
}
.help-text{
  margin-top:24px;padding-top:20px;
  border-top:1px solid var(--border);
  font-size:12px;color:var(--text3);text-align:center;line-height:1.7;
}
.help-text strong{color:var(--text2);}

/* TICKET VIEW */
.ticket-header{margin-bottom:32px;}
.ticket-ref-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.ticket-ref{
  font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;
  color:var(--ac);letter-spacing:0.03em;
}
.ticket-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-0.03em;line-height:1.2;margin-bottom:6px;}
.ticket-meta-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.ticket-meta-item{
  display:flex;align-items:center;gap:5px;
  font-size:13px;color:var(--text3);font-weight:500;
}

/* STATUS BADGE */
.status-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;
}
.status-dot{width:6px;height:6px;border-radius:50%;}

/* BIG STATUS */
.big-status-card{
  border-radius:16px;padding:28px;margin-bottom:24px;
  border:1px solid;position:relative;overflow:hidden;
}
.big-status-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--sc-bg) 0%, transparent 60%);
  opacity:0.4;pointer-events:none;border-radius:16px;
}
.big-status-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;opacity:0.7;}
.big-status-value{font-size:32px;font-weight:900;letter-spacing:-0.03em;margin-bottom:4px;}
.big-status-desc{font-size:14px;opacity:0.75;line-height:1.5;}

/* PROGRESS TRACK */
.progress-track{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:24px 28px;margin-bottom:24px;
}
.progress-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:20px;}
.steps{display:flex;align-items:flex-start;gap:0;position:relative;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.step:not(:last-child)::after{
  content:'';position:absolute;
  top:16px;left:50%;width:100%;height:2px;
  background:var(--border2);z-index:0;
}
.step:not(:last-child).done::after,
.step:not(:last-child).active::after{background:linear-gradient(90deg,var(--ac),var(--border2));}
.step:not(:last-child).done::after{background:var(--ac);}
.step-circle{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;z-index:1;
  background:var(--bg3);border:2px solid var(--border2);
  color:var(--text3);flex-shrink:0;transition:all 0.3s;
  font-family:'IBM Plex Mono',monospace;
}
.step.done .step-circle{background:var(--ac);border-color:var(--ac);color:#02040A;}
.step.active .step-circle{
  background:rgba(0,200,150,0.15);border-color:var(--ac);
  color:var(--ac);box-shadow:0 0 16px rgba(0,200,150,0.3);
  animation:borderPulse 2s infinite;
}
.step-label{font-size:10px;font-weight:600;color:var(--text3);text-align:center;margin-top:8px;text-transform:uppercase;letter-spacing:0.05em;max-width:70px;line-height:1.3;}
.step.active .step-label{color:var(--ac);}
.step.done .step-label{color:var(--text2);}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.info-card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:6px;}
.info-card-value{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;}
.info-card-value.mono{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ac);}

/* ACTIVITY TIMELINE */
.timeline{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 28px;margin-bottom:24px;}
.timeline-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:20px;}
.timeline-list{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);position:relative;}
.tl-item:last-child{border-bottom:none;}
.tl-dot-wrap{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0;padding-top:2px;}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid;}
.tl-line{width:2px;flex:1;background:var(--border);margin-top:4px;}
.tl-item:last-child .tl-line{display:none;}
.tl-content{flex:1;min-width:0;}
.tl-note{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:4px;word-break:break-word;}
.tl-meta{font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;display:flex;gap:10px;flex-wrap:wrap;}
.tl-type-tag{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
  padding:1px 6px;border-radius:8px;align-self:flex-start;margin-left:auto;flex-shrink:0;
}
.tl-empty{text-align:center;padding:24px;color:var(--text3);font-size:13px;}

/* DEVICE CARD */
.device-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 28px;margin-bottom:24px;}
.device-card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:16px;}
.device-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;}
.device-row{padding:6px 0;border-bottom:1px solid var(--border);}
.device-row:last-child{border-bottom:none;}
.device-key{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--text3);margin-bottom:2px;}
.device-val{font-size:13px;color:var(--text2);}

/* NEED HELP BANNER */
.help-banner{
  background:linear-gradient(135deg,rgba(0,200,150,0.06),rgba(14,165,233,0.04));
  border:1px solid rgba(0,200,150,0.15);
  border-radius:16px;padding:24px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  flex-wrap:wrap;
}
.help-banner-text h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px;}
.help-banner-text p{font-size:13px;color:var(--text3);line-height:1.5;}
.btn-wa{
  display:inline-flex;align-items:center;gap:8px;
  background:#25D366;color:#fff;
  padding:11px 20px;border-radius:10px;
  font-size:14px;font-weight:700;text-decoration:none;
  font-family:'Outfit',sans-serif;transition:all 0.2s;
  white-space:nowrap;border:none;cursor:pointer;
  flex-shrink:0;
}
.btn-wa:hover{background:#22BF5B;transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,211,102,0.3);}

/* SIGNOFF BANNER */
.signoff-banner{
  background:linear-gradient(135deg,rgba(249,115,22,0.08),rgba(249,115,22,0.03));
  border:1px solid rgba(249,115,22,0.3);
  border-radius:16px;padding:22px 28px;margin-bottom:24px;
  animation:borderPulse 2s ease infinite;
}
.signoff-banner-title{font-size:15px;font-weight:700;color:#FB923C;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.signoff-banner-text{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px;}
.btn-signoff{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#F97316,#FB923C);color:#fff;
  padding:11px 22px;border-radius:10px;
  font-size:13px;font-weight:700;text-decoration:none;
  font-family:'Outfit',sans-serif;transition:all 0.2s;
}
.btn-signoff:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(249,115,22,0.35);}

/* SIGNOFF DONE BADGE */
.signoff-done{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);
  border-radius:10px;padding:10px 16px;
  font-size:13px;font-weight:700;color:#10B981;margin-bottom:16px;
}

/* LOGOUT */
.btn-logout{
  background:transparent;border:1px solid var(--border2);
  color:var(--text3);padding:7px 14px;border-radius:8px;
  font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;
  transition:all 0.2s;
}
.btn-logout:hover{border-color:var(--border2);color:var(--text2);}

/* SPINNER */
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(0,200,150,0.15);border-top-color:var(--ac);animation:spin 0.7s linear infinite;}
.spinner-page{display:flex;align-items:center;justify-content:center;min-height:300px;flex-direction:column;gap:16px;}
.spinner-page p{font-size:14px;color:var(--text3);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.6);animation:toastIn 0.3s ease;display:flex;align-items:center;gap:8px;}
.toast.ok{background:var(--ac);color:#02040A;}
.toast.error{background:#EF4444;color:#fff;}
.toast.info{background:var(--ac2);color:#fff;}

/* SLA */
.sla-ok{color:#10B981;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.sla-warn{color:#F59E0B;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;animation:pulse 1.5s infinite;}
.sla-breach{color:#EF4444;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;animation:pulse 0.8s infinite;}

/* NOT FOUND */
.not-found{text-align:center;padding:60px 20px;}
.not-found-icon{font-size:64px;margin-bottom:20px;display:block;}
.not-found-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:8px;}
.not-found-sub{font-size:14px;color:var(--text3);line-height:1.6;margin-bottom:28px;}
.btn-back{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#02040A;
  padding:12px 24px;border-radius:10px;font-size:14px;font-weight:700;
  border:none;cursor:pointer;font-family:'Outfit',sans-serif;transition:all 0.2s;
}
.btn-back:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,200,150,0.3);}

/* RESPONSIVE */
@media(max-width:640px){
  .info-grid{grid-template-columns:1fr;}
  .device-grid{grid-template-columns:1fr;}
  .help-banner{flex-direction:column;align-items:flex-start;}
  .login-card{padding:28px 20px;}
  .page{padding:28px 16px 60px;}
  .steps{gap:0;}
  .step-label{font-size:9px;max-width:55px;}
}

body.light-mode{background:#ffffff !important;color:#111827 !important;}
body.light-mode .portal-header,
body.light-mode .login-card,
body.light-mode .info-card,
body.light-mode .timeline,
body.light-mode .device-card,
body.light-mode .progress-track{background:#ffffff !important;color:#111827 !important;}
.dark-toggle{
padding:8px 12px;border-radius:8px;border:1px solid #ccc;cursor:pointer;background:#fff;
}
.logo-img{height:38px;width:auto;border-radius:6px;}


/* ===== CIMOP PORTAL V2.1 / PSA DASHBOARD ===== */
.portal-shell{max-width:1180px;margin:0 auto;padding:28px 24px 90px;position:relative;z-index:1}
.portal-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.eyebrow{font-size:10px;color:var(--ac);font-weight:800;text-transform:uppercase;letter-spacing:.13em;margin-bottom:7px}
.portal-title{font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.portal-subtitle{font-size:13px;color:var(--text3);margin-top:7px;line-height:1.5}
.customer-chip{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.customer-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;color:#02040A;font-weight:900}
.customer-chip-name{font-size:12px;font-weight:700;color:var(--text)}
.customer-chip-id{font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.psa-nav{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:20px}
.psa-nav button{white-space:nowrap}
.nav-active{color:var(--ac)!important;border-color:rgba(0,200,150,.35)!important;background:rgba(0,200,150,.07)!important}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}

function fmtDate(d){if(!d)return"—";return new Date(d).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});}
function fmtDateTime(d){if(!d)return"—";return new Date(d).toLocaleString("en-ZA",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function normalisePhone(p){if(!p)return"";const c=String(p).replace(/[^0-9]/g,"");if(c.startsWith("27"))return c;if(c.startsWith("0"))return"27"+c.slice(1);return c;}
function waUrl(phone,msg){return`https://wa.me/${normalisePhone(phone)}?text=${encodeURIComponent(msg)}`;}

function service(t){return SVCS.find(s=>s.id===t.serviceType)||{label:t.serviceType||"Support",icon:"🔧"};}
function getSLAInfo(ticket){
  if(!ticket||!ticket.createdAt||!ticket.priority)return null;
  if(PAUSED_STATUSES.includes(ticket.status))return{status:"paused",label:"Paused"};
  if(ticket.status==="resolved"||ticket.status==="closed")return{status:"done",label:"Resolved"};
  const hours=SLA_HOURS[ticket.priority]||24;
  const diff=new Date(ticket.createdAt).getTime()+hours*3600000-Date.now();
  const h=Math.round(diff/3600000);
  if(diff<0)return{status:"breach",label:`Breached ${Math.abs(h)}h ago`};
  if(diff<7200000)return{status:"warn",label:`${h}h left`};
  return{status:"ok",label:`${h}h left`};
}
function StatusBadge({status}){const v=ST[status]||{l:status||"Unknown",c:"#64748B",icon:"•"};return <span className="status-badge" style={{background:v.c+"18",color:v.c,border:`1px solid ${v.c}30`}}><span className="status-dot" style={{background:v.c}}/>{v.l}</span>;}
function SLABadge({ticket}){const i=getSLAInfo(ticket);if(!i||i.status==="done")return null;if(i.status==="paused")return <span style={{color:"#8B5CF6",fontSize:11,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>⏸ {i.label}</span>;const cls=i.status==="breach"?"sla-breach":i.status==="warn"?"sla-warn":"sla-ok";return <span className={cls}>⏱ {i.label}</span>;}

/* ---------- secure/legacy authentication gateway ---------- */
async function authenticatePortal(ticketRef,phone){
  if(CFG.portalAuthEndpoint){
    const r=await fetch(CFG.portalAuthEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ticketRef,phone})});
    if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.message||"Unable to verify portal access.");}
    const result=await r.json();
    if(!result.customToken||!result.customerId)throw new Error("Authentication service returned an invalid response.");
    await auth.signInWithCustomToken(result.customToken);
    return {customerId:result.customerId,bootstrapTicketRef:ticketRef,secure:true,customToken:result.customToken};
  }

  // DEVELOPMENT ONLY — preserves the current portal's ticket+phone experience.
  const snap=await db.collection("tickets").doc(ticketRef).get();
  if(!snap.exists)throw new Error("Ticket not found. Please check your Ticket Number.");
  const data=snap.data();
  if(normalisePhone(data.phone)!==normalisePhone(phone))throw new Error("The cellphone number does not match this ticket.");
  return {customerId:`legacy-${normalisePhone(phone)}`,bootstrapTicketRef:ticketRef,secure:false,bootstrapTicket:{id:snap.id,...data}};
}

async function loadCustomerProfile(identity,tickets){
  if(identity.secure&&identity.customerId){
    const snap=await db.collection("customers").doc(identity.customerId).get();
    if(snap.exists)return {id:snap.id,...snap.data()};
  }
  const t=tickets[0]||{};
  return {id:identity.customerId,name:t.clientName||t.name||"Customer",company:t.company||"",phone:t.phone||"",email:t.email||""};
}

async function loadCustomerTickets(identity){
  // Secure mode: rules should permit only records belonging to auth.uid/customerId.
  // Preferred schema: customers/{customerId}.tickets subcollection or tickets.customerId.
  if(identity.secure){
    const snap=await db.collection("tickets").where("customerId","==",identity.customerId).limit(100).get();
    return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  }
  // Legacy bridge: retrieve the known bootstrap ticket, then find matching tickets
  // by exact stored phone. This is temporary until the secure endpoint is deployed.
  const first=identity.bootstrapTicket;
  const phone=first?.phone||"";
  const snap=await db.collection("tickets").where("phone","==",phone).orderBy("createdAt","desc").limit(100).get().catch(()=>null);
  if(snap)return snap.docs.map(d=>({id:d.id,...d.data()}));
  return first?[first]:[];
}

        <div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">Ticket Progress</span><span className="meta-chip">Last updated {fmtDateTime(ticket.updatedAt||ticket.createdAt)}</span></div>
          <div className="workspace-card-body"><ProgressTrack status={ticket.status}/></div>
        </div>

        <div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">Issue Summary</span></div>
          <div className="workspace-card-body"><div className="ticket-summary">{ticket.issueDetail||ticket.problemDescription||ticket.issueTitle||"No detailed description was provided."}</div></div>
        </div>

        {(ticket.deviceType||ticket.manufacturer||ticket.modelNumber||ticket.serialNumber||ticket.operatingSystem||ticket.warrantyStatus||ticket.conditionOnArrival||ticket.accessories)&&<div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">💻 Device / Service Information</span></div>
          <div className="workspace-card-body"><div className="field-grid">{[["Device Type",ticket.deviceType],["Manufacturer",ticket.manufacturer],["Model",ticket.modelNumber],["Serial Number",ticket.serialNumber],["Operating System",ticket.operatingSystem],["Warranty",ticket.warrantyStatus],["Condition",ticket.conditionOnArrival],["Accessories",ticket.accessories]].filter(([,v])=>v).map(([k,v])=><div className="field" key={k}><div className="field-label">{k}</div><div className="field-value">{v}</div></div>)}</div></div>
        </div>}

        <div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">Activity & Customer Updates</span><span className="meta-chip">{notes.length} update{notes.length===1?"":"s"}</span></div>
          <ActivityTimeline notes={ticket.notes||[]} createdAt={ticket.createdAt}/>
        </div>

        {(ticket.quotationRef||ticket.quoteLink||ticket.invoiceNumber||ticket.invoiceLink)&&<div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">💰 Commercial Information</span></div>
          <div className="workspace-card-body"><div className="field-grid">
            {ticket.quotationRef&&<div className="field"><div className="field-label">Quotation</div><div className="field-value">{ticket.quotationRef}</div>{ticket.quoteLink&&<a className="btn-back" href={ticket.quoteLink} target="_blank" rel="noreferrer" style={{marginTop:10,padding:"8px 12px",fontSize:10}}>View Quotation →</a>}</div>}
            {ticket.invoiceNumber&&<div className="field"><div className="field-label">Invoice</div><div className="field-value">{ticket.invoiceNumber}</div>{ticket.invoiceLink&&<a className="btn-back" href={ticket.invoiceLink} target="_blank" rel="noreferrer" style={{marginTop:10,padding:"8px 12px",fontSize:10}}>View Invoice →</a>}</div>}
          </div></div>
        </div>}
      </main>

      <aside>
        <div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">Ticket Details</span></div>
          <div className="side-list">
            {[["Reference",ticket.ref],["Status",sv.l],["Priority",ticket.priority||"Normal"],["Service",svc.label],["Created",fmtDateTime(ticket.createdAt)], ["Updated",fmtDateTime(ticket.updatedAt||ticket.createdAt)],["Engineer",ticket.assignedEngineer||"Not assigned"],["SLA",sla?.label||"—"]].map(([k,v])=><div className="side-list-row" key={k}><span className="side-list-label">{k}</span><span className="side-list-value">{v}</span></div>)}
          </div>
        </div>
        <div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">Need Help?</span></div>
          <div className="action-stack">
            <a href={waUrl(CFG.wa,supportMsg)} target="_blank" rel="noreferrer" className="action-btn action-primary">💬 Contact Support</a>
            {needsSignoff&&<a href={`${CFG.signoffBase}?ticketId=${encodeURIComponent(ticket.ref)}`} target="_blank" rel="noreferrer" className="action-btn">✍️ Complete Sign-Off</a>}
            <a href={CFG.newTicketUrl} className="action-btn">＋ Create New Support Request</a>
          </div>
        </div>
        <div className="workspace-card">
          <div className="workspace-card-head"><span className="workspace-card-title">Customer Visibility</span></div>
          <div className="workspace-card-body"><div style={{fontSize:11,color:"var(--text3)",lineHeight:1.6}}>This workspace shows customer-visible updates only. Internal engineering notes remain protected inside CIMOP.</div></div>
        </div>
      </aside>
    </div>
    <div className="mobile-bottom"><button className="btn-logout" onClick={onBack}>🏠 Dashboard</button><a className="btn-logout" href={waUrl(CFG.wa,supportMsg)} target="_blank" rel="noreferrer">💬 Support</a></div>
  </div>;
}

function Dashboard({customer,tickets,onSelect,onLogout}){
  const [tab,setTab]=useState("overview");
  const active=tickets.filter(t=>!['closed','resolved'].includes(t.status));
  const open=tickets.filter(t=>['open'].includes(t.status)).length;
  const inProgress=tickets.filter(t=>['in-progress'].includes(t.status)).length;
  const waiting=tickets.filter(t=>['awaiting','awaiting-parts','awaiting-authorisation','awaiting-payment','awaiting-signoff','quoted'].includes(t.status)).length;
  const resolved=tickets.filter(t=>['resolved','closed'].includes(t.status)).length;
  const assets=[...new Map(tickets.flatMap(t=>t.deviceType?[{key:`${t.manufacturer}|${t.modelNumber}|${t.serialNumber}`,...t}]:[]).map(x=>[x.key,x])).values()];
  const urgent=tickets.filter(t=>t.priority==='Urgent'&&!['closed','resolved'].includes(t.status)).length;
  const slaBreaches=tickets.filter(t=>getSLAInfo(t)?.status==='breach').length;
  const latest=tickets.slice(0,6);
  const commercial=tickets.filter(t=>t.quotationRef||t.invoiceNumber||t.quoteLink||t.invoiceLink);
  const initials=(customer?.name||customer?.clientName||"C").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
  return <div className="portal-shell">
    <div className="portal-topbar">
      <div><div className="eyebrow">Customer Workspace</div><h1 className="portal-title">Welcome, {customer?.name||customer?.clientName||"Customer"} 👋</h1><p className="portal-subtitle">Your support desk, ticket history and service activity — all in one place.</p></div>
      <div className="customer-chip"><div className="customer-avatar">{initials}</div><div><div className="customer-chip-name">{customer?.company||customer?.name||"Customer"}</div><div className="customer-chip-id">{customer?.id||"Authenticated Customer"}</div></div></div>
    </div>

    <div className="psa-nav">{[["overview","Overview"],["tickets","🎫 Tickets"],["assets","💻 Assets"],["billing","💰 Quotes & Invoices"],["profile","👤 Profile"]].map(([id,l])=><button key={id} className={`btn-logout ${tab===id?"nav-active":""}`} onClick={()=>setTab(id)}>{l}</button>)}<button className="btn-logout" onClick={onLogout} style={{marginLeft:"auto"}}>Sign out</button></div>

    {tab==="overview"&&<>
      <div className="kpi-grid">
        <div className="kpi-card"><div className="kpi-label">Total Tickets</div><div className="kpi-value">{tickets.length}</div><div className="kpi-meta">All support history</div></div>
        <div className="kpi-card"><div className="kpi-label">Open</div><div className="kpi-value">{open}</div><div className="kpi-meta">Waiting in queue</div></div>
        <div className="kpi-card"><div className="kpi-label">In Progress</div><div className="kpi-value">{inProgress}</div><div className="kpi-meta">Engineer working</div></div>
        <div className="kpi-card"><div className="kpi-label">Awaiting You</div><div className="kpi-value">{waiting}</div><div className="kpi-meta">Action may be required</div></div>
        <div className="kpi-card"><div className="kpi-label">Resolved</div><div className="kpi-value">{resolved}</div><div className="kpi-meta">Completed history</div></div>
      </div>
      <div className="dashboard-grid">
        <div>
          <div className="panel"><div className="panel-head"><span className="panel-title">Recent Tickets</span><button className="panel-action" onClick={()=>setTab("tickets")}>View all →</button></div>{latest.length?latest.map(t=><button className="ticket-row" key={t.id} onClick={()=>onSelect(t)}><div className="ticket-row-main"><div><div className="ticket-ref-small">{t.ref}</div><div className="ticket-row-title">{service(t).icon} {ticketTitle(t)}</div><div className="ticket-row-meta"><span>{fmtDate(t.createdAt)}</span><span>•</span><span>{service(t).label}</span>{t.assignedEngineer&&t.assignedEngineer!=="Unassigned"&&<><span>•</span><span>👷 {t.assignedEngineer}</span></>}</div></div><div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:7}}><StatusBadge status={t.status}/>{t.priority&&<span className={`priority-pill priority-${t.priority}`}>{t.priority}</span>}<SLABadge ticket={t}/></div></div></button>):<div className="empty-panel">No customer tickets found.</div>}</div>
          <div className="panel"><div className="panel-head"><span className="panel-title">Quick Actions</span></div><div className="quick-grid"><a href={CFG.newTicketUrl} className="quick-btn"><div className="quick-icon">＋</div><div className="quick-title">New Support Request</div><div className="quick-sub">Open a new ticket</div></a><a href={waUrl(CFG.wa,"Hello Cyber I.T Masters, I need support from my Customer Portal.")} target="_blank" rel="noreferrer" className="quick-btn"><div className="quick-icon">💬</div><div className="quick-title">Contact Support</div><div className="quick-sub">Chat with our team</div></a><button className="quick-btn" onClick={()=>setTab("billing")}><div className="quick-icon">💰</div><div className="quick-title">Quotes & Invoices</div><div className="quick-sub">View linked documents</div></button><button className="quick-btn" onClick={()=>setTab("assets")}><div className="quick-icon">💻</div><div className="quick-title">My Assets</div><div className="quick-sub">Service history</div></button></div></div>
        </div>
        <aside>
          <div className="panel"><div className="panel-head"><span className="panel-title">Service Snapshot</span></div><div className="side-stat"><div className="side-stat-top"><span className="side-stat-label">Active tickets</span><span className="side-stat-value">{active.length}</span></div><div className="bar"><span style={{width:`${tickets.length?Math.min(100,(active.length/tickets.length)*100):0}%`}}/></div></div><div className="side-stat"><div className="side-stat-top"><span className="side-stat-label">Urgent active</span><span className="side-stat-value" style={{color:urgent?"#F87171":"var(--text)"}}>{urgent}</span></div></div><div className="side-stat"><div className="side-stat-top"><span className="side-stat-label">SLA breaches</span><span className="side-stat-value" style={{color:slaBreaches?"#F87171":"#10B981"}}>{slaBreaches}</span></div></div><div className="side-stat"><div className="side-stat-top"><span className="side-stat-label">Known assets</span><span className="side-stat-value">{assets.length}</span></div></div></div>
          <div className="panel"><div className="panel-head"><span className="panel-title">Need Assistance?</span></div><div style={{padding:18}}><div style={{fontSize:12,fontWeight:700,color:"var(--text)",marginBottom:5}}>Your IT is our responsibility.</div><div style={{fontSize:10,color:"var(--text3)",lineHeight:1.6,marginBottom:12}}>Contact our support team and include your ticket reference for faster assistance.</div><a href={waUrl(CFG.wa,"Hello Cyber I.T Masters, I need assistance with my support tickets.")} target="_blank" rel="noreferrer" className="btn-wa" style={{width:"100%",justifyContent:"center"}}>💬 WhatsApp Support</a></div></div>
        </aside>
      </div>
    </>}

    {tab==="tickets"&&<div className="panel"><div className="panel-head"><span className="panel-title">All Support Tickets</span><span className="meta-chip">{tickets.length} total</span></div>{tickets.length?tickets.map(t=><button className="ticket-row" key={t.id} onClick={()=>onSelect(t)}><div className="ticket-row-main"><div><div className="ticket-ref-small">{t.ref}</div><div className="ticket-row-title">{service(t).icon} {ticketTitle(t)}</div><div className="ticket-row-meta"><span>{fmtDate(t.createdAt)}</span><span>•</span><span>{t.priority||"Normal"}</span><span>•</span><span>{service(t).label}</span></div></div><div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:7}}><StatusBadge status={t.status}/><SLABadge ticket={t}/></div></div></button>):<div className="empty-panel">No tickets found.</div>}</div>}

    {tab==="assets"&&<div className="panel"><div className="panel-head"><span className="panel-title">My IT Assets</span><span className="meta-chip">From service history</span></div>{assets.length?assets.map(a=><div className="ticket-row" key={a.key} style={{cursor:"default"}}><div className="ticket-row-main"><div><div className="ticket-ref-small">{a.serialNumber||"ASSET"}</div><div className="ticket-row-title">💻 {a.manufacturer||"Device"} {a.modelNumber||""}</div><div className="ticket-row-meta"><span>{a.deviceType||"IT Device"}</span><span>•</span><span>Service history available</span></div></div></div></div>):<div className="empty-panel">No registered device history yet.</div>}</div>}

    {tab==="billing"&&<div className="panel"><div className="panel-head"><span className="panel-title">Quotes & Invoices</span><span className="meta-chip">{commercial.length} linked ticket{commercial.length===1?"":"s"}</span></div>{commercial.length?commercial.map(t=><div className="ticket-row" key={t.id} style={{cursor:"default"}}><div className="ticket-row-main"><div><div className="ticket-ref-small">{t.ref}</div><div className="ticket-row-title">{ticketTitle(t)}</div><div className="ticket-row-meta">{t.quotationRef&&<span>Quote: {t.quotationRef}</span>}{t.invoiceNumber&&<span>Invoice: {t.invoiceNumber}</span>}</div></div><div style={{display:"flex",gap:7,flexWrap:"wrap",justifyContent:"flex-end"}}>{t.quoteLink&&<a className="btn-back" style={{padding:"8px 11px",fontSize:10}} href={t.quoteLink} target="_blank" rel="noreferrer">View Quote</a>}{t.invoiceLink&&<a className="btn-back" style={{padding:"8px 11px",fontSize:10}} href={t.invoiceLink} target="_blank" rel="noreferrer">View Invoice</a>}</div></div></div>):<div className="empty-panel">No quotations or invoices are currently linked to your tickets.</div>}</div>}

    {tab==="profile"&&<div className="panel"><div className="panel-head"><span className="panel-title">Customer Profile</span></div><div className="workspace-card-body"><div className="field-grid">{[["Name",customer?.name||customer?.clientName],["Company",customer?.company],["Cellphone",customer?.phone],["Email",customer?.email],["Customer ID",customer?.id]].map(([k,v])=><div className="field" key={k}><div className="field-label">{k}</div><div className="field-value">{v||"—"}</div></div>)}</div><p style={{fontSize:10,color:"var(--text3)",lineHeight:1.6,marginTop:14}}>To update your customer details, please contact our support team. CIMOP keeps your customer identity consistent across support records.</p></div></div>}
  </div>;
}

function Root(){const [session,setSession]=useState(null);const [customer,setCustomer]=useState(null);const [tickets,setTickets]=useState([]);const [selected,setSelected]=useState(null);const [loading,setLoading]=useState(true);const [toast,setToast]=useState({msg:"",type:"ok"});const [theme,setTheme]=useState("dark");
 const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3000);};
 useEffect(()=>{const raw=sessionStorage.getItem(CFG.sessionKey);if(!raw){setLoading(false);return;}const s=JSON.parse(raw);setSession(s);(async()=>{try{if(s.secure&&!auth.currentUser){await auth.signInWithCustomToken(s.customToken).catch(()=>{});}const t=await loadCustomerTickets(s);setTickets(t);setCustomer(await loadCustomerProfile(s,t));setSelected(null);}catch(e){console.error(e);sessionStorage.removeItem(CFG.sessionKey);setSession(null);}finally{setLoading(false);}})();},[]);
 useEffect(()=>{if(!session?.secure||!session.customerId)return;const unsub=db.collection("tickets").where("customerId","==",session.customerId).limit(100).onSnapshot(s=>{const t=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));setTickets(t);setSelected(cur=>cur? t.find(x=>x.id===cur.id)||cur : t[0]||null);},e=>console.error(e));return()=>unsub();},[session?.secure,session?.customerId]);
 const login=async(s,t)=>{setSession(s);setTickets(t);setCustomer(await loadCustomerProfile(s,t));setSelected(null);showToast(`Welcome to your customer portal`,'info');};
 const logout=async()=>{sessionStorage.removeItem(CFG.sessionKey);if(auth.currentUser)await auth.signOut().catch(()=>{});setSession(null);setCustomer(null);setTickets([]);setSelected(null);};
 const toggle=()=>{const next=theme==="dark"?"light":"dark";setTheme(next);document.body.classList.toggle("light-mode",next==="light");};
 if(loading)return <div className="spinner-page"><div className="spinner"/><p>Loading Customer Portal…</p></div>;
 return <><div className="grid-bg"/><header className="portal-header"><div className="portal-header-inner"><div className="brand"><div className="brand-icon">⚡</div><div><div className="brand-text-name">{CFG.bizName}</div><div className="brand-text-sub">Customer Portal</div></div></div><div style={{display:"flex",gap:8,alignItems:"center"}}>{session&&<div className="live-indicator"><div className="live-dot"/><span className="live-text">SECURE</span></div>}<button className="dark-toggle" onClick={toggle}>{theme==="dark"?"☀️":"🌙"}</button></div></div></header>{!session?<LoginScreen onLogin={login}/>:selected?<TicketWorkspace ticket={selected} onBack={()=>setSelected(null)}/>:<Dashboard customer={customer} tickets={tickets} onSelect={setSelected} onLogout={logout}/>} {session&&selected&&<div style={{position:"fixed",bottom:18,left:"50%",transform:"translateX(-50%)",zIndex:40,display:"flex",gap:6}}><button className="btn-logout" onClick={()=>setSelected(null)}>🏠 Dashboard</button><button className="btn-logout" onClick={logout}>Sign out</button></div>}<Toast msg={toast.msg} type={toast.type}/></>;
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
</body>
</html>
