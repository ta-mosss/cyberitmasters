<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',sans-serif;transition:background 0.3s,color 0.3s;}
body.dark{--bg:#050810;--bg2:#080D18;--bg3:#0D1624;--bg4:#050810;--border:#0F1C2E;--border2:#1E2A3A;--text:#E2E8F0;--text2:#94A3B8;--text3:#475569;--text4:#334155;--card:#080D18;--sidebar:#080D18;color:#E2E8F0;background:#050810;}
body.light{--bg:#F0F4F8;--bg2:#FFFFFF;--bg3:#EBF0F7;--bg4:#F8FAFC;--border:#DDE3EE;--border2:#C8D1E0;--text:#1A2332;--text2:#4A5568;--text3:#718096;--text4:#A0AEC0;--card:#FFFFFF;--sidebar:#FFFFFF;color:#1A2332;background:#F0F4F8;}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
a{text-decoration:none;color:inherit;}button{cursor:pointer;font-family:inherit;}input,select,textarea{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00C896!important;box-shadow:0 0 0 3px rgba(0,200,150,0.1)!important;}
input[type="file"]{display:none;}
input[type="date"]::-webkit-calendar-picker-indicator,input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.4);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes popIn{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:scale(1);}}
.fu{animation:fadeUp 0.35s ease forwards;}
/* LAYOUT */
.main-layout{display:flex;min-height:100vh;}
.sidebar{width:248px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00C896,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.brand-name{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-0.01em;line-height:1.2;}
.brand-sub{font-size:9px;color:var(--text3);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;}
.sidebar-nav{flex:1;padding:12px 10px;}
.nav-group{margin-bottom:22px;}
.nav-group-label{font-size:9px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:0.12em;padding:0 8px;margin-bottom:5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all 0.15s;border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:var(--bg3);color:var(--text2);}
.nav-item.active{background:rgba(0,200,150,0.1);color:#00C896;font-weight:600;}
.nav-item .ni{font-size:15px;flex-shrink:0;width:20px;text-align:center;}
.nav-badge{margin-left:auto;background:#EF4444;color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:8px;font-family:'IBM Plex Mono',monospace;}
.nav-count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text4);}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border);}
.status-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-radius:8px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#00C896;box-shadow:0 0 6px #00C896;animation:pulse 2s infinite;}
/* CONTENT */
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-size:15px;font-weight:700;color:var(--text);}
.topbar-sub{font-size:12px;color:var(--text3);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.page-content{flex:1;overflow-y:auto;padding:24px;}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;color:var(--text);}
.card-body{padding:18px;}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color 0.2s;}
.stat-card:hover{border-color:var(--border2);}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--text);margin-bottom:2px;}
.stat-lbl{font-size:11px;color:var(--text3);font-weight:500;}
.stat-icon{font-size:20px;margin-bottom:6px;}
/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px;}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.g1{grid-template-columns:1fr;}
.form-field{display:flex;flex-direction:column;gap:4px;}
.form-field.span2{grid-column:1/-1;}
.field-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;}
.field-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:12px;transition:border 0.2s,box-shadow 0.2s;width:100%;}
.field-input::placeholder{color:var(--text4);}
select.field-input{cursor:pointer;}
textarea.field-input{resize:vertical;min-height:80px;line-height:1.6;}
.field-error{font-size:10px;color:#F87171;margin-top:1px;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#00C896,#0EA5E9);color:#050810;padding:9px 18px;font-size:12px;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 16px;font-size:12px;}
.btn-secondary:hover{border-color:var(--border2);color:var(--text);}
.btn-ghost{background:transparent;color:var(--text3);padding:7px 12px;font-size:12px;border:none;}
.btn-ghost:hover{color:var(--text2);}
.btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#F87171;padding:7px 13px;font-size:12px;}
.btn-warn{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#F59E0B;padding:7px 13px;font-size:12px;}
.btn-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#10B981;padding:7px 13px;font-size:12px;}
.btn-sm{padding:5px 11px;font-size:11px;}
.btn-wa{background:#25D366;color:#fff;padding:8px 16px;font-size:12px;}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:0.08em;padding:10px 13px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
.tbl td{padding:10px 13px;border-bottom:1px solid var(--bg);font-size:12px;color:var(--text2);vertical-align:middle;}
.tbl tr:hover td{background:rgba(0,200,150,0.02);}
.tbl tr.sel td{background:rgba(0,200,150,0.04);}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:16px;text-transform:uppercase;letter-spacing:0.04em;}
/* DETAIL PANEL */
.detail-panel{width:400px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:calc(100vh - 56px);position:sticky;top:56px;overflow:hidden;}
.detail-header{padding:15px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.detail-body{flex:1;overflow-y:auto;padding:14px 18px;}
.detail-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.dtab{flex:1;padding:9px 6px;font-size:10px;font-weight:700;color:var(--text3);cursor:pointer;border:none;background:transparent;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:0.03em;text-transform:uppercase;}
.dtab.active{color:#00C896;border-bottom-color:#00C896;}
.dtab:hover:not(.active){color:var(--text2);background:var(--bg3);}
.drow{display:flex;padding:7px 0;border-bottom:1px solid var(--border);}
.dkey{font-size:10px;color:var(--text3);width:110px;flex-shrink:0;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;padding-top:1px;}
.dval{font-size:12px;color:var(--text2);flex:1;line-height:1.4;}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-height:88vh;overflow-y:auto;animation:popIn 0.2s ease;}
.modal-box.sm{max-width:480px;}
.modal-box.md{max-width:640px;}
.modal-box.lg{max-width:820px;}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2;}
.modal-body{padding:20px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--card);}
/* SEARCHBAR */
.searchbar{position:relative;}
.searchbar input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-size:12px;}
.searchbar::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:14px;}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:11px 16px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.5);animation:toastIn 0.3s ease;}
.toast.ok{background:#00C896;color:#050810;}.toast.error{background:#EF4444;color:#fff;}.toast.info{background:#0EA5E9;color:#fff;}.toast.warn{background:#F59E0B;color:#050810;}
/* FILE DROP */
.file-drop{border:2px dashed var(--border2);border-radius:10px;padding:22px;text-align:center;cursor:pointer;transition:all 0.2s;}
.file-drop:hover,.file-drop.over{border-color:#00C896;background:rgba(0,200,150,0.03);}
/* DOC CHIP */
.doc-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px;}
.doc-chip-icon{font-size:18px;flex-shrink:0;}
.doc-chip-name{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-chip-size{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text4);white-space:nowrap;}
/* AVATAR */
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;font-family:'IBM Plex Mono',monospace;}
/* DIVIDER */
.divider{height:1px;background:var(--border);margin:14px 0;}
/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
/* NOTE ITEM */
.note-item{background:var(--bg);border-radius:8px;padding:9px 12px;margin-bottom:5px;border:1px solid var(--border);}
.note-text{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:3px;}
.note-meta{font-size:10px;color:var(--text4);font-family:'IBM Plex Mono',monospace;}
/* THEME TOGGLE */
.theme-toggle{width:34px;height:19px;border-radius:10px;background:var(--border2);border:none;position:relative;cursor:pointer;flex-shrink:0;}
.theme-toggle::after{content:"";position:absolute;top:3px;width:13px;height:13px;border-radius:50%;background:#00C896;transition:left 0.3s;}
body.dark .theme-toggle::after{left:3px;}body.light .theme-toggle::after{left:18px;}
/* WARRANTY ALERT */
.warr-ok{color:#10B981;font-weight:700;font-size:11px;font-family:'IBM Plex Mono',monospace;}
.warr-exp{color:#EF4444;font-weight:700;font-size:11px;font-family:'IBM Plex Mono',monospace;animation:blink 1.5s infinite;}
.warr-warn{color:#F59E0B;font-weight:700;font-size:11px;font-family:'IBM Plex Mono',monospace;animation:blink 2s infinite;}
/* PROGRESS BAR */
.prog-bar{height:4px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;}
.prog-fill{height:100%;border-radius:3px;transition:width 0.5s;}
/* TAG PILL */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;margin-right:4px;margin-bottom:3px;}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
/* SPINNER */
.spinner-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);flex-direction:column;gap:14px;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,200,150,0.2);border-top-color:#00C896;animation:spin 0.75s linear infinite;}
@media(max-width:900px){.sidebar{display:none;}.detail-panel{display:none;}.stats-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}.form-grid.g3{grid-template-columns:1fr;}.stats-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ══════════════════════════════════════════════
   CONSTANTS & CONFIG
══════════════════════════════════════════════ */
const AC="#00C896",AC2="#0EA5E9";
const CFG={
  bizName:"Cyber I.T Masters",
  tagline:"Professional I.T Solutions",
  wa:"27726650565",
  email:"info@mbulahenigroup.co.za",

const CLIENT_TYPES=["Individual","SME","Corporate","Government","Non-Profit"];
const CLIENT_STATUS=["Active","Inactive","Prospect","Blacklisted"];
const INDUSTRIES=["Technology","Finance","Healthcare","Education","Retail","Logistics","Construction","Legal","Other"];
const DOC_TYPES=["Quote","Invoice","Job Card","Contract","NDA","SLA","Other"];
const PAYMENT_METHODS=["EFT","Cash","Card","Debit Order","Credit"];
const PAYMENT_STATUS=["Paid","Pending","Overdue","Cancelled","Partial"];
const BILLING_STATUS={Paid:{c:"#10B981"},Pending:{c:"#F59E0B"},Overdue:{c:"#EF4444"},Cancelled:{c:"#6B7280"},Partial:{c:"#8B5CF6"}};
const ASSET_TYPES=["Laptop","Desktop","Server","Networking Device","Printer","Tablet","Smartphone","Monitor","UPS","Other"];
const ASSET_STATUS=["In Service","Under Repair","Repaired","Decommissioned","Returned","Written Off"];
const WARRANTY_STATUS=["Active","Expired","Expiring Soon","No Warranty","Unknown"];
const DEPT=["Technical","Admin","Sales","Management","Support","Finance"];
const EMP_STATUS=["Active","On Leave","Probation","Suspended","Resigned","Terminated"];
const EMP_ROLES=["Engineer","Senior Engineer","Team Lead","Manager","Admin","Sales Rep","Accountant","Director"];
const CONTRACT_TYPES=["Permanent","Fixed Term","Contractor","Internship","Part-Time"];
const LEAVE_TYPES=["Annual","Sick","Family Responsibility","Unpaid","Maternity","Paternity","Study"];
const LEAVE_STATUS=["Pending","Approved","Declined","Cancelled"];

/* ── FS HELPERS ── */
const ts=()=>new Date().toISOString();
const fmtDate=d=>d?new Date(d).toLocaleDateString("en-ZA"):"—";
const fmtDateTime=d=>d?new Date(d).toLocaleString("en-ZA"):"—";
const fmtMoney=n=>n!=null?`R ${Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",")}` :"—";
const uid=()=>Math.random().toString(36).slice(2,10).toUpperCase();
const initials=name=>name?name.trim().split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase():"?";
const avatarColor=name=>{const colors=["#00C896","#0EA5E9","#8B5CF6","#EC4899","#F59E0B","#10B981","#F97316","#EF4444"];return colors[Math.abs([...(name||"")].reduce((a,c)=>a+c.charCodeAt(0),0))%colors.length];};

async function fsSet(col,docId,data){await db.collection(col).doc(docId).set(data);}
async function fsUpdate(col,docId,data){await db.collection(col).doc(docId).update({...data,updatedAt:ts()});}
async function fsDelete(col,docId){await db.collection(col).doc(docId).delete();}

/* ── WARRANTY HELPER ── */
function warrantyInfo(expiryDate){
  if(!expiryDate)return{status:"No Warranty",cls:"warr-exp",daysLeft:null};
  const d=new Date(expiryDate);const now=new Date();
  const days=Math.round((d-now)/(1000*60*60*24));
  if(days<0)return{status:`Expired ${Math.abs(days)}d ago`,cls:"warr-exp",daysLeft:days};
  if(days<=60)return{status:`⚠ Expires in ${days}d`,cls:"warr-warn",daysLeft:days};
  return{status:`✓ ${days}d left`,cls:"warr-ok",daysLeft:days};
}

/* ══════════════════════════════════════════════
   SMALL ATOMS
══════════════════════════════════════════════ */
function Toast({msg,type}){if(!msg)return null;return<div className={`toast ${type||"ok"}`}>{msg}</div>;}
function Spinner(){return<div className="spinner-wrap"><div className="spinner"/><p style={{color:"var(--text3)",fontSize:13}}>Loading…</p></div>;}
function Lbl({c,req}){return<div className="field-label">{c}{req&&<span style={{color:"#F87171",marginLeft:3}}>*</span>}</div>;}
function Field({l,req,e,span,g1,children}){return<div className={`form-field${span?" span2":""}${g1?" g1":""}`}><Lbl c={l} req={req}/>{children}{e&&<div className="field-error">{e}</div>}</div>;}
const fi={className:"field-input"};
function Divider(){return<div className="divider"/>;}
function SecLabel({c}){return<div className="sec-label">{c}</div>;}
function AvatarCircle({name,size=36}){const c=avatarColor(name);return<div className="avatar" style={{width:size,height:size,background:c+"22",border:`1.5px solid ${c}55`,color:c,fontSize:size*0.35}}>{initials(name)}</div>;}
function DocIcon({type}){const m={Quote:"📄",Invoice:"🧾","Job Card":"🔧",Contract:"📝",NDA:"🔒",SLA:"📋",Other:"📎"};return<span>{m[type]||"📎"}</span>;}
function StatusBadge({s,map}){const v=map?.[s]||{c:"#64748B"};return<span className="badge" style={{background:v.c+"20",color:v.c,border:`1px solid ${v.c}30`}}><span style={{width:5,height:5,borderRadius:"50%",background:v.c,display:"inline-block"}}/>{s}</span>;}
function ConfirmModal({msg,onConfirm,onCancel}){
  return<div className="modal-overlay"><div className="modal-box sm fu"><div className="modal-header"><div style={{fontWeight:700,color:"var(--text)"}}>⚠️ Confirm</div><button className="btn btn-ghost btn-sm" onClick={onCancel}>✕</button></div><div className="modal-body"><p style={{color:"var(--text2)",fontSize:13,marginBottom:16}}>{msg}</p><div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button className="btn btn-secondary" onClick={onCancel}>Cancel</button><button className="btn btn-danger" onClick={onConfirm}>Confirm Delete</button></div></div></div></div>;
}

/* ══════════════════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════════════════ */
function LoginScreen({onAuth}){
  const [pw,setPw]=useState("");const [err,setErr]=useState("");
  const try_=()=>{if(pw===CFG.adminPw)onAuth();else setErr("Incorrect password");};
  return<div className="login-wrap"><div className="card fu" style={{maxWidth:340,width:"100%",padding:32}}>
    <div style={{width:44,height:44,borderRadius:12,background:`linear-gradient(135deg,${AC},${AC2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,marginBottom:14}}>⚡</div>
    <div style={{fontSize:20,fontWeight:800,color:"var(--text)",marginBottom:4}}>Management Portal</div>
    <div style={{fontSize:13,color:"var(--text3)",marginBottom:20}}>{CFG.bizName} · Internal Access</div>
    <Lbl c="Admin Password"/>
    <input {...fi} type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&try_()} placeholder="Enter password" autoFocus style={{marginTop:4,marginBottom:8}}/>
    {err&&<div style={{color:"#F87171",fontSize:11,marginBottom:8}}>{err}</div>}
    <button className="btn btn-primary" style={{width:"100%",marginTop:6}} onClick={try_}>Login →</button>
  </div></div>;
}

/* ══════════════════════════════════════════════
   ■ MODULE: CLIENTS
══════════════════════════════════════════════ */
function ClientsModule({showToast}){
  const [clients,setClients]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [srch,setSrch]=useState("");
  const [fStatus,setFStatus]=useState("all");
  const [detailTab,setDetailTab]=useState("overview");
  const [modal,setModal]=useState(null); // null | "add" | "edit" | "addDoc" | "addNote"
  const [confirm,setConfirm]=useState(null);
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);
  const docRef=useRef();

  useEffect(()=>{
    const unsub=db.collection("mgmt_clients").orderBy("createdAt","desc")
      .onSnapshot(snap=>{setClients(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);});
    return()=>unsub();
  },[]);

  const selClient=sel?clients.find(c=>c.id===sel):null;

  const filtered=clients.filter(c=>{
    if(fStatus!=="all"&&c.status!==fStatus)return false;
    const hay=`${c.companyName||""} ${c.contactName||""} ${c.email||""} ${c.phone||""} ${c.clientId||""}`.toLowerCase();
    return !srch||hay.includes(srch.toLowerCase());
  });

  const openAdd=()=>{setForm({status:"Active",type:"Individual",industry:"Technology"});setModal("add");};
  const openEdit=c=>{setForm({...c});setModal("edit");};

  const saveClient=async()=>{
    if(!form.companyName?.trim()&&!form.contactName?.trim()){showToast("Name required","error");return;}
    setSaving(true);
    try{
      if(modal==="add"){
        const id=`CL-${uid()}`;
        await fsSet("mgmt_clients",id,{...form,clientId:id,createdAt:ts(),updatedAt:ts(),docs:[],notes:[],totalBilled:0,totalPaid:0});
        showToast("Client created ✓");
      } else {
        await fsUpdate("mgmt_clients",form.id,form);
        showToast("Client updated ✓");
      }
      setModal(null);
    }catch(e){console.error(e);showToast("Save failed","error");}
    setSaving(false);
  };

  const deleteClient=async(c)=>{
    try{await fsDelete("mgmt_clients",c.id);setSel(null);showToast("Deleted");setConfirm(null);}
    catch(e){showToast("Delete failed","error");}
  };

  const addDoc=async(meta)=>{
    const doc={...meta,id:uid(),addedAt:ts()};
    const docs=[...(selClient.docs||[]),doc];
    await fsUpdate("mgmt_clients",selClient.id,{docs});
    showToast("Document saved ✓");setModal(null);
  };

  const removeDoc=async(docId)=>{
    const docs=(selClient.docs||[]).filter(d=>d.id!==docId);
    await fsUpdate("mgmt_clients",selClient.id,{docs});showToast("Document removed");
  };

  const addNote=async(txt)=>{
    if(!txt.trim())return;
    const notes=[...(selClient.notes||[]),{id:uid(),txt,at:ts(),author:"Admin"}];
    await fsUpdate("mgmt_clients",selClient.id,{notes});showToast("Note added ✓");setModal(null);
  };

  const totalActive=clients.filter(c=>c.status==="Active").length;
  const totalBilled=clients.reduce((a,c)=>a+(c.totalBilled||0),0);
  const totalPaid=clients.reduce((a,c)=>a+(c.totalPaid||0),0);

  if(loading)return<div style={{padding:40,textAlign:"center",color:"var(--text3)"}}>Loading clients…</div>;

  return(
    <div style={{display:"flex",flex:1,minHeight:0,overflow:"hidden"}}>
      {confirm&&<ConfirmModal msg={`Delete client "${confirm.companyName||confirm.contactName}"? This cannot be undone.`} onConfirm={()=>deleteClient(confirm)} onCancel={()=>setConfirm(null)}/>}

      {/* ── ADD/EDIT MODAL ── */}
      {(modal==="add"||modal==="edit")&&(
        <div className="modal-overlay"><div className="modal-box lg fu">
          <div className="modal-header">
            <div style={{fontWeight:700,color:"var(--text)",fontSize:15}}>{modal==="add"?"➕ New Client":"✏️ Edit Client"}</div>
            <button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button>
          </div>
          <div className="modal-body">
            <div className="form-grid g3" style={{marginBottom:14}}>
              <Field l="Company / Business Name" span><input {...fi} value={form.companyName||""} onChange={e=>setForm(f=>({...f,companyName:e.target.value}))} placeholder="Acme (Pty) Ltd"/></Field>
              <Field l="Primary Contact Name" req><input {...fi} value={form.contactName||""} onChange={e=>setForm(f=>({...f,contactName:e.target.value}))} placeholder="John Doe"/></Field>
              <Field l="Job Title"><input {...fi} value={form.jobTitle||""} onChange={e=>setForm(f=>({...f,jobTitle:e.target.value}))} placeholder="IT Manager"/></Field>
              <Field l="Email"><input {...fi} type="email" value={form.email||""} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="john@acme.co.za"/></Field>
              <Field l="Phone / WhatsApp"><input {...fi} value={form.phone||""} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="+27 72 000 0000"/></Field>
              <Field l="Alt Phone"><input {...fi} value={form.altPhone||""} onChange={e=>setForm(f=>({...f,altPhone:e.target.value}))} placeholder="Optional"/></Field>
              <Field l="Physical Address" span><input {...fi} value={form.address||""} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="123 Main St, Sandton, 2196"/></Field>
              <Field l="Postal Address" span><input {...fi} value={form.postalAddress||""} onChange={e=>setForm(f=>({...f,postalAddress:e.target.value}))} placeholder="P.O. Box or same as above"/></Field>
              <Field l="Client Type"><select {...fi} value={form.type||"Individual"} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>{CLIENT_TYPES.map(t=><option key={t}>{t}</option>)}</select></Field>
              <Field l="Industry"><select {...fi} value={form.industry||"Technology"} onChange={e=>setForm(f=>({...f,industry:e.target.value}))}>{INDUSTRIES.map(t=><option key={t}>{t}</option>)}</select></Field>
              <Field l="Status"><select {...fi} value={form.status||"Active"} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{CLIENT_STATUS.map(t=><option key={t}>{t}</option>)}</select></Field>
              <Field l="VAT Number"><input {...fi} value={form.vat||""} onChange={e=>setForm(f=>({...f,vat:e.target.value}))} placeholder="4XXXXXXXXX"/></Field>
              <Field l="Company Reg No."><input {...fi} value={form.regNo||""} onChange={e=>setForm(f=>({...f,regNo:e.target.value}))} placeholder="2025/000000/07"/></Field>
              <Field l="Credit Limit (R)"><input {...fi} type="number" value={form.creditLimit||""} onChange={e=>setForm(f=>({...f,creditLimit:parseFloat(e.target.value)||0}))} placeholder="0.00"/></Field>
              <Field l="Payment Terms"><input {...fi} value={form.paymentTerms||""} onChange={e=>setForm(f=>({...f,paymentTerms:e.target.value}))} placeholder="30 days"/></Field>
              <Field l="SLA Tier"><select {...fi} value={form.slaTier||"Standard"} onChange={e=>setForm(f=>({...f,slaTier:e.target.value}))}><option>Standard</option><option>Priority</option><option>Premium</option><option>Enterprise</option></select></Field>
              <Field l="Account Manager"><input {...fi} value={form.accountManager||""} onChange={e=>setForm(f=>({...f,accountManager:e.target.value}))} placeholder="Assigned engineer/sales"/></Field>
              <Field l="Notes" span><textarea {...fi} value={form.internalNotes||""} onChange={e=>setForm(f=>({...f,internalNotes:e.target.value}))} placeholder="Internal notes about this client…"/></Field>
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={saveClient} disabled={saving}>{saving?"Saving…":"Save Client"}</button>
          </div>
        </div></div>
      )}

      {/* ── ADD DOCUMENT MODAL ── */}
      {modal==="addDoc"&&(
        <DocUploadModal onSave={addDoc} onClose={()=>setModal(null)}/>
      )}

      {/* ── ADD NOTE MODAL ── */}
      {modal==="addNote"&&(
        <NoteModal onSave={addNote} onClose={()=>setModal(null)}/>
      )}

      {/* ── LEFT PANE ── */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"16px 20px 0"}}>
          <div className="stats-grid">
            <div className="stat-card"><div className="stat-icon">👥</div><div className="stat-val">{clients.length}</div><div className="stat-lbl">Total Clients</div></div>
            <div className="stat-card"><div className="stat-icon">✅</div><div className="stat-val" style={{color:AC}}>{totalActive}</div><div className="stat-lbl">Active</div></div>
            <div className="stat-card"><div className="stat-icon">💰</div><div className="stat-val" style={{color:"#F59E0B",fontSize:16}}>{fmtMoney(totalBilled)}</div><div className="stat-lbl">Total Billed</div></div>
            <div className="stat-card"><div className="stat-icon">💸</div><div className="stat-val" style={{color:"#10B981",fontSize:16}}>{fmtMoney(totalPaid)}</div><div className="stat-lbl">Total Collected</div></div>
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div className="searchbar" style={{flex:1,minWidth:180}}><input className="field-input" placeholder="Search name, email, phone, ID…" value={srch} onChange={e=>setSrch(e.target.value)}/></div>
            <select className="field-input" style={{width:"auto"}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
              <option value="all">All Status</option>{CLIENT_STATUS.map(s=><option key={s}>{s}</option>)}
            </select>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>+ New Client</button>
          </div>
        </div>
        <div style={{flex:1,overflow:"auto",padding:"0 20px 20px"}}>
          <div className="card" style={{overflow:"hidden"}}>
            {filtered.length===0?<div style={{padding:32,textAlign:"center",color:"var(--text4)",fontSize:13}}>No clients found.</div>:(
              <table className="tbl">
                <thead><tr>
                  <th>Client ID</th><th>Company / Name</th><th>Contact</th><th>Type</th><th>Status</th><th>SLA</th><th>Billed</th><th>Action</th>
                </tr></thead>
                <tbody>{filtered.map(c=>(
                  <tr key={c.id} className={sel===c.id?"sel":""} onClick={()=>{setSel(c.id);setDetailTab("overview");}}>
                    <td><span className="mono" style={{color:AC}}>{c.clientId||c.id}</span></td>
                    <td><div style={{display:"flex",alignItems:"center",gap:8}}><AvatarCircle name={c.companyName||c.contactName} size={28}/><div><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{c.companyName||c.contactName||"—"}</div>{c.companyName&&<div style={{fontSize:10,color:"var(--text3)"}}>{c.contactName}</div>}</div></div></td>
                    <td><div style={{fontSize:11}}>{c.phone||"—"}</div><div style={{fontSize:10,color:"var(--text4)"}}>{c.email||""}</div></td>
                    <td><span className="tag" style={{background:"rgba(14,165,233,0.1)",color:AC2}}>{c.type||"—"}</span></td>
                    <td><StatusBadge s={c.status||"Active"} map={{"Active":{c:"#10B981"},"Inactive":{c:"#6B7280"},"Prospect":{c:"#F59E0B"},"Blacklisted":{c:"#EF4444"}}}/></td>
                    <td><span style={{fontSize:11,color:"var(--text3)"}}>{c.slaTier||"Standard"}</span></td>
                    <td><span className="mono" style={{fontSize:11}}>{fmtMoney(c.totalBilled)}</span></td>
                    <td onClick={e=>e.stopPropagation()}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(c)}>✏️</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setConfirm(c)}>🗑</button>
                    </td>
                  </tr>
                ))}</tbody>
              </table>
            )}
          </div>
        </div>
      </div>

      {/* ── DETAIL PANEL ── */}
      {selClient&&(
        <div className="detail-panel">
          <div className="detail-header">
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
              <AvatarCircle name={selClient.companyName||selClient.contactName} size={40}/>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{selClient.companyName||selClient.contactName||"—"}</div>
                <div style={{fontSize:11,color:"var(--text3)"}}>{selClient.clientId}</div>
              </div>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setSel(null)}>✕</button>
            </div>
            <div style={{display:"flex",gap:5}}>
              <button className="btn btn-primary btn-sm" onClick={()=>openEdit(selClient)}>✏️ Edit</button>
              <a href={`https://wa.me/${(selClient.phone||"").replace(/[^0-9]/g,"").replace(/^0/,"27")}`} target="_blank" rel="noreferrer" className="btn btn-wa btn-sm">💬 WA</a>
              {selClient.email&&<a href={`mailto:${selClient.email}`} className="btn btn-secondary btn-sm">✉️</a>}
            </div>
          </div>
          <div className="detail-tabs">
            {["overview","docs","notes","billing"].map(t=><button key={t} className={`dtab${detailTab===t?" active":""}`} onClick={()=>setDetailTab(t)}>{t==="overview"?"📋 Info":t==="docs"?"📁 Docs":t==="notes"?"📝 Notes":"💰 Billing"}</button>)}
          </div>
          <div className="detail-body">
            {detailTab==="overview"&&<ClientOverviewTab c={selClient}/>}
            {detailTab==="docs"&&<ClientDocsTab c={selClient} onAddDoc={()=>setModal("addDoc")} onRemoveDoc={removeDoc}/>}
            {detailTab==="notes"&&<ClientNotesTab c={selClient} onAddNote={()=>setModal("addNote")}/>}
            {detailTab==="billing"&&<ClientBillingTab c={selClient} showToast={showToast}/>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   ■ MODULE: DOCUMENTS
══════════════════════════════════════════════ */
function DocumentsModule({showToast}){
  const [docs,setDocs]=useState([]);
  const [clients,setClients]=useState([]);
  const [loading,setLoading]=useState(true);
  const [srch,setSrch]=useState("");
  const [fType,setFType]=useState("all");
  const [sel,setSel]=useState(null);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);
  const [confirm,setConfirm]=useState(null);

  useEffect(()=>{
    const u1=db.collection("mgmt_documents").orderBy("createdAt","desc").onSnapshot(snap=>{setDocs(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);});
    const u2=db.collection("mgmt_clients").onSnapshot(snap=>{setClients(snap.docs.map(d=>({id:d.id,...d.data()})));});
    return()=>{u1();u2();};
  },[]);

  const selDoc=sel?docs.find(d=>d.id===sel):null;
  const filtered=docs.filter(d=>{
    if(fType!=="all"&&d.type!==fType)return false;
    const hay=`${d.name||""} ${d.refNo||""} ${d.clientName||""} ${d.type||""}`.toLowerCase();
    return !srch||hay.includes(srch.toLowerCase());
  });

  const openAdd=()=>{setForm({type:"Invoice",status:"Pending",date:new Date().toISOString().slice(0,10)});setModal("add");};
  const openEdit=d=>{setForm({...d});setModal("edit");};

  const saveDoc=async()=>{
    if(!form.name?.trim()){showToast("Document name required","error");return;}
    setSaving(true);
    try{
      if(modal==="add"){
        const id=`DOC-${uid()}`;
        await fsSet("mgmt_documents",id,{...form,docId:id,createdAt:ts(),updatedAt:ts()});
        showToast("Document created ✓");
      } else {
        await fsUpdate("mgmt_documents",form.id,form);
        showToast("Document updated ✓");
      }
      setModal(null);
    }catch(e){showToast("Save failed","error");}
    setSaving(false);
  };

  const deleteDoc=async(d)=>{try{await fsDelete("mgmt_documents",d.id);setSel(null);showToast("Deleted");setConfirm(null);}catch(e){showToast("Error","error");}};

  const totalByType=t=>docs.filter(d=>d.type===t).length;
  const totalValue=docs.filter(d=>d.type==="Invoice").reduce((a,d)=>a+(d.amount||0),0);
  const overdue=docs.filter(d=>d.status==="Overdue").length;

  if(loading)return<div style={{padding:40,textAlign:"center",color:"var(--text3)"}}>Loading…</div>;

  const DocForm=()=>(
    <div className="modal-overlay"><div className="modal-box md fu">
      <div className="modal-header"><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{modal==="add"?"➕ New Document":"✏️ Edit Document"}</div><button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button></div>
      <div className="modal-body">

          <Field l="Document Type"><select {...fi} value={form.type||"Invoice"} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>{DOC_TYPES.map(t=><option key={t}>{t}</option>)}</select></Field>
          <Field l="Reference Number"><input {...fi} value={form.refNo||""} onChange={e=>setForm(f=>({...f,refNo:e.target.value}))} placeholder="INV-2025-001"/></Field>

          <Field l="Date"><input {...fi} type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></Field>

          <Field l="Amount (R)"><input {...fi} type="number" value={form.amount||""} onChange={e=>setForm(f=>({...f,amount:parseFloat(e.target.value)||0}))} placeholder="0.00"/></Field>
          <Field l="VAT Amount (R)"><input {...fi} type="number" value={form.vatAmount||""} onChange={e=>setForm(f=>({...f,vatAmount:parseFloat(e.target.value)||0}))} placeholder="0.00"/></Field>
          <Field l="Payment Status"><select {...fi} value={form.status||"Pending"} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{PAYMENT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field l="Payment Method"><select {...fi} value={form.paymentMethod||""} onChange={e=>setForm(f=>({...f,paymentMethod:e.target.value}))}><option value="">— Select —</option>{PAYMENT_METHODS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field l="File URL / Link" span><input {...fi} value={form.url||""} onChange={e=>setForm(f=>({...f,url:e.target.value}))} placeholder="https://drive.google.com/…"/></Field>
          <Field l="Ticket Reference"><input {...fi} value={form.ticketRef||""} onChange={e=>setForm(f=>({...f,ticketRef:e.target.value}))} placeholder="CIM-1001"/></Field>
          <Field l="Description" span><textarea {...fi} value={form.description||""} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Brief description…"/></Field>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancel</button>
        <button className="btn btn-primary" onClick={saveDoc} disabled={saving}>{saving?"Saving…":"Save Document"}</button>
      </div>
    </div></div>
  );

  return(
    <div style={{display:"flex",flex:1,minHeight:0,overflow:"hidden"}}>
      {confirm&&<ConfirmModal msg={`Delete "${confirm.name}"?`} onConfirm={()=>deleteDoc(confirm)} onCancel={()=>setConfirm(null)}/>}
      {(modal==="add"||modal==="edit")&&<DocForm/>}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"16px 20px 0"}}>
          <div className="stats-grid">
            <div className="stat-card"><div className="stat-icon">🧾</div><div className="stat-val">{docs.length}</div><div className="stat-lbl">Total Documents</div></div>
            <div className="stat-card"><div className="stat-icon">📄</div><div className="stat-val" style={{color:AC}}>{totalByType("Invoice")}</div><div className="stat-lbl">Invoices</div></div>
            <div className="stat-card"><div className="stat-icon">💰</div><div className="stat-val" style={{color:"#F59E0B",fontSize:16}}>{fmtMoney(totalValue)}</div><div className="stat-lbl">Invoice Value</div></div>
            <div className="stat-card"><div className="stat-icon">⚠️</div><div className="stat-val" style={{color:overdue>0?"#EF4444":"#10B981"}}>{overdue}</div><div className="stat-lbl">Overdue</div></div>
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div className="searchbar" style={{flex:1,minWidth:180}}><input className="field-input" placeholder="Search name, ref, client…" value={srch} onChange={e=>setSrch(e.target.value)}/></div>
            <select className="field-input" style={{width:"auto"}} value={fType} onChange={e=>setFType(e.target.value)}><option value="all">All Types</option>{DOC_TYPES.map(t=><option key={t}>{t}</option>)}</select>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>+ New Document</button>
          </div>
        </div>
        <div style={{flex:1,overflow:"auto",padding:"0 20px 20px"}}>
          <div className="card" style={{overflow:"hidden"}}>
            {filtered.length===0?<div style={{padding:32,textAlign:"center",color:"var(--text4)",fontSize:13}}>No documents found.</div>:(
              <table className="tbl"><thead><tr>
                <th>Doc ID</th><th>Type</th><th>Name / Ref</th><th>Client</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th>
              </tr></thead><tbody>
                {filtered.map(d=>(
                  <tr key={d.id} className={sel===d.id?"sel":""} onClick={()=>setSel(d.id)}>
                    <td><span className="mono" style={{color:AC}}>{d.docId||d.id}</span></td>
                    <td><DocIcon type={d.type}/> <span style={{fontSize:11}}>{d.type}</span></td>
                    <td><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{d.name}</div><div style={{fontSize:10,color:"var(--text4)"}}>{d.refNo||""}</div></td>
                    <td style={{fontSize:11}}>{d.clientName||"—"}</td>
                    <td><div style={{fontSize:11}}>{fmtDate(d.date)}</div>{d.dueDate&&<div style={{fontSize:10,color:"var(--text4)"}}>Due: {fmtDate(d.dueDate)}</div>}</td>
                    <td><span className="mono">{fmtMoney(d.amount)}</span></td>
                    <td><StatusBadge s={d.status||"Pending"} map={BILLING_STATUS}/></td>
                    <td onClick={e=>e.stopPropagation()} style={{display:"flex",gap:4}}>
                      {d.url&&<a href={d.url} target="_blank" rel="noreferrer" className="btn btn-ghost btn-sm">↗</a>}
                      <button className="btn btn-ghost btn-sm" onClick={()=>openEdit(d)}>✏️</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setConfirm(d)}>🗑</button>
                    </td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>
      {selDoc&&(
        <div className="detail-panel">
          <div className="detail-header">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{fontSize:24}}><DocIcon type={selDoc.type}/></div>
              <div><div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{selDoc.name}</div><div style={{fontSize:11,color:"var(--text3)"}}>{selDoc.docId}</div></div>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setSel(null)}>✕</button>
            </div>
            <div style={{display:"flex",gap:5}}>
              <button className="btn btn-primary btn-sm" onClick={()=>openEdit(selDoc)}>✏️ Edit</button>
              {selDoc.url&&<a href={selDoc.url} target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm">↗ Open</a>}
            </div>
          </div>
          <div className="detail-body">
            {[["Type",selDoc.type],["Reference",selDoc.refNo],["Client",selDoc.clientName],["Date",fmtDate(selDoc.date)],["Due Date",fmtDate(selDoc.dueDate)],["Amount",fmtMoney(selDoc.amount)],["VAT",fmtMoney(selDoc.vatAmount)],["Total",fmtMoney((selDoc.amount||0)+(selDoc.vatAmount||0))],["Status",selDoc.status],["Payment",selDoc.paymentMethod],["Ticket Ref",selDoc.ticketRef],["Created",fmtDate(selDoc.createdAt)]].filter(([,v])=>v&&v!=="—").map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}

      )}

  );
}

/* ══════════════════════════════════════════════
   ■ MODULE: ASSETS & WARRANTY
══════════════════════════════════════════════ */
function AssetsModule({showToast}){
  const [assets,setAssets]=useState([]);
  const [clients,setClients]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [srch,setSrch]=useState("");
  const [fStatus,setFStatus]=useState("all");
  const [fWarr,setFWarr]=useState("all");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);
  const [confirm,setConfirm]=useState(null);
  const [noteText,setNoteText]=useState("");

  useEffect(()=>{
    const u1=db.collection("mgmt_assets").orderBy("createdAt","desc").onSnapshot(snap=>{setAssets(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);});
    const u2=db.collection("mgmt_clients").onSnapshot(snap=>{setClients(snap.docs.map(d=>({id:d.id,...d.data()})));});
    return()=>{u1();u2();};
  },[]);

  const selAsset=sel?assets.find(a=>a.id===sel):null;
  const filtered=assets.filter(a=>{
    if(fStatus!=="all"&&a.status!==fStatus)return false;
    if(fWarr!=="all"){const wi=warrantyInfo(a.warrantyExpiry);const w=wi.daysLeft===null?"No Warranty":wi.daysLeft<0?"Expired":wi.daysLeft<=60?"Expiring Soon":"Active";if(w!==fWarr)return false;}
    const hay=`${a.assetId||""} ${a.name||""} ${a.serial||""} ${a.clientName||""} ${a.assetType||""} ${a.manufacturer||""} ${a.model||""}`.toLowerCase();
    return !srch||hay.includes(srch.toLowerCase());
  });

  const openAdd=()=>{setForm({status:"In Service",assetType:"Laptop",warrantyStatus:"Unknown"});setModal("add");};
  const openEdit=a=>{setForm({...a});setModal("edit");};

  const saveAsset=async()=>{
    if(!form.name?.trim()){showToast("Asset name required","error");return;}
    setSaving(true);
    try{
      if(modal==="add"){
        const id=`AST-${uid()}`;
        await fsSet("mgmt_assets",id,{...form,assetId:id,createdAt:ts(),updatedAt:ts(),serviceHistory:[]});
        showToast("Asset registered ✓");
      } else {
        await fsUpdate("mgmt_assets",form.id,form);
        showToast("Asset updated ✓");
      }
      setModal(null);
    }catch(e){showToast("Save failed","error");}
    setSaving(false);
  };

  const deleteAsset=async a=>{try{await fsDelete("mgmt_assets",a.id);setSel(null);showToast("Deleted");setConfirm(null);}catch(e){showToast("Error","error");}};

  const addServiceEntry=async()=>{
    if(!noteText.trim())return;
    const entry={id:uid(),note:noteText,at:ts(),by:"Admin"};
    const serviceHistory=[...(selAsset.serviceHistory||[]),entry];
    await fsUpdate("mgmt_assets",selAsset.id,{serviceHistory});
    setNoteText("");showToast("Service entry added ✓");
  };

  const expiring=assets.filter(a=>{const wi=warrantyInfo(a.warrantyExpiry);return wi.daysLeft!==null&&wi.daysLeft>=0&&wi.daysLeft<=60;}).length;
  const expired=assets.filter(a=>{const wi=warrantyInfo(a.warrantyExpiry);return wi.daysLeft!==null&&wi.daysLeft<0;}).length;

  if(loading)return<div style={{padding:40,textAlign:"center",color:"var(--text3)"}}>Loading…</div>;

  const AssetForm=()=>(
    <div className="modal-overlay"><div className="modal-box lg fu">
      <div className="modal-header"><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{modal==="add"?"➕ Register Asset":"✏️ Edit Asset"}</div><button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button></div>
      <div className="modal-body">
        <div className="form-grid g3" style={{marginBottom:12}}>
          <Field l="Asset Name / Label" req span><input {...fi} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Dell Latitude 5520 – John Smith"/></Field>
          <Field l="Asset Type"><select {...fi} value={form.assetType||"Laptop"} onChange={e=>setForm(f=>({...f,assetType:e.target.value}))}>{ASSET_TYPES.map(t=><option key={t}>{t}</option>)}</select></Field>
          <Field l="Manufacturer"><input {...fi} value={form.manufacturer||""} onChange={e=>setForm(f=>({...f,manufacturer:e.target.value}))} placeholder="Dell, HP, Apple…"/></Field>
          <Field l="Model"><input {...fi} value={form.model||""} onChange={e=>setForm(f=>({...f,model:e.target.value}))} placeholder="Latitude 5520"/></Field>
          <Field l="Serial Number"><input {...fi} value={form.serial||""} onChange={e=>setForm(f=>({...f,serial:e.target.value}))} placeholder="SN-XXXXXXX"/></Field>
          <Field l="IMEI / Tag"><input {...fi} value={form.imei||""} onChange={e=>setForm(f=>({...f,imei:e.target.value}))} placeholder="Asset tag or IMEI"/></Field>
          <Field l="OS / Firmware"><input {...fi} value={form.os||""} onChange={e=>setForm(f=>({...f,os:e.target.value}))} placeholder="Windows 11 Pro"/></Field>
          <Field l="Status"><select {...fi} value={form.status||"In Service"} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{ASSET_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field l="Assigned Client"><select {...fi} value={form.clientId||""} onChange={e=>{const c=clients.find(c=>c.id===e.target.value);setForm(f=>({...f,clientId:e.target.value,clientName:c?.companyName||c?.contactName||""}));}}><option value="">— None / Internal —</option>{clients.map(c=><option key={c.id} value={c.id}>{c.companyName||c.contactName}</option>)}</select></Field>
          <Field l="Assigned User"><input {...fi} value={form.assignedUser||""} onChange={e=>setForm(f=>({...f,assignedUser:e.target.value}))} placeholder="Staff member name"/></Field>
          <Field l="Location"><input {...fi} value={form.location||""} onChange={e=>setForm(f=>({...f,location:e.target.value}))} placeholder="Office / site name"/></Field>
          <Field l="Purchase Date"><input {...fi} type="date" value={form.purchaseDate||""} onChange={e=>setForm(f=>({...f,purchaseDate:e.target.value}))}/></Field>
          <Field l="Purchase Price (R)"><input {...fi} type="number" value={form.purchasePrice||""} onChange={e=>setForm(f=>({...f,purchasePrice:parseFloat(e.target.value)||0}))} placeholder="0.00"/></Field>
          <Field l="Supplier"><input {...fi} value={form.supplier||""} onChange={e=>setForm(f=>({...f,supplier:e.target.value}))} placeholder="Supplier name"/></Field>
          <Field l="Warranty Provider"><input {...fi} value={form.warrantyProvider||""} onChange={e=>setForm(f=>({...f,warrantyProvider:e.target.value}))} placeholder="Dell ProSupport, etc."/></Field>
          <Field l="Warranty Expiry"><input {...fi} type="date" value={form.warrantyExpiry||""} onChange={e=>setForm(f=>({...f,warrantyExpiry:e.target.value}))}/></Field>
          <Field l="Warranty Ref No."><input {...fi} value={form.warrantyRef||""} onChange={e=>setForm(f=>({...f,warrantyRef:e.target.value}))} placeholder="Warranty/service contract no."/></Field>
          <Field l="Repair Ticket Ref"><input {...fi} value={form.ticketRef||""} onChange={e=>setForm(f=>({...f,ticketRef:e.target.value}))} placeholder="CIM-1001"/></Field>
          <Field l="Notes" span><textarea {...fi} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Specs, condition notes, accessories…"/></Field>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancel</button>
        <button className="btn btn-primary" onClick={saveAsset} disabled={saving}>{saving?"Saving…":"Save Asset"}</button>
      </div>
    </div></div>
  );

  return(
    <div style={{display:"flex",flex:1,minHeight:0,overflow:"hidden"}}>
      {confirm&&<ConfirmModal msg={`Delete asset "${confirm.name}"?`} onConfirm={()=>deleteAsset(confirm)} onCancel={()=>setConfirm(null)}/>}
      {(modal==="add"||modal==="edit")&&<AssetForm/>}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"16px 20px 0"}}>
          <div className="stats-grid">
            <div className="stat-card"><div className="stat-icon">🖥️</div><div className="stat-val">{assets.length}</div><div className="stat-lbl">Total Assets</div></div>
            <div className="stat-card"><div className="stat-icon">✅</div><div className="stat-val" style={{color:AC}}>{assets.filter(a=>a.status==="In Service").length}</div><div className="stat-lbl">In Service</div></div>
            <div className="stat-card"><div className="stat-icon">⚠️</div><div className="stat-val" style={{color:"#F59E0B"}}>{expiring}</div><div className="stat-lbl">Warranty Expiring</div></div>
            <div className="stat-card"><div className="stat-icon">🔴</div><div className="stat-val" style={{color:"#EF4444"}}>{expired}</div><div className="stat-lbl">Warranty Expired</div></div>
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div className="searchbar" style={{flex:1,minWidth:180}}><input className="field-input" placeholder="Search asset ID, name, serial, client…" value={srch} onChange={e=>setSrch(e.target.value)}/></div>
            <select className="field-input" style={{width:"auto"}} value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="all">All Status</option>{ASSET_STATUS.map(s=><option key={s}>{s}</option>)}</select>
            <select className="field-input" style={{width:"auto"}} value={fWarr} onChange={e=>setFWarr(e.target.value)}><option value="all">All Warranty</option><option>Active</option><option>Expiring Soon</option><option>Expired</option><option>No Warranty</option></select>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>+ Register Asset</button>
          </div>
        </div>
        <div style={{flex:1,overflow:"auto",padding:"0 20px 20px"}}>
          <div className="card" style={{overflow:"hidden"}}>
            {filtered.length===0?<div style={{padding:32,textAlign:"center",color:"var(--text4)",fontSize:13}}>No assets found.</div>:(
              <table className="tbl"><thead><tr>
                <th>Asset ID</th><th>Name</th><th>Type</th><th>Serial</th><th>Client</th><th>Status</th><th>Warranty</th><th>Actions</th>
              </tr></thead><tbody>
                {filtered.map(a=>{const wi=warrantyInfo(a.warrantyExpiry);return(
                  <tr key={a.id} className={sel===a.id?"sel":""} onClick={()=>setSel(a.id)}>
                    <td><span className="mono" style={{color:AC}}>{a.assetId||a.id}</span></td>
                    <td><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{a.name}</div><div style={{fontSize:10,color:"var(--text4)"}}>{a.manufacturer} {a.model}</div></td>
                    <td><span style={{fontSize:11}}>{a.assetType}</span></td>
                    <td><span className="mono">{a.serial||"—"}</span></td>
                    <td style={{fontSize:11}}>{a.clientName||"Internal"}</td>
                    <td><StatusBadge s={a.status||"In Service"} map={{"In Service":{c:"#10B981"},"Under Repair":{c:"#F59E0B"},"Repaired":{c:AC},"Decommissioned":{c:"#6B7280"},"Returned":{c:"#8B5CF6"},"Written Off":{c:"#EF4444"}}}/></td>
                    <td><span className={wi.cls}>{wi.status}</span></td>
                    <td onClick={e=>e.stopPropagation()}><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(a)}>✏️</button><button className="btn btn-ghost btn-sm" onClick={()=>setConfirm(a)}>🗑</button></td>
                  </tr>
                );})}
              </tbody></table>
            )}
          </div>
        </div>
      </div>
      {selAsset&&(()=>{const wi=warrantyInfo(selAsset.warrantyExpiry);return(
        <div className="detail-panel">
          <div className="detail-header">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{fontSize:28}}>🖥️</div>
              <div><div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{selAsset.name}</div><div style={{fontSize:10,color:"var(--text3)"}}>{selAsset.assetId}</div></div>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setSel(null)}>✕</button>
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>openEdit(selAsset)}>✏️ Edit Asset</button>
          </div>
          <div className="detail-body">
            <SecLabel c="Asset Details"/>
            {[["Type",selAsset.assetType],["Manufacturer",selAsset.manufacturer],["Model",selAsset.model],["Serial",selAsset.serial],["IMEI/Tag",selAsset.imei],["OS",selAsset.os],["Status",selAsset.status],["Client",selAsset.clientName||"Internal"],["User",selAsset.assignedUser],["Location",selAsset.location]].filter(([,v])=>v).map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
            <Divider/>
            <SecLabel c="Warranty"/>
            <div style={{background:wi.daysLeft!==null&&wi.daysLeft<0?"rgba(239,68,68,0.08)":wi.daysLeft!==null&&wi.daysLeft<=60?"rgba(245,158,11,0.08)":"rgba(16,185,129,0.08)",border:`1px solid ${wi.daysLeft!==null&&wi.daysLeft<0?"rgba(239,68,68,0.25)":wi.daysLeft!==null&&wi.daysLeft<=60?"rgba(245,158,11,0.25)":"rgba(16,185,129,0.25)"}`,borderRadius:8,padding:"10px 14px",marginBottom:10}}>
              <div className={wi.cls} style={{fontSize:13,marginBottom:4}}>{wi.status}</div>
              {selAsset.warrantyExpiry&&<div style={{fontSize:11,color:"var(--text3)"}}>Expires: {fmtDate(selAsset.warrantyExpiry)}</div>}
              {selAsset.warrantyProvider&&<div style={{fontSize:11,color:"var(--text3)"}}>Provider: {selAsset.warrantyProvider}</div>}
              {selAsset.warrantyRef&&<div style={{fontSize:11,color:"var(--text3)"}}>Ref: {selAsset.warrantyRef}</div>}
            </div>
            <Divider/>
            <SecLabel c="Purchase Info"/>
            {[["Purchase Date",fmtDate(selAsset.purchaseDate)],["Price",fmtMoney(selAsset.purchasePrice)],["Supplier",selAsset.supplier],["Ticket Ref",selAsset.ticketRef]].filter(([,v])=>v&&v!=="—").map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
            {selAsset.notes&&<><Divider/><SecLabel c="Notes"/><div style={{fontSize:12,color:"var(--text2)",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",lineHeight:1.6}}>{selAsset.notes}</div></>}
            <Divider/>
            <SecLabel c="Service History"/>
            <div style={{marginBottom:8}}>
              <textarea {...fi} value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Log a service entry…" style={{minHeight:60,marginBottom:6,fontSize:12}}/>
              <button className="btn btn-primary btn-sm" onClick={addServiceEntry} style={{width:"100%"}}>+ Add Entry</button>
            </div>
            {[...(selAsset.serviceHistory||[])].reverse().map(e=>(
              <div key={e.id} className="note-item"><div className="note-text">{e.note}</div><div className="note-meta">{e.by} · {fmtDateTime(e.at)}</div></div>
            ))}
          </div>
        </div>
      );})()}
    </div>
  );
}

/* ══════════════════════════════════════════════

function BillingModule({showToast}){
  const [invoices,setInvoices]=useState([]);
  const [clients,setClients]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [srch,setSrch]=useState("");
  const [fStatus,setFStatus]=useState("all");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({items:[{description:"",qty:1,rate:0}]});
  const [saving,setSaving]=useState(false);
  const [confirm,setConfirm]=useState(null);

  useEffect(()=>{
    const u1=db.collection("mgmt_billing").orderBy("createdAt","desc").onSnapshot(snap=>{setInvoices(snap.docs.map(d=>({id:d.id,...d.data()})));setLoading(false);});
    const u2=db.collection("mgmt_clients").onSnapshot(snap=>{setClients(snap.docs.map(d=>({id:d.id,...d.data()})));});
    return()=>{u1();u2();};
  },[]);

  const selInv=sel?invoices.find(i=>i.id===sel):null;
  const filtered=invoices.filter(i=>{
    if(fStatus!=="all"&&i.status!==fStatus)return false;
    const hay=`${i.invoiceNo||""} ${i.clientName||""} ${i.description||""}`.toLowerCase();
    return !srch||hay.includes(srch.toLowerCase());
  });

  const calcTotal=items=>(items||[]).reduce((a,it)=>a+(parseFloat(it.qty||0)*parseFloat(it.rate||0)),0);
  const calcVAT=(sub,vat)=>vat?sub*0.15:0;

  const openAdd=()=>{
    const n=`INV-${new Date().getFullYear()}-${String(invoices.length+1).padStart(3,"0")}`;
    setForm({status:"Pending",invoiceNo:n,date:new Date().toISOString().slice(0,10),items:[{description:"",qty:1,rate:0}],includeVAT:true});
    setModal("add");
  };
  const openEdit=i=>{setForm({...i,items:i.items||[{description:"",qty:1,rate:0}]});setModal("edit");};

  const addItem=()=>setForm(f=>({...f,items:[...f.items,{description:"",qty:1,rate:0}]}));
  const removeItem=idx=>setForm(f=>({...f,items:f.items.filter((_,i)=>i!==idx)}));
  const updateItem=(idx,k,v)=>setForm(f=>({...f,items:f.items.map((it,i)=>i===idx?{...it,[k]:v}:it)}));

  const saveInv=async()=>{
    if(!form.clientId){showToast("Select a client","error");return;}
    setSaving(true);
    const sub=calcTotal(form.items);
    const vat=calcVAT(sub,form.includeVAT);
    const total=sub+vat;
    try{
      if(modal==="add"){
        const id=`BIL-${uid()}`;
        await fsSet("mgmt_billing",id,{...form,id,subtotal:sub,vatAmount:vat,total,createdAt:ts(),updatedAt:ts()});
        showToast("Invoice created ✓");
      } else {
        await fsUpdate("mgmt_billing",form.id,{...form,subtotal:sub,vatAmount:vat,total});
        showToast("Invoice updated ✓");
      }
      setModal(null);
    }catch(e){showToast("Save failed","error");}
    setSaving(false);
  };

  const markPaid=async i=>{await fsUpdate("mgmt_billing",i.id,{status:"Paid",paidAt:ts()});showToast("Marked as Paid ✓");};
  const deleteInv=async i=>{try{await fsDelete("mgmt_billing",i.id);setSel(null);showToast("Deleted");setConfirm(null);}catch(e){showToast("Error","error");}};

  const totalRevenue=invoices.filter(i=>i.status==="Paid").reduce((a,i)=>a+(i.total||0),0);
  const totalPending=invoices.filter(i=>i.status==="Pending").reduce((a,i)=>a+(i.total||0),0);
  const totalOverdue=invoices.filter(i=>i.status==="Overdue").reduce((a,i)=>a+(i.total||0),0);

  if(loading)return<div style={{padding:40,textAlign:"center",color:"var(--text3)"}}>Loading…</div>;

  const InvForm=()=>{
    const sub=calcTotal(form.items);const vat=calcVAT(sub,form.includeVAT);const total=sub+vat;
    return<div className="modal-overlay"><div className="modal-box lg fu">
      <div className="modal-header"><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{modal==="add"?"🧾 New Invoice":"✏️ Edit Invoice"}</div><button className="btn btn-ghost btn-sm" onClick={()=>setModal(null)}>✕</button></div>
      <div className="modal-body">
        <div className="form-grid g3" style={{marginBottom:16}}>
          <Field l="Invoice No." req><input {...fi} value={form.invoiceNo||""} onChange={e=>setForm(f=>({...f,invoiceNo:e.target.value}))} placeholder="INV-2025-001"/></Field>
          <Field l="Client" req><select {...fi} value={form.clientId||""} onChange={e=>{const c=clients.find(c=>c.id===e.target.value);setForm(f=>({...f,clientId:e.target.value,clientName:c?.companyName||c?.contactName||""}));}}><option value="">— Select —</option>{clients.map(c=><option key={c.id} value={c.id}>{c.companyName||c.contactName}</option>)}</select></Field>
          <Field l="Invoice Date"><input {...fi} type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></Field>
          <Field l="Due Date"><input {...fi} type="date" value={form.dueDate||""} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))}/></Field>
          <Field l="Status"><select {...fi} value={form.status||"Pending"} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>{PAYMENT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field l="Ticket Ref"><input {...fi} value={form.ticketRef||""} onChange={e=>setForm(f=>({...f,ticketRef:e.target.value}))} placeholder="CIM-1001"/></Field>
          <Field l="Notes" span><textarea {...fi} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Payment instructions, terms…" style={{minHeight:60}}/></Field>
        </div>
        <div style={{marginBottom:12}}>
          <SecLabel c="Line Items"/>

            <tbody>
              {(form.items||[]).map((it,idx)=>(
                <tr key={idx}>
                  <td><input className="field-input" style={{padding:"6px 8px",fontSize:12}} value={it.description} onChange={e=>updateItem(idx,"description",e.target.value)} placeholder="Service description"/></td>

                  <td><input className="field-input" style={{padding:"6px 8px",fontSize:12,width:90}} type="number" value={it.rate} onChange={e=>updateItem(idx,"rate",e.target.value)}/></td>
                  <td><span className="mono">{fmtMoney(it.qty*it.rate)}</span></td>
                  <td><button className="btn btn-ghost btn-sm" onClick={()=>removeItem(idx)} style={{color:"#F87171"}}>✕</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <button className="btn btn-secondary btn-sm" onClick={addItem}>+ Add Line</button>
        </div>
        <div style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:8,padding:"12px 16px",maxWidth:280,marginLeft:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:13}}><span style={{color:"var(--text3)"}}>Subtotal</span><span className="mono">{fmtMoney(sub)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13,alignItems:"center"}}>
            <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",color:"var(--text3)"}}>
              <input type="checkbox" checked={form.includeVAT||false} onChange={e=>setForm(f=>({...f,includeVAT:e.target.checked}))} style={{display:"block"}}/>
              VAT (15%)
            </label>
            <span className="mono">{fmtMoney(vat)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:15,borderTop:"1px solid var(--border)",paddingTop:8}}><span style={{color:"var(--text)"}}>Total</span><span className="mono" style={{color:AC}}>{fmtMoney(total)}</span></div>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancel</button>
        <button className="btn btn-primary" onClick={saveInv} disabled={saving}>{saving?"Saving…":"Save Invoice"}</button>
      </div>
    </div></div>;
  };

  return(
    <div style={{display:"flex",flex:1,minHeight:0,overflow:"hidden"}}>
      {confirm&&<ConfirmModal msg={`Delete invoice "${confirm.invoiceNo}"?`} onConfirm={()=>deleteInv(confirm)} onCancel={()=>setConfirm(null)}/>}
      {(modal==="add"||modal==="edit")&&<InvForm/>}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"16px 20px 0"}}>
          <div className="stats-grid">
            <div className="stat-card"><div className="stat-icon">💵</div><div className="stat-val" style={{color:"#10B981",fontSize:16}}>{fmtMoney(totalRevenue)}</div><div className="stat-lbl">Revenue Collected</div></div>
            <div className="stat-card"><div className="stat-icon">⏳</div><div className="stat-val" style={{color:"#F59E0B",fontSize:16}}>{fmtMoney(totalPending)}</div><div className="stat-lbl">Pending</div></div>
            <div className="stat-card"><div className="stat-icon">🔴</div><div className="stat-val" style={{color:"#EF4444",fontSize:16}}>{fmtMoney(totalOverdue)}</div><div className="stat-lbl">Overdue</div></div>
            <div className="stat-card"><div className="stat-icon">🧾</div><div className="stat-val">{invoices.length}</div><div className="stat-lbl">Total Invoices</div></div>
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div className="searchbar" style={{flex:1,minWidth:180}}><input className="field-input" placeholder="Search invoice no, client…" value={srch} onChange={e=>setSrch(e.target.value)}/></div>
            <select className="field-input" style={{width:"auto"}} value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="all">All Status</option>{PAYMENT_STATUS.map(s=><option key={s}>{s}</option>)}</select>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>+ New Invoice</button>
          </div>
        </div>
        <div style={{flex:1,overflow:"auto",padding:"0 20px 20px"}}>
          <div className="card" style={{overflow:"hidden"}}>
            {filtered.length===0?<div style={{padding:32,textAlign:"center",color:"var(--text4)",fontSize:13}}>No invoices found.</div>:(
              <table className="tbl"><thead><tr>
                <th>Invoice No.</th><th>Client</th><th>Date</th><th>Due</th><th>Subtotal</th><th>VAT</th><th>Total</th><th>Status</th><th>Actions</th>
              </tr></thead><tbody>
                {filtered.map(i=>(
                  <tr key={i.id} className={sel===i.id?"sel":""} onClick={()=>setSel(i.id)}>
                    <td><span className="mono" style={{color:AC}}>{i.invoiceNo}</span></td>
                    <td style={{fontSize:11,fontWeight:600,color:"var(--text)"}}>{i.clientName||"—"}</td>

                      <button className="btn btn-ghost btn-sm" onClick={()=>setConfirm(i)}>🗑</button>
                    </td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>
      {selInv&&(
        <div className="detail-panel">
          <div className="detail-header">
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{fontSize:24}}>🧾</div>
              <div><div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{selInv.invoiceNo}</div><div style={{fontSize:11,color:"var(--text3)"}}>{selInv.clientName}</div></div>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setSel(null)}>✕</button>
            </div>
            <div style={{display:"flex",gap:5}}>

            </div>
          </div>
          <div className="detail-body">
            <SecLabel c="Invoice Details"/>
            {[["Client",selInv.clientName],["Date",fmtDate(selInv.date)],["Due Date",fmtDate(selInv.dueDate)],["Status",selInv.status],["Ticket Ref",selInv.ticketRef],["Paid At",selInv.paidAt?fmtDateTime(selInv.paidAt):"—"]].filter(([,v])=>v&&v!=="—").map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
            <Divider/>
            <SecLabel c="Line Items"/>
            {(selInv.items||[]).map((it,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid var(--border)",fontSize:12}}>

            <div style={{marginTop:8}}>
              {[["Subtotal",fmtMoney(selInv.subtotal)],["VAT (15%)",fmtMoney(selInv.vatAmount)],["TOTAL",fmtMoney(selInv.total)]].map(([k,v],i)=>(

          </div>

function StaffModule({showToast}){
