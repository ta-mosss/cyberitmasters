          <Field l="Job Role"><select {...fi} value={form.role||"Engineer"} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>{EMP_ROLES.map(r=><option key={r}>{r}</option>)}</select></Field>
          <Field l="Department"><select {...fi} value={form.department||"Technical"} onChange={e=>setForm(f=>({...f,department:e.target.value}))}>{DEPT.map(d=><option key={d}>{d}</option>)}</select></Field>
          <Field l="Status"><select {...fi} value={form.empStatus||"Active"} onChange={e=>setForm(f=>({...f,empStatus:e.target.value}))}>{EMP_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
          <Field l="Contract Type"><select {...fi} value={form.contractType||"Permanent"} onChange={e=>setForm(f=>({...f,contractType:e.target.value}))}>{CONTRACT_TYPES.map(c=><option key={c}>{c}</option>)}</select></Field>
          <Field l="Start Date"><input {...fi} type="date" value={form.startDate||""} onChange={e=>setForm(f=>({...f,startDate:e.target.value}))}/></Field>
          <Field l="End Date (if fixed)"><input {...fi} type="date" value={form.endDate||""} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))}/></Field>
          <Field l="Gross Salary (R)"><input {...fi} type="number" value={form.salary||""} onChange={e=>setForm(f=>({...f,salary:parseFloat(e.target.value)||0}))} placeholder="0.00"/></Field>
          <Field l="Pay Frequency"><select {...fi} value={form.payFreq||"Monthly"} onChange={e=>setForm(f=>({...f,payFreq:e.target.value}))}><option>Monthly</option><option>Bi-weekly</option><option>Weekly</option></select></Field>
          <Field l="Banking — Bank"><input {...fi} value={form.bank||""} onChange={e=>setForm(f=>({...f,bank:e.target.value}))} placeholder="e.g. FNB, ABSA, Nedbank"/></Field>
          <Field l="Account Number"><input {...fi} value={form.bankAccount||""} onChange={e=>setForm(f=>({...f,bankAccount:e.target.value}))} placeholder="Account number"/></Field>
          <Field l="Branch Code"><input {...fi} value={form.branchCode||""} onChange={e=>setForm(f=>({...f,branchCode:e.target.value}))} placeholder="e.g. 250655"/></Field>
          <Field l="Account Type"><select {...fi} value={form.bankAccountType||"Current"} onChange={e=>setForm(f=>({...f,bankAccountType:e.target.value}))}><option>Current</option><option>Savings</option><option>Cheque</option></select></Field>
          <Field l="Tax / PAYE Number"><input {...fi} value={form.taxNumber||""} onChange={e=>setForm(f=>({...f,taxNumber:e.target.value}))} placeholder="SARS tax number"/></Field>
          <Field l="UIF Number"><input {...fi} value={form.uifNumber||""} onChange={e=>setForm(f=>({...f,uifNumber:e.target.value}))} placeholder="UIF reference"/></Field>
          <Field l="Annual Leave Balance"><input {...fi} type="number" value={form.annualLeave||15} onChange={e=>setForm(f=>({...f,annualLeave:parseInt(e.target.value)||0}))} placeholder="15"/></Field>
          <Field l="Sick Leave Balance"><input {...fi} type="number" value={form.sickLeave||10} onChange={e=>setForm(f=>({...f,sickLeave:parseInt(e.target.value)||0}))} placeholder="10"/></Field>
          <Field l="Notes" span><textarea {...fi} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Performance notes, certifications, skills…"/></Field>
        </div>
      </div>
      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancel</button>
        <button className="btn btn-primary" onClick={saveEmp} disabled={saving}>{saving?"Saving…":"Save Staff Member"}</button>
      </div>
    </div></div>
  );

  return(
    <div style={{display:"flex",flex:1,minHeight:0,overflow:"hidden"}}>
      {confirm&&<ConfirmModal msg={`Delete staff member "${confirm.fullName}"? This cannot be undone.`} onConfirm={()=>deleteEmp(confirm)} onCancel={()=>setConfirm(null)}/>}
      {(modal==="add"||modal==="edit")&&<EmpForm/>}
      {modal==="addDoc"&&<DocUploadModal onSave={addDoc} onClose={()=>setModal(null)}/>}
      {leaveModal&&(
        <div className="modal-overlay"><div className="modal-box sm fu">
          <div className="modal-header"><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>🏖️ Leave Application — {selEmp?.fullName}</div><button className="btn btn-ghost btn-sm" onClick={()=>setLeaveModal(false)}>✕</button></div>
          <div className="modal-body">
            <div className="form-grid" style={{marginBottom:12}}>
              <Field l="Leave Type"><select {...fi} value={leaveForm.type} onChange={e=>setLeaveForm(f=>({...f,type:e.target.value}))}>{LEAVE_TYPES.map(t=><option key={t}>{t}</option>)}</select></Field>
              <Field l="No. of Days"><input {...fi} type="number" value={leaveForm.days} onChange={e=>setLeaveForm(f=>({...f,days:parseInt(e.target.value)||1}))} min="1"/></Field>
              <Field l="From Date"><input {...fi} type="date" value={leaveForm.from||""} onChange={e=>setLeaveForm(f=>({...f,from:e.target.value}))}/></Field>
              <Field l="To Date"><input {...fi} type="date" value={leaveForm.to||""} onChange={e=>setLeaveForm(f=>({...f,to:e.target.value}))}/></Field>
              <Field l="Status"><select {...fi} value={leaveForm.status} onChange={e=>setLeaveForm(f=>({...f,status:e.target.value}))}>{LEAVE_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
              <Field l="Reason" span><textarea {...fi} value={leaveForm.reason||""} onChange={e=>setLeaveForm(f=>({...f,reason:e.target.value}))} placeholder="Reason for leave…" style={{minHeight:60}}/></Field>
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn btn-secondary" onClick={()=>setLeaveModal(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={submitLeave}>Submit Application</button>
          </div>
        </div></div>
      )}

      {/* LEFT PANE */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"16px 20px 0"}}>
          <div className="stats-grid">
            <div className="stat-card"><div className="stat-icon">👥</div><div className="stat-val">{staff.length}</div><div className="stat-lbl">Total Staff</div></div>
            <div className="stat-card"><div className="stat-icon">✅</div><div className="stat-val" style={{color:AC}}>{activeCount}</div><div className="stat-lbl">Active</div></div>
            <div className="stat-card"><div className="stat-icon">🏖️</div><div className="stat-val" style={{color:"#F59E0B"}}>{onLeaveCount}</div><div className="stat-lbl">On Leave</div></div>
            <div className="stat-card"><div className="stat-icon">📋</div><div className="stat-val" style={{color:pendingLeave>0?"#F97316":"#10B981"}}>{pendingLeave}</div><div className="stat-lbl">Pending Leave</div></div>
          </div>
          <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
            <div className="searchbar" style={{flex:1,minWidth:180}}><input className="field-input" placeholder="Search name, ID, email, role…" value={srch} onChange={e=>setSrch(e.target.value)}/></div>
            <select className="field-input" style={{width:"auto"}} value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="all">All Status</option>{EMP_STATUS.map(s=><option key={s}>{s}</option>)}</select>
            <select className="field-input" style={{width:"auto"}} value={fDept} onChange={e=>setFDept(e.target.value)}><option value="all">All Depts</option>{DEPT.map(d=><option key={d}>{d}</option>)}</select>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>+ Add Staff</button>
          </div>
        </div>
        <div style={{flex:1,overflow:"auto",padding:"0 20px 20px"}}>
          <div className="card" style={{overflow:"hidden"}}>
            {filtered.length===0?<div style={{padding:32,textAlign:"center",color:"var(--text4)",fontSize:13}}>No staff found.</div>:(
              <table className="tbl"><thead><tr>
                <th>ID</th><th>Name</th><th>Role</th><th>Department</th><th>Contract</th><th>Start Date</th><th>Status</th><th>Actions</th>
              </tr></thead><tbody>
                {filtered.map(e=>(
                  <tr key={e.id} className={sel===e.id?"sel":""} onClick={()=>{setSel(e.id);setDetailTab("profile");}}>
                    <td><span className="mono" style={{color:AC}}>{e.empId}</span></td>
                    <td><div style={{display:"flex",alignItems:"center",gap:8}}><AvatarCircle name={e.fullName} size={28}/><div><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{e.fullName}</div><div style={{fontSize:10,color:"var(--text4)"}}>{e.email||e.phone}</div></div></div></td>
                    <td style={{fontSize:11}}>{e.role||"—"}</td>
                    <td><span className="tag" style={{background:"rgba(139,92,246,0.1)",color:"#8B5CF6"}}>{e.department||"—"}</span></td>
                    <td style={{fontSize:11}}>{e.contractType||"—"}</td>
                    <td style={{fontSize:11}}>{fmtDate(e.startDate)}</td>
                    <td><StatusBadge s={e.empStatus||"Active"} map={{"Active":{c:"#10B981"},"On Leave":{c:"#F59E0B"},"Probation":{c:"#F97316"},"Suspended":{c:"#EF4444"},"Resigned":{c:"#6B7280"},"Terminated":{c:"#EF4444"}}}/></td>
                    <td onClick={ev=>ev.stopPropagation()}><button className="btn btn-ghost btn-sm" onClick={()=>openEdit(e)}>✏️</button><button className="btn btn-ghost btn-sm" onClick={()=>setConfirm(e)}>🗑</button></td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      {/* DETAIL PANEL */}
      {selEmp&&(
        <div className="detail-panel">
          <div className="detail-header">
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <AvatarCircle name={selEmp.fullName} size={40}/>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>{selEmp.fullName}</div>
                <div style={{fontSize:11,color:"var(--text3)"}}>{selEmp.empId} · {selEmp.role}</div>
              </div>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}} onClick={()=>setSel(null)}>✕</button>
            </div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              <button className="btn btn-primary btn-sm" onClick={()=>openEdit(selEmp)}>✏️ Edit</button>
              <button className="btn btn-warn btn-sm" onClick={()=>{setLeaveForm({type:"Annual",status:"Pending",days:1});setLeaveModal(true);}}>🏖️ Leave</button>
              <button className="btn btn-secondary btn-sm" onClick={()=>setModal("addDoc")}>📎 Doc</button>
              {selEmp.phone&&<a href={`https://wa.me/${(selEmp.phone||"").replace(/[^0-9]/g,"").replace(/^0/,"27")}`} target="_blank" rel="noreferrer" className="btn btn-wa btn-sm">💬</a>}
            </div>
          </div>
          <div className="detail-tabs">
            {["profile","employment","docs","leave","notes"].map(t=>(
              <button key={t} className={`dtab${detailTab===t?" active":""}`} onClick={()=>setDetailTab(t)}>
                {t==="profile"?"👤":t==="employment"?"💼":t==="docs"?"📁":t==="leave"?"🏖️":"📝"}
              </button>
            ))}
          </div>
          <div className="detail-body">
            {detailTab==="profile"&&<>
              <SecLabel c="Personal"/>
              {[["ID Number",selEmp.idNumber],["DOB",fmtDate(selEmp.dob)],["Gender",selEmp.gender],["Phone",selEmp.phone],["Personal Email",selEmp.personalEmail],["Work Email",selEmp.email],["Address",selEmp.address],["Emergency",selEmp.emergencyContact],["Emerg. Phone",selEmp.emergencyPhone]].filter(([,v])=>v).map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
            </>}
            {detailTab==="employment"&&<>
              <SecLabel c="Employment"/>
              {[["Employee ID",selEmp.empId],["Role",selEmp.role],["Department",selEmp.department],["Status",selEmp.empStatus],["Contract",selEmp.contractType],["Start Date",fmtDate(selEmp.startDate)],["End Date",selEmp.endDate?fmtDate(selEmp.endDate):"—"],["Salary",fmtMoney(selEmp.salary)],["Pay Freq",selEmp.payFreq],["Tax No.",selEmp.taxNumber],["UIF No.",selEmp.uifNumber]].filter(([,v])=>v&&v!=="—").map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
              <Divider/>
              <SecLabel c="Banking"/>
              {[["Bank",selEmp.bank],["Account No.",selEmp.bankAccount?`•••• ${selEmp.bankAccount.slice(-4)}`:"—"],["Branch",selEmp.branchCode],["Account Type",selEmp.bankAccountType]].filter(([,v])=>v&&v!=="—").map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
              <Divider/>
              <SecLabel c="Leave Balances"/>
              {[["Annual Leave",`${selEmp.annualLeave||15} days`],["Sick Leave",`${selEmp.sickLeave||10} days`]].map(([k,v],i)=><div key={i} className="drow"><div className="dkey">{k}</div><div className="dval">{v}</div></div>)}
              {selEmp.notes&&<><Divider/><SecLabel c="Notes"/><div style={{fontSize:12,color:"var(--text2)",background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",lineHeight:1.6}}>{selEmp.notes}</div></>}
            </>}
            {detailTab==="docs"&&<>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <SecLabel c={`Documents (${(selEmp.docs||[]).length})`}/>
                <button className="btn btn-primary btn-sm" onClick={()=>setModal("addDoc")}>+ Add</button>
              </div>
              {(selEmp.docs||[]).length===0&&<div style={{fontSize:12,color:"var(--text4)",textAlign:"center",padding:20}}>No documents.</div>}
              {(selEmp.docs||[]).map(d=>(
                <div key={d.id} className="doc-chip">
                  <div className="doc-chip-icon"><DocIcon type={d.type}/></div>
                  <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div><div style={{fontSize:10,color:"var(--text4)"}}>{d.type} · {fmtDate(d.date)}</div></div>
                  <div style={{display:"flex",gap:4}}>
                    {d.url&&<a href={d.url} target="_blank" rel="noreferrer" className="btn btn-ghost btn-sm">↗</a>}
                    <button className="btn btn-ghost btn-sm" style={{color:"#F87171"}} onClick={()=>removeDoc(d.id)}>🗑</button>
                  </div>
                </div>
              ))}
            </>}
            {detailTab==="leave"&&<>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <SecLabel c="Leave History"/>
                <button className="btn btn-warn btn-sm" onClick={()=>{setLeaveForm({type:"Annual",status:"Pending",days:1});setLeaveModal(true);}}>+ Apply</button>
              </div>
              {(selEmp.leaveHistory||[]).length===0&&<div style={{fontSize:12,color:"var(--text4)",textAlign:"center",padding:20}}>No leave records.</div>}
              {[...(selEmp.leaveHistory||[])].reverse().map(l=>(
                <div key={l.id} style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{l.type} — {l.days} day{l.days>1?"s":""}</span>
                    <StatusBadge s={l.status} map={{Pending:{c:"#F59E0B"},Approved:{c:"#10B981"},Declined:{c:"#EF4444"},Cancelled:{c:"#6B7280"}}}/>
                  </div>
                  <div style={{fontSize:11,color:"var(--text3)",marginBottom:6}}>{l.from&&l.to?`${fmtDate(l.from)} → ${fmtDate(l.to)}`:"Dates not set"}</div>
                  {l.reason&&<div style={{fontSize:11,color:"var(--text4)",marginBottom:6}}>{l.reason}</div>}
                  {l.status==="Pending"&&<div style={{display:"flex",gap:5}}>
                    <button className="btn btn-success btn-sm" onClick={()=>updateLeaveStatus(l.id,"Approved")}>✓ Approve</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>updateLeaveStatus(l.id,"Declined")}>✕ Decline</button>
                  </div>}
                </div>
              ))}
            </>}
            {detailTab==="notes"&&<>
              <SecLabel c="Activity Notes"/>
              <textarea {...fi} value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="Add note about this staff member…" style={{minHeight:70,fontSize:12,marginBottom:6}}/>
              <button className="btn btn-primary btn-sm" onClick={addNote} style={{width:"100%",marginBottom:14}}>+ Add Note</button>
              {[...(selEmp.notes||[])].reverse().map(n=><div key={n.id} className="note-item"><div className="note-text">{n.txt}</div><div className="note-meta">{n.author||"Admin"} · {fmtDateTime(n.at)}</div></div>)}
            </>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   ■ SHARED MODALS
══════════════════════════════════════════════ */
function DocUploadModal({onSave,onClose}){
  const [form,setForm]=useState({type:"Contract",date:new Date().toISOString().slice(0,10)});
  const save=()=>{if(!form.name?.trim()){alert("Document name required");return;}onSave(form);};
  return<div className="modal-overlay"><div className="modal-box sm fu">
    <div className="modal-header"><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>📎 Add Document</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
    <div className="modal-body">
      <div className="form-grid g1">
        <Field l="Document Name" req><input {...fi} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Employment Contract 2025"/></Field>
        <Field l="Document Type"><select {...fi} value={form.type||"Contract"} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>{[...DOC_TYPES,"Employment Contract","Payslip","Performance Review","Warning Letter","ID Copy","Qualification"].map(t=><option key={t}>{t}</option>)}</select></Field>
        <Field l="Date"><input {...fi} type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></Field>
        <Field l="Reference No."><input {...fi} value={form.refNo||""} onChange={e=>setForm(f=>({...f,refNo:e.target.value}))} placeholder="Optional ref number"/></Field>
        <Field l="File URL / Google Drive Link"><input {...fi} value={form.url||""} onChange={e=>setForm(f=>({...f,url:e.target.value}))} placeholder="https://drive.google.com/…"/></Field>
        <Field l="Notes"><textarea {...fi} value={form.notes||""} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Optional notes about this document…" style={{minHeight:60}}/></Field>
      </div>
    </div>
    <div className="modal-footer">
      <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" onClick={save}>Save Document</button>
    </div>
  </div></div>;
}

function NoteModal({onSave,onClose}){
  const [txt,setTxt]=useState("");
  return<div className="modal-overlay"><div className="modal-box sm fu">
    <div className="modal-header"><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>📝 Add Note</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
    <div className="modal-body">
      <textarea {...fi} value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Write your note…" style={{minHeight:100,marginBottom:6}} autoFocus/>
    </div>
    <div className="modal-footer">
      <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
      <button className="btn btn-primary" onClick={()=>txt.trim()&&onSave(txt)}>Save Note</button>
    </div>
  </div></div>;
}

/* ══════════════════════════════════════════════
   ■ DASHBOARD / OVERVIEW
══════════════════════════════════════════════ */
function Dashboard({tickets,clients,staff,assets,invoices}){
  const totalRevenue=invoices.filter(i=>i.status==="Paid").reduce((a,i)=>a+(i.total||0),0);
  const outstanding=invoices.filter(i=>i.status==="Pending"||i.status==="Overdue").reduce((a,i)=>a+(i.total||0),0);
  const expWarranty=assets.filter(a=>{const wi=warrantyInfo(a.warrantyExpiry);return wi.daysLeft!==null&&wi.daysLeft>=0&&wi.daysLeft<=60;});
  const overdueBilling=invoices.filter(i=>i.status==="Overdue");
  const pendingLeave=staff.reduce((a,e)=>[...a,...(e.leaveHistory||[]).filter(l=>l.status==="Pending").map(l=>({...l,empName:e.fullName}))],[]);

  return<div className="page-content">
    <div style={{marginBottom:24}}>
      <div style={{fontSize:20,fontWeight:800,color:"var(--text)",marginBottom:4}}>Good day 👋</div>
      <div style={{fontSize:13,color:"var(--text3)"}}>{CFG.bizName} — Management Overview</div>
    </div>
    {/* KPI ROW */}
    <div className="stats-grid" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
      {[["👥","Clients",clients.length,AC],["👷","Staff",staff.filter(e=>e.empStatus==="Active").length,"#8B5CF6"],["🖥️","Assets",assets.length,"#0EA5E9"],["💵","Revenue",fmtMoney(totalRevenue),"#10B981"],["⏳","Outstanding",fmtMoney(outstanding),outstanding>0?"#EF4444":"#10B981"]].map(([icon,lbl,val,cl])=>(
        <div key={lbl} className="stat-card">
          <div style={{fontSize:20,marginBottom:6}}>{icon}</div>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:typeof val==="string"?15:24,fontWeight:700,color:cl,marginBottom:2}}>{val}</div>
          <div style={{fontSize:11,color:"var(--text3)"}}>{lbl}</div>
        </div>
      ))}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16}}>
      {/* WARRANTY EXPIRING */}
      <div className="card">
        <div className="card-header"><div className="card-title">⚠️ Warranty Expiring Soon</div></div>
        <div className="card-body">
          {expWarranty.length===0?<div style={{fontSize:12,color:"var(--text4)",textAlign:"center",padding:12}}>All warranties are healthy ✓</div>
          :expWarranty.slice(0,6).map(a=>{const wi=warrantyInfo(a.warrantyExpiry);return(
            <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid var(--border)"}}>
              <div><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{a.name}</div><div style={{fontSize:10,color:"var(--text4)"}}>{a.assetId}</div></div>
              <span className={wi.cls}>{wi.status}</span>
            </div>
          );})}
        </div>
      </div>
      {/* OVERDUE INVOICES */}
      <div className="card">
        <div className="card-header"><div className="card-title">🔴 Overdue Invoices</div></div>
        <div className="card-body">
          {overdueBilling.length===0?<div style={{fontSize:12,color:"var(--text4)",textAlign:"center",padding:12}}>No overdue invoices ✓</div>
          :overdueBilling.slice(0,6).map(i=>(
            <div key={i.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid var(--border)"}}>
              <div><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{i.invoiceNo}</div><div style={{fontSize:10,color:"var(--text4)"}}>{i.clientName}</div></div>
              <span className="mono" style={{color:"#EF4444",fontSize:12}}>{fmtMoney(i.total)}</span>
            </div>
          ))}
        </div>
      </div>
      {/* PENDING LEAVE */}
      <div className="card">
        <div className="card-header"><div className="card-title">🏖️ Pending Leave Requests</div></div>
        <div className="card-body">
          {pendingLeave.length===0?<div style={{fontSize:12,color:"var(--text4)",textAlign:"center",padding:12}}>No pending requests ✓</div>
          :pendingLeave.slice(0,6).map(l=>(
            <div key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid var(--border)"}}>
              <div><div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{l.empName}</div><div style={{fontSize:10,color:"var(--text4)"}}>{l.type} · {l.days} day{l.days>1?"s":""}</div></div>
              <span className="badge" style={{background:"rgba(245,158,11,0.15)",color:"#F59E0B",border:"1px solid rgba(245,158,11,0.3)"}}>Pending</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════════════════
   ROOT
══════════════════════════════════════════════ */
function Root(){
  const [authed,setAuthed]=useState(false);
  const [theme,setTheme]=useState("dark");
  const [activeModule,setActiveModule]=useState("dashboard");
  const [toast,setToast]=useState({msg:"",type:"ok"});
  const [allData,setAllData]=useState({clients:[],staff:[],assets:[],invoices:[]});

  useEffect(()=>{
    if(!authed)return;
    const subs=[];
    subs.push(db.collection("mgmt_clients").onSnapshot(s=>setAllData(d=>({...d,clients:s.docs.map(x=>({id:x.id,...x.data()}))}))));
    subs.push(db.collection("mgmt_staff").onSnapshot(s=>setAllData(d=>({...d,staff:s.docs.map(x=>({id:x.id,...x.data()}))}))));
    subs.push(db.collection("mgmt_assets").onSnapshot(s=>setAllData(d=>({...d,assets:s.docs.map(x=>({id:x.id,...x.data()}))}))));
    subs.push(db.collection("mgmt_billing").onSnapshot(s=>setAllData(d=>({...d,invoices:s.docs.map(x=>({id:x.id,...x.data()}))}))));
    return()=>subs.forEach(u=>u());
  },[authed]);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3200);};
  const toggleTheme=()=>{const n=theme==="dark"?"light":"dark";document.body.className=n;setTheme(n);};

  if(!authed)return<LoginScreen onAuth={()=>setAuthed(true)}/>;

  const NAV=[
    {group:"Overview",items:[{id:"dashboard",icon:"🏠",label:"Dashboard"}]},
    {group:"Client Relations",items:[{id:"clients",icon:"👥",label:"Clients",count:allData.clients.length},{id:"documents",icon:"📁",label:"Documents"},{id:"billing",icon:"💰",label:"Billing & Invoices"}]},
    {group:"Operations",items:[{id:"assets",icon:"🖥️",label:"Assets & Warranty"},{id:"staff",icon:"👷",label:"Staff Management"}]},
  ];

  const TITLES={dashboard:"🏠 Dashboard",clients:"👥 Client Management",documents:"📁 Documents",billing:"💰 Billing & Invoices",assets:"🖥️ Assets & Warranty",staff:"👷 Staff Management"};
  const SUBS={dashboard:"Business overview & alerts",clients:"Client records, contacts & documents",documents:"Quotes, invoices, contracts & files",billing:"Invoices, payments & revenue tracking",assets:"Device registry, repairs & warranty",staff:"HR, contracts, payroll & leave"};

  return(
    <div className="main-layout">
      {/* SIDEBAR */}
      <div className="sidebar">
        <div className="sidebar-logo">
          <div className="brand">
            <div className="brand-icon">⚡</div>
            <div><div className="brand-name">{CFG.bizName}</div><div className="brand-sub">Management Portal</div></div>
          </div>
        </div>
        <div className="sidebar-nav">
          {NAV.map(g=>(
            <div key={g.group} className="nav-group">
              <div className="nav-group-label">{g.group}</div>
              {g.items.map(item=>(
                <button key={item.id} className={`nav-item${activeModule===item.id?" active":""}`} onClick={()=>setActiveModule(item.id)}>
                  <span className="ni">{item.icon}</span>
                  {item.label}
                  {item.count!=null&&<span className="nav-count">{item.count}</span>}
                </button>
              ))}
            </div>
          ))}
          <div className="nav-group">
            <div className="nav-group-label">Links</div>
            <a href="admin__1_.html" className="nav-item"><span className="ni">🎫</span>Ticket Portal ↗</a>
            <a href="https://books.zohosecure.com/portal/mbulahenigroup/signin" target="_blank" rel="noreferrer" className="nav-item"><span className="ni">📊</span>Zoho Books ↗</a>
          </div>
        </div>
        <div className="sidebar-footer">
          <div className="status-pill">
            <div className="status-dot"/>
            <span style={{fontSize:10,color:"var(--text3)",fontWeight:500}}>Firebase Live</span>
            <button className="theme-toggle" onClick={toggleTheme} style={{marginLeft:"auto"}} title="Toggle theme"/>
          </div>
        </div>
      </div>

      {/* CONTENT */}
      <div className="content-area">
        <div className="topbar">
          <div className="topbar-left">
            <div className="topbar-title">{TITLES[activeModule]}</div>
            <div className="topbar-sub">{SUBS[activeModule]}</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:5,background:"rgba(0,200,150,0.08)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:20,padding:"4px 10px"}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:AC,boxShadow:`0 0 6px ${AC}`}}/>
              <span style={{fontSize:11,fontWeight:600,color:AC}}>Live</span>
            </div>
          </div>
        </div>

        {activeModule==="dashboard"&&<Dashboard {...allData} tickets={[]}/>}
        {activeModule==="clients"&&<ClientsModule showToast={showToast}/>}
        {activeModule==="documents"&&<DocumentsModule showToast={showToast}/>}
        {activeModule==="billing"&&<BillingModule showToast={showToast}/>}
        {activeModule==="assets"&&<AssetsModule showToast={showToast}/>}
        {activeModule==="staff"&&<StaffModule showToast={showToast}/>}
      </div>

      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
</body>
</html>
