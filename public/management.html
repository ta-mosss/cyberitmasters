<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#06101c;color:#eaf3ff}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#081522;border-right:1px solid #1b344d;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:17px;margin:4px 0 25px}.brand span{color:#55adff}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9eb2c7;text-align:left;padding:11px 13px;border-radius:10px}.nav button.active,.nav button:hover{background:#102c47;color:#fff}.main{padding:22px;max-width:1700px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:26px}.muted{color:#8fa5ba}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#0a1929;border:1px solid #1a344d;border-radius:15px;padding:17px}.metric{font-size:30px;font-weight:900;margin-top:6px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:13px}.btn{border:1px solid #294863;background:#10263c;color:#fff;padding:9px 13px;border-radius:9px}.primary{background:#1479d1;border-color:#238ce8}.danger{background:#5c202c;border-color:#8d3041}.success{background:#10402f;border-color:#1e7353}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#061421;border:1px solid #294660;color:#fff;border-radius:9px;padding:10px;width:100%}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #19324a}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#17314a;color:#cce8ff;font-size:12px}.green{background:#123c2b;color:#91efbd}.orange{background:#493517;color:#ffd78e}.red{background:#4b1f2a;color:#ffabb9}.split{display:grid;grid-template-columns:1.45fr .85fr;gap:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.detail h3{margin-top:0}.empty{padding:35px;text-align:center;color:#8ea2b7}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(900px,96vw);max-height:92vh;overflow:auto;background:#0a1929;border:1px solid #294a67;border-radius:17px;padding:20px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#123d64,#06101c 58%)}.loginbox{width:min(430px,92vw);padding:28px;background:#0a1929;border:1px solid #294963;border-radius:20px}.toast{position:fixed;right:18px;bottom:18px;background:#102a42;border:1px solid #3a668a;padding:12px 15px;border-radius:10px;z-index:30}.kpi{display:flex;justify-content:space-between;gap:10px}.progress{height:7px;background:#10263a;border-radius:20px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#2494e8}.timeline{border-left:2px solid #23435d;padding-left:14px}.timeline div{margin-bottom:12px}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid #1b344d}.nav{grid-template-columns:repeat(3,1fr)}.grid,.grid3{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:600px){.main{padding:13px}.grid,.grid3,.formgrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}

</script><script>/* Preserve the project's exact Firebase configuration. */
const firebaseConfigExact={apiKey:"AIzaSyBpoDnbWKvWQdvcZnhUZwFr24iox2fWJto",authDomain:"test-bot-49f99.firebaseapp.com",projectId:"test-bot-49f99",storageBucket:"test-bot-49f99.firebasestorage.app",messagingSenderId:"522231357803",appId:"1:522231357803:web:bf65a73d1df7269615ac2e",databaseURL:"https://test-bot-49f99-default-rtdb.firebaseio.com"};firebase.initializeApp(firebaseConfigExact);const db=firebase.firestore(),auth=firebase.auth(),storage=firebase.storage();

<script type="text/babel">const {useState,useEffect}=React;
const NAV=[['dashboard','Operations'],['tickets','Service Desk'],['jobs','Job Cards'],['dispatch','Dispatch'],['engineers','Engineers'],['customers','Customers'],['assets','Assets'],['quotes','Quotes & Invoices'],['sla','SLA & Escalations'],['reports','Reports'],['audit','Audit Log'],['settings','Settings']];
const STAT=['open','assigned','in-progress','on-hold','awaiting-customer','resolved','closed'];const ROLE_LABELS={super_admin:'Super Admin',operations_manager:'Operations Manager',engineer:'Engineer',support_agent:'Support Agent',finance:'Finance'};const roleLabel=r=>ROLE_LABELS[r]||r||'Staff';const ts=x=>x?.toDate?x.toDate():x?new Date(x):null;const fmt=x=>{let d=ts(x);return d&&!isNaN(d)?d.toLocaleString():'—'};const cls=x=>/resolved|closed|complete|paid/i.test(String(x))?'green':/urgent|overdue|failed|cancel/i.test(String(x))?'red':'orange';const stamp=()=>firebase.firestore.FieldValue.serverTimestamp();
function Login(){let[e,setE]=useState(''),[p,setP]=useState(''),[err,setErr]=useState('');let go=async x=>{x.preventDefault();try{await auth.signInWithEmailAndPassword(e,p)}catch(a){setErr(a.message)}};return <div className="login"><form className="loginbox" onSubmit={go}><h1>Cyber I.T Masters</h1><p className="muted">MSP Operations Centre · Phase 4</p><div className="field"><label>Email</label><input type="email" value={e} onChange={x=>setE(x.target.value)} required/></div><br/><div className="field"><label>Password</label><input type="password" value={p} onChange={x=>setP(x.target.value)} required/></div><br/><button className="btn primary" style={{width:'100%'}}>Sign in</button>{err&&<p className="red">{err}</p>}</form></div>}
function App(){let[user,setUser]=useState(undefined),[page,setPage]=useState('dashboard'),[data,setData]=useState({tickets:[],engineers:[],customers:[],assets:[],quotes:[],jobs:[],auditLogs:[]}),[selected,setSelected]=useState(null),[toast,setToast]=useState('');useEffect(()=>auth.onAuthStateChanged(setUser),[]);useEffect(()=>{if(!user)return;let cols=Object.keys(data);let COLMAP={engineers:'users'};let un=[];cols.forEach(c=>{un.push(db.collection(COLMAP[c]||c).limit(300).onSnapshot(s=>setData(d=>({...d,[c]:s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.role!=='customer')})),err=>flash('Could not load '+c+': '+err.message)))});return()=>un.forEach(x=>x())},[user]);let flash=x=>{setToast(x);setTimeout(()=>setToast(''),2600)};if(user===undefined)return null;if(!user)return <Login/>;let p=page;let body=p==='dashboard'?<Dashboard d={data} open={x=>{setSelected(x);setPage('tickets')}}/>:p==='tickets'?<Tickets data={data.tickets} open={setSelected}/>:p==='jobs'?<Jobs data={data.jobs} tickets={data.tickets} engineers={data.engineers} flash={flash}/>:p==='dispatch'?<Dispatch jobs={data.jobs} tickets={data.tickets} engineers={data.engineers} flash={flash}/>:p==='engineers'?<Engineers data={data.engineers} flash={flash}/>:p==='customers'?<Customers data={data.customers}/>:p==='assets'?<Assets data={data.assets}/>:p==='quotes'?<Quotes data={data.quotes} flash={flash}/>:p==='sla'?<SLA tickets={data.tickets} jobs={data.jobs}/>:p==='reports'?<Reports d={data}/>:p==='audit'?<Audit data={data.auditLogs}/>:<Settings user={user}/>;return <div className="app"><aside className="side"><div className="brand">CYBER <span>I.T MASTERS</span></div><div className="nav">{NAV.map(n=><button className={p===n[0]?'active':''} onClick={()=>{setPage(n[0]);setSelected(null)}}>{n[1]}</button>)}</div><button className="btn" style={{width:'100%',marginTop:24}} onClick={()=>auth.signOut()}>Sign out</button></aside><main className="main"><div className="top"><div><h1>{NAV.find(x=>x[0]===p)?.[1]}</h1><span className="muted">Unified customer → engineer → management workflow</span></div>{selected&&<button className="btn" onClick={()=>setSelected(null)}>Close detail</button>}</div>{selected?<TicketDetail t={selected} engineers={data.engineers} flash={flash} close={()=>setSelected(null)}/>:body}</main>{toast&&<div className="toast">{toast}</div>}</div>}
function Dashboard({d,open}){let active=d.tickets.filter(x=>!['resolved','closed'].includes(String(x.status).toLowerCase())).length,over=d.tickets.filter(x=>x.slaStatus==='overdue').length,un=d.jobs.filter(x=>!x.assignedEngineer||x.assignedEngineer==='Unassigned').length;return <><div className="grid"><Metric l="Tickets" v={d.tickets.length}/><Metric l="Active Work" v={active}/><Metric l="Job Cards" v={d.jobs.length}/><Metric l="SLA Overdue" v={over}/></div><br/><div className="grid3"><div className="card"><h3>Dispatch Queue</h3><p>Unassigned jobs <b>{un}</b></p><p>Engineers <b>{d.engineers.length}</b></p><p>Open customers <b>{d.customers.length}</b></p></div><div className="card"><h3>Commercial</h3><p>Quotes <b>{d.quotes.length}</b></p><p>Awaiting approval <b>{d.quotes.filter(x=>/pending|sent|await/i.test(x.status||'')).length}</b></p><p>Invoices/paid <b>{d.quotes.filter(x=>/paid|invoice/i.test(x.status||'')).length}</b></p></div><div className="card"><h3>Operations control</h3><p>Urgent tickets <b>{d.tickets.filter(x=>String(x.priority).toLowerCase()==='urgent').length}</b></p><p>In progress <b>{d.tickets.filter(x=>x.status==='in-progress').length}</b></p><p>Awaiting customer <b>{d.tickets.filter(x=>x.status==='awaiting-customer').length}</b></p></div></div><br/><div className="card"><h3>Latest Service Requests</h3><div className="table"><table><thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>Priority</th><th>Status</th><th>Updated</th></tr></thead><tbody>{d.tickets.slice(0,10).map(t=><tr><td><button className="btn" onClick={()=>open(t)}>{t.ref||t.ticketNumber||t.id}</button></td><td>{t.company||t.clientName||t.name||'—'}</td><td>{t.serviceSubCategoryLabel||t.serviceCategoryLabel||t.serviceType||'—'}</td><td><span className={'pill '+cls(t.priority)}>{t.priority||'medium'}</span></td><td><span className={'pill '+cls(t.status)}>{t.status||'open'}</span></td><td>{fmt(t.updatedAt||t.createdAt)}</td></tr>)}</tbody></table></div></div></>}
function Metric({l,v}){return <div className="card"><span className="muted">{l}</span><div className="metric">{v}</div></div>}
function Tickets({data,open}){let[q,setQ]=useState(''),[s,setS]=useState('');let rows=data.filter(t=>JSON.stringify(t).toLowerCase().includes(q.toLowerCase())&&(!s||t.status===s));return <><div className="toolbar"><input placeholder="Search ticket, customer, service, engineer..." value={q} onChange={e=>setQ(e.target.value)}/><select value={s} onChange={e=>setS(e.target.value)}><option value="">All statuses</option>{STAT.map(x=><option>{x}</option>)}</select></div><div className="card table"><table><thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>Priority</th><th>Engineer</th><th>Status</th><th>SLA</th></tr></thead><tbody>{rows.map(t=><tr><td><button className="btn" onClick={()=>open(t)}>{t.ref||t.ticketNumber||t.id}</button></td><td>{t.company||t.clientName||t.name||'—'}</td><td>{t.serviceSubCategoryLabel||t.serviceType||'—'}</td><td>{t.priority||'medium'}</td><td>{t.assignedEngineer||'Unassigned'}</td><td><span className={'pill '+cls(t.status)}>{t.status||'open'}</span></td><td><span className={'pill '+cls(t.slaStatus)}>{t.slaStatus||'tracking'}</span></td></tr>)}</tbody></table></div></>}
function TicketDetail({t,engineers,flash,close}){let[s,setS]=useState(t.status||'open'),[e,setE]=useState(t.assignedEngineer||'Unassigned'),[n,setN]=useState('');let save=async()=>{try{let note=n?{text:n,actor:auth.currentUser.email,createdAt:new Date().toISOString()}:null;let update={status:s,assignedEngineer:e,updatedAt:stamp()};if(note)update.notes=firebase.firestore.FieldValue.arrayUnion(note);await db.collection('tickets').doc(t.id).update(update);await db.collection('auditLogs').add({action:'ticket.updated',ticketRef:t.ref||t.id,actor:auth.currentUser.email,details:{status:s,assignedEngineer:e},createdAt:stamp()});flash('Ticket updated and audit logged');close()}catch(x){flash(x.message)}};return <div className="card detail"><div className="kpi"><div><h2>{t.ref||t.ticketNumber||t.id}</h2><span className="muted">Created {fmt(t.createdAt)}</span></div><span className={'pill '+cls(s)}>{s}</span></div><hr/><div className="split"><div><h3>Customer request</h3><p><b>Customer:</b> {t.company||t.clientName||t.name||'—'}</p><p><b>Contact:</b> {t.phone||'—'} · {t.email||'—'}</p><p><b>Service:</b> {t.serviceCategoryLabel||t.serviceType||'—'} / {t.serviceSubCategoryLabel||t.serviceSubCategory||'—'}</p><p><b>Issue:</b> {t.issueTitle||'—'}</p><p>{t.problemDescription||t.issueDetail||'No description.'}</p><p><b>Channels:</b> {(t.channels||[t.contactMethod]).filter(Boolean).join(', ')||'—'}</p><p><b>Site:</b> {t.address||'—'}</p><h3>Asset</h3><p>{[t.deviceType,t.manufacturer,t.model,t.serialNumber,t.operatingSystem].filter(Boolean).join(' · ')||'No asset data'}</p></div><div><div className="field"><label>Status</label><select value={s} onChange={x=>setS(x.target.value)}>{STAT.map(x=><option>{x}</option>)}</select></div><br/><div className="field"><label>Assigned engineer</label><select value={e} onChange={x=>setE(x.target.value)}><option>Unassigned</option>{engineers.filter(x=>x.active!==false).map(x=><option>{x.displayName||x.name||x.email}</option>)}</select></div><br/><div className="field"><label>Internal note</label><textarea rows="6" value={n} onChange={x=>setN(x.target.value)} placeholder="Diagnosis, dispatch instruction, customer communication..."/></div><br/><div className="actions"><button className="btn primary" onClick={save}>Save & audit</button><button className="btn" onClick={()=>window.open('https://wa.me/'+String(t.phone||'').replace(/\D/g,''),'_blank')}>WhatsApp</button></div></div></div></div>}
function Jobs({data,tickets,engineers,flash}){let[newOpen,setNewOpen]=useState(false),[sel,setSel]=useState(null);return <><div className="toolbar"><button className="btn primary" onClick={()=>setNewOpen(true)}>+ Create Job Card</button></div><div className="card table"><table><thead><tr><th>Job</th><th>Ticket</th><th>Customer</th><th>Engineer</th><th>Type</th><th>Status</th><th>Scheduled</th></tr></thead><tbody>{data.map(j=><tr><td><button className="btn" onClick={()=>setSel(j)}>{j.jobNumber||j.id}</button></td><td>{j.ticketRef||'—'}</td><td>{j.company||j.customerName||'—'}</td><td>{j.assignedEngineer||'Unassigned'}</td><td>{j.jobType||'Service'}</td><td><span className={'pill '+cls(j.status)}>{j.status||'open'}</span></td><td>{j.scheduledDate||'—'} {j.scheduledTime||''}</td></tr>)}</tbody></table></div>{newOpen&&<JobForm tickets={tickets} engineers={engineers} close={()=>setNewOpen(false)} flash={flash}/>} {sel&&<JobDetail j={sel} engineers={engineers} close={()=>setSel(null)} flash={flash}/>}</>}
function JobForm({tickets,engineers,close,flash}){let[f,setF]=useState({ticketRef:'',customerName:'',jobType:'Onsite',assignedEngineer:'Unassigned',scheduledDate:'',scheduledTime:'',priority:'medium',scope:'',status:'scheduled'});let set=(k,v)=>setF(x=>({...x,[k]:v}));let save=async()=>{try{const token=await auth.currentUser.getIdToken();const response=await fetch(`${FUNCTIONS_BASE}/.netlify/functions/create-job`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(f)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not create job card');flash('Job card '+result.jobNumber+' created');close()}catch(e){flash(e.message)}};return <Modal title="Create Job Card" close={close}><div className="formgrid"><Field label="Ticket reference"><select value={f.ticketRef} onChange={e=>{let t=tickets.find(x=>(x.ref||x.ticketNumber||x.id)===e.target.value);set('ticketRef',e.target.value);if(t)set('customerName',t.company||t.clientName||t.name||'')}}><option value="">Select ticket</option>{tickets.map(t=><option>{t.ref||t.ticketNumber||t.id}</option>)}</select></Field><Field label="Customer"><input value={f.customerName} onChange={e=>set('customerName',e.target.value)}/></Field><Field label="Job type"><select value={f.jobType} onChange={e=>set('jobType',e.target.value)}>{['Remote','Onsite','Installation','Survey','Repair','Maintenance','Project'].map(x=><option>{x}</option>)}</select></Field><Field label="Engineer"><select value={f.assignedEngineer} onChange={e=>set('assignedEngineer',e.target.value)}><option>Unassigned</option>{engineers.filter(x=>x.active!==false).map(x=><option>{x.displayName||x.name||x.email}</option>)}</select></Field><Field label="Date"><input type="date" value={f.scheduledDate} onChange={e=>set('scheduledDate',e.target.value)}/></Field><Field label="Time"><input type="time" value={f.scheduledTime} onChange={e=>set('scheduledTime',e.target.value)}/></Field><Field label="Priority"><select value={f.priority} onChange={e=>set('priority',e.target.value)}>{['low','medium','high','urgent'].map(x=><option>{x}</option>)}</select></Field><Field label="Scope / work order" full><textarea rows="5" value={f.scope} onChange={e=>set('scope',e.target.value)}/></Field></div><br/><div className="actions"><button className="btn primary" onClick={save}>Create job</button><button className="btn" onClick={close}>Cancel</button></div></Modal>}
function JobDetail({j,engineers,close,flash}){let[s,setS]=useState(j.status||'scheduled'),[e,setE]=useState(j.assignedEngineer||'Unassigned'),[note,setN]=useState('');let save=async()=>{try{await db.collection('jobs').doc(j.id).update({status:s,assignedEngineer:e,updatedAt:stamp(),lastNote:note||j.lastNote||''});await db.collection('auditLogs').add({action:'job.updated',jobNumber:j.jobNumber||j.id,actor:auth.currentUser.email,details:{status:s,assignedEngineer:e},createdAt:stamp()});flash('Job card updated');close()}catch(x){flash(x.message)}};return <Modal title={j.jobNumber||j.id} close={close}><div className="formgrid"><Field label="Ticket"><input value={j.ticketRef||''} readOnly/></Field><Field label="Customer"><input value={j.customerName||j.company||''} readOnly/></Field><Field label="Engineer"><select value={e} onChange={x=>setE(x.target.value)}><option>Unassigned</option>{engineers.filter(x=>x.active!==false).map(x=><option>{x.displayName||x.name||x.email}</option>)}</select></Field><Field label="Status"><select value={s} onChange={x=>setS(x.target.value)}>{['scheduled','dispatched','en-route','onsite','in-progress','awaiting-parts','completed','cancelled'].map(x=><option>{x}</option>)}</select></Field><Field label="Work notes" full><textarea rows="6" value={note} onChange={x=>setN(x.target.value)} placeholder="Engineer instruction / completion note"/></Field></div><br/><div className="actions"><button className="btn primary" onClick={save}>Save job</button></div></Modal>}
function Dispatch({jobs,engineers,flash}){let un=jobs.filter(x=>!x.assignedEngineer||x.assignedEngineer==='Unassigned');return <><div className="card"><h3>Unassigned / Dispatch Queue</h3>{un.length?<div className="table"><table><thead><tr><th>Job</th><th>Customer</th><th>Type</th><th>Date</th><th>Priority</th></tr></thead><tbody>{un.map(j=><tr><td>{j.jobNumber||j.id}</td><td>{j.customerName||'—'}</td><td>{j.jobType||'—'}</td><td>{j.scheduledDate||'—'} {j.scheduledTime||''}</td><td>{j.priority||'medium'}</td></tr>)}</tbody></table></div>:<div className="empty">Dispatch queue is clear.</div>}</div><br/><div className="grid3">{engineers.map(e=><div className="card"><h3>{e.displayName||e.name||e.email}</h3><p className="muted">{roleLabel(e.role)} · {e.active===false?'inactive':'active'}</p><p>Assigned jobs <b>{jobs.filter(j=>(j.assignedEngineer||'')===(e.displayName||e.name||e.email)&&!['completed','cancelled'].includes(j.status)).length}</b></p><span className={'pill '+(e.active===false?'red':'green')}>{e.department||e.jobTitle||'General field support'}</span></div>)}</div></>}
function Engineers({data}){return <><div className="card"><p className="muted">Live staff directory from Team &amp; Access. Accounts, roles and access are managed in the admin portal — this view is read-only.</p></div><br/><div className="card table"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Phone</th><th>Status</th></tr></thead><tbody>{data.map(x=><tr><td>{x.displayName||x.name||'—'}</td><td>{x.email||'—'}</td><td>{roleLabel(x.role)}</td><td>{x.department||x.jobTitle||'—'}</td><td>{x.phone||'—'}</td><td><span className={'pill '+(x.active===false?'red':'green')}>{x.active===false?'inactive':'active'}</span></td></tr>)}</tbody></table>{!data.length&&<div className="empty">No staff accounts found yet.</div>}</div></>}
function Customers({data}){return <Simple title="Customer Accounts" heads={['Company','Contact','Email','Phone','Status']} rows={data.map(x=>[x.company||x.name||'—',x.name||'—',x.email||'—',x.phone||'—',x.status||'active'])}/>}
function Assets({data}){return <Simple title="Asset Register" heads={['Asset','Customer','Serial','Type','Status']} rows={data.map(x=>[x.name||x.assetTag||'—',x.company||x.customerName||'—',x.serialNumber||'—',x.deviceType||x.type||'—',x.status||'active'])}/>}
function Quotes({data,flash}){return <Simple title="Quotes & Invoices" heads={['Reference','Customer','Amount','Status','Updated','Type']} rows={data.map(x=>[x.ref||x.quotationRef||x.id,x.company||x.customerName||'—',x.total||x.amount||'—',x.status||'pending',fmt(x.updatedAt||x.createdAt),x.type||'quote'])}/>}
function SLA({tickets,jobs}){let now=Date.now(),open=tickets.filter(t=>!['resolved','closed','cancelled'].includes(String(t.status||'').toLowerCase())),breached=tickets.filter(t=>t.slaStatus==='breached'),risk=tickets.filter(t=>t.slaStatus==='at-risk'),tracking=tickets.filter(t=>t.slaStatus==='within-sla');return <><div className="grid3"><div className="card"><h3>SLA Breached</h3><div className="metric">{breached.length}</div><p className="muted">Server-evaluated against business-hour targets.</p></div><div className="card"><h3>At Risk</h3><div className="metric">{risk.length}</div><p className="muted">Approaching the configured warning threshold.</p></div><div className="card"><h3>Within SLA</h3><div className="metric">{tracking.length}</div><p className="muted">Currently inside the operational target.</p></div></div><br/><div className="card table"><h3>Escalation Queue</h3><table><thead><tr><th>Ticket</th><th>Priority</th><th>Status</th><th>SLA</th><th>Due</th><th>Elapsed</th></tr></thead><tbody>{open.sort((a,b)=>String(b.slaStatus||'').localeCompare(String(a.slaStatus||''))).slice(0,50).map(t=><tr><td>{t.ref||t.ticketNumber||t.id}</td><td>{t.priority||'medium'}</td><td>{t.status||'open'}</td><td><span className={'pill '+cls(t.slaStatus)}>{t.slaStatus||'pending evaluation'}</span></td><td>{fmt(t.slaDueAt)}</td><td>{t.slaElapsedBusinessMinutes!=null?t.slaElapsedBusinessMinutes+' min':'—'}</td></tr>)}</tbody></table></div></>}
function Reports({d}){let by={};d.tickets.forEach(t=>{let k=t.serviceCategoryLabel||t.serviceType||'General';by[k]=(by[k]||0)+1});let minutes=d.tickets.reduce((n,t)=>n+Number(t.timeSpentMinutes||0),0),completed=d.jobs.filter(x=>x.status==='completed').length;let engineerMap={};d.tickets.forEach(t=>{let k=t.assignedEngineer||'Unassigned';engineerMap[k]=(engineerMap[k]||0)+Number(t.timeSpentMinutes||0)});return <div className="grid3"><div className="card"><h3>Service Volume</h3>{Object.entries(by).map(([k,v])=><p>{k}: <b>{v}</b></p>)}</div><div className="card"><h3>Workforce & Billable Time</h3><p>Engineers <b>{d.engineers.length}</b></p><p>Jobs <b>{d.jobs.length}</b></p><p>Completed jobs <b>{completed}</b></p><p>Tracked ticket time <b>{minutes} min</b></p></div><div className="card"><h3>Engineer Time</h3>{Object.entries(engineerMap).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=><p>{k}: <b>{v} min</b></p>)}</div></div>
function Audit({data}){return <Simple title="Audit Trail" heads={['Time','Actor','Action','Reference']} rows={data.slice(0,150).map(x=>[fmt(x.createdAt),x.actor||'—',x.action||'—',x.ticketRef||x.jobNumber||x.engineerId||'—'])}/>}
function Settings({user}){return <div className="grid3"><div className="card"><h3>Signed-in administrator</h3><p>{user.email}</p><button className="btn" onClick={()=>auth.sendPasswordResetEmail(user.email)}>Send password reset</button></div><div className="card"><h3>Security model</h3><p className="muted">Phase 4 includes role-aware data design, but Firebase custom claims and production rules must be deployed in the project before staff access is trusted.</p></div><div className="card"><h3>Operating model</h3><p>Customer Portal → Ticket → Dispatch → Job Card → Engineer Work → Sign-off → Quote/Invoice → Audit.</p></div></div>}
function Simple({title,heads,rows}){return <div className="card table"><h3>{title}</h3><table><thead><tr>{heads.map(h=><th>{h}</th>)}</tr></thead><tbody>{rows.map(r=><tr>{r.map(c=><td>{c}</td>)}</tr>)}</tbody></table>{!rows.length&&<div className="empty">No records available.</div>}</div>}
function Field({label,children,full}){return <div className={'field '+(full?'full':'')}><label>{label}</label>{children}</div>};function Modal({title,close,children}){return <div className="modal"><div className="modalbox"><div className="kpi"><h2>{title}</h2><button className="btn" onClick={close}>Close</button></div><hr/>{children}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
