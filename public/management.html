<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber I.T Masters — Management & Operations</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#e9f1fb}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#091624;border-right:1px solid #19304a;padding:20px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:18px;margin-bottom:28px}.brand span{color:#53a8ff}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#9eb1c6;text-align:left;padding:12px 14px;border-radius:12px}.nav button.active,.nav button:hover{background:#102943;color:#fff}.main{padding:24px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{margin:0;font-size:27px}.muted{color:#8ea2b8}.btn{border:1px solid #24435f;background:#10243a;color:#fff;padding:10px 14px;border-radius:10px}.primary{background:#1677d2;border-color:#238be8}.danger{background:#5b1e2b;border-color:#853044}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0b1a2b;border:1px solid #19324c;border-radius:16px;padding:18px}.metric{font-size:30px;font-weight:900;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#071522;border:1px solid #29445f;color:#fff;border-radius:10px;padding:11px;width:100%}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #19304a}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#15304a;color:#cde6ff;font-size:12px}.pill.green{background:#123c2b;color:#8ef0bd}.pill.orange{background:#493417;color:#ffd58a}.pill.red{background:#4b1e29;color:#ff9eae}.split{display:grid;grid-template-columns:1.4fr .9fr;gap:15px}.detail h3{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:5}.modalbox{background:#0b1a2b;border:1px solid #284562;border-radius:18px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#12365a,#07111f 55%)}.loginbox{width:min(430px,92vw);padding:28px;background:#0b1a2b;border:1px solid #27445f;border-radius:20px}.toast{position:fixed;right:18px;bottom:18px;background:#102943;border:1px solid #2d5a7f;padding:12px 16px;border-radius:12px;z-index:10}.empty{padding:35px;text-align:center;color:#8ea2b8}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid #19304a}.nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:600px){.main{padding:14px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="root"></div>
<script>const firebaseConfig={apiKey:"AIzaSyBpoDnbWKvWQdvcZnhUZwFr24iox2fWJto",authDomain:"test-bot-49f99.firebaseapp.com",projectId:"test-bot-49f99",storageBucket:"test-bot-49f99.firebasestorage.app",messagingSenderId:"522231357803",appId:"1:522231357803:web:bf65a73d1df7269615ac2e",databaseURL:"https://test-bot-49f99-default-rtdb.firebaseio.com"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth(),storage=firebase.storage();</script>
<script type="text/babel">const {useState,useEffect,useMemo}=React;
const NAV=[['dashboard','Dashboard'],['tickets','Service Desk'],['engineers','Engineers'],['customers','Customers'],['assets','Assets'],['quotes','Quotes & Invoices'],['sla','SLA & Escalations'],['reports','Reports'],['audit','Audit Log'],['settings','Settings']];
const statusClass=s=>/resolved|closed|active/i.test(s)?'green':/urgent|overdue|cancel/i.test(s)?'red':'orange';
const ts=x=>x?.toDate?x.toDate():x?new Date(x):null; const fmt=x=>{const d=ts(x);return d&&!isNaN(d)?d.toLocaleString(): '—'};
function Login(){const[email,setEmail]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState('');const go=async e=>{e.preventDefault();setErr('');try{await auth.signInWithEmailAndPassword(email,pw)}catch(x){setErr(x.message)}};return <div className="login"><form className="loginbox" onSubmit={go}><h1>Cyber I.T Masters</h1><p className="muted">Management & Operations</p><div className="field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required/></div><br/><div className="field"><label>Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} required/></div><br/><button className="btn primary" style={{width:'100%'}}>Sign in</button>{err&&<p style={{color:'#ff9eae'}}>{err}</p>}</form></div>}
function App(){const[user,setUser]=useState(undefined),[page,setPage]=useState('dashboard'),[tickets,setTickets]=useState([]),[engineers,setEngineers]=useState([]),[customers,setCustomers]=useState([]),[assets,setAssets]=useState([]),[quotes,setQuotes]=useState([]),[audit,setAudit]=useState([]),[selected,setSelected]=useState(null),[toast,setToast]=useState('');useEffect(()=>auth.onAuthStateChanged(setUser),[]);useEffect(()=>{if(!user)return;const loads=[['tickets',setTickets],['engineers',setEngineers],['customers',setCustomers],['assets',setAssets],['quotes',setQuotes],['auditLogs',setAudit]];return Promise.all(loads.map(async([c,set])=>{try{const s=await db.collection(c).orderBy('updatedAt','desc').limit(250).get();set(s.docs.map(d=>({id:d.id,...d.data()})))}catch(e){try{const s=await db.collection(c).limit(250).get();set(s.docs.map(d=>({id:d.id,...d.data()})))}catch(_){}}}))},[user]);const flash=x=>{setToast(x);setTimeout(()=>setToast(''),2500)};if(user===undefined)return null;if(!user)return <Login/>;const active=tickets.filter(t=>!['resolved','closed'].includes(String(t.status||'').toLowerCase())).length;const overdue=tickets.filter(t=>String(t.slaStatus||'').toLowerCase()==='overdue').length;const nav=()=>{if(page==='dashboard')return <Dashboard tickets={tickets} engineers={engineers} customers={customers} active={active} overdue={overdue} onOpen={t=>{setSelected(t);setPage('tickets')}}/>;if(page==='tickets')return <Tickets data={tickets} onOpen={setSelected} toast={flash}/>;if(page==='engineers')return <Engineers data={engineers} toast={flash}/>;if(page==='customers')return <Customers data={customers} toast={flash}/>;if(page==='assets')return <Assets data={assets}/>;if(page==='quotes')return <Quotes data={quotes}/>;if(page==='sla')return <SLA tickets={tickets}/>;if(page==='reports')return <Reports tickets={tickets} engineers={engineers} customers={customers}/>;if(page==='audit')return <Audit data={audit}/>;return <Settings user={user}/>};return <div className="app"><aside className="side"><div className="brand">CYBER <span>I.T MASTERS</span></div><div className="nav">{NAV.map(n=><button className={page===n[0]?'active':''} onClick={()=>{setPage(n[0]);setSelected(null)}}>{n[1]}</button>)}</div><button className="btn" style={{marginTop:25,width:'100%'}} onClick={()=>auth.signOut()}>Sign out</button></aside><main className="main"><div className="top"><div><h1>{NAV.find(x=>x[0]===page)?.[1]}</h1><span className="muted">Enterprise service operations</span></div>{selected&&<button className="btn" onClick={()=>setSelected(null)}>Close detail</button>}</div>{selected?<TicketDetail t={selected} close={()=>setSelected(null)} toast={flash}/>:nav()}</main>{toast&&<div className="toast">{toast}</div>}</div>}
function Dashboard({tickets,engineers,customers,active,overdue,onOpen}){return <><div className="grid"><Metric label="Total Tickets" value={tickets.length}/><Metric label="Active Work" value={active}/><Metric label="Engineers" value={engineers.length}/><Metric label="SLA Overdue" value={overdue}/></div><br/><div className="split"><div className="card"><h3>Recent Service Requests</h3><div className="table"><table><thead><tr><th>Ticket</th><th>Customer</th><th>Service</th><th>Status</th></tr></thead><tbody>{tickets.slice(0,8).map(t=><tr onClick={()=>onOpen(t)}><td>{t.ref||t.ticketNumber||t.id}</td><td>{t.company||t.clientName||t.name||'—'}</td><td>{t.serviceSubCategoryLabel||t.serviceCategoryLabel||t.serviceType||'—'}</td><td><span className={'pill '+statusClass(t.status)}>{t.status||'open'}</span></td></tr>)}</tbody></table></div></div><div className="card"><h3>Operations Snapshot</h3><p>Customers <b>{customers.length}</b></p><p>Known assets <b>{tickets.filter(t=>t.serialNumber||t.deviceType).length}</b></p><p>Quotes awaiting action <b>{tickets.filter(t=>t.quoteStatus==='pending'||t.quotationRef).length}</b></p><p>Open urgent requests <b>{tickets.filter(t=>String(t.priority).toLowerCase()==='urgent').length}</b></p></div></div></>}
function Metric({label,value}){return <div className="card"><span className="muted">{label}</span><div className="metric">{value}</div></div>}
function Tickets({data,onOpen}){const[q,setQ]=useState(''),[s,setS]=useState('');const rows=data.filter(t=>JSON.stringify(t).toLowerCase().includes(q.toLowerCase())&&(!s||t.status===s));return <><div className="toolbar"><input placeholder="Search tickets, customer, service..." value={q} onChange={e=>setQ(e.target.value)}/><select value={s} onChange={e=>setS(e.target.value)}><option value="">All statuses</option>{['open','assigned','in-progress','on-hold','awaiting-customer','resolved','closed'].map(x=><option>{x}</option>)}</select></div><div className="card table"><table><thead><tr><th>Reference</th><th>Customer</th><th>Category</th><th>Priority</th><th>Engineer</th><th>Status</th><th>Updated</th></tr></thead><tbody>{rows.map(t=><tr><td><button className="btn" onClick={()=>onOpen(t)}>{t.ref||t.ticketNumber||t.id}</button></td><td>{t.company||t.clientName||t.name}</td><td>{t.serviceCategoryLabel||t.serviceType}</td><td><span className={'pill '+statusClass(t.priority)}>{t.priority||'medium'}</span></td><td>{t.assignedEngineer||'Unassigned'}</td><td><span className={'pill '+statusClass(t.status)}>{t.status||'open'}</span></td><td>{fmt(t.updatedAt||t.createdAt)}</td></tr>)}</tbody></table>{!rows.length&&<div className="empty">No tickets found.</div>}</div></>}
function TicketDetail({t,close,toast}){const[status,setStatus]=useState(t.status||'open'),[eng,setEng]=useState(t.assignedEngineer||''),[note,setNote]=useState('');const save=async()=>{try{await db.collection('tickets').doc(t.id).update({status,assignedEngineer:eng,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('auditLogs').add({action:'ticket.updated',ticketRef:t.ref||t.id,actor:auth.currentUser.email,details:{status,assignedEngineer:eng},createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Ticket updated');close()}catch(e){toast(e.message)}};return <div className="card detail"><div className="modalhead"><h2>{t.ref||t.ticketNumber||t.id}</h2><span className={'pill '+statusClass(status)}>{status}</span></div><p className="muted">Created {fmt(t.createdAt)} · Updated {fmt(t.updatedAt)}</p><div className="split"><div><h3>Request</h3><p><b>Customer:</b> {t.company||t.clientName||t.name||'—'}</p><p><b>Contact:</b> {t.phone||'—'} · {t.email||'—'}</p><p><b>Service:</b> {t.serviceCategoryLabel||t.serviceType} / {t.serviceSubCategoryLabel||t.serviceSubCategory}</p><p><b>Issue:</b> {t.issueTitle||'—'}</p><p>{t.problemDescription||t.issueDetail||'No description.'}</p><p><b>Channels:</b> {(t.channels||[t.contactMethod]).filter(Boolean).join(', ')||'—'}</p><h3>Asset / Site</h3><p>{[t.deviceType,t.manufacturer,t.model,t.serialNumber,t.operatingSystem].filter(Boolean).join(' · ')||'No asset data'}</p><p>{t.address||'No onsite address'}</p></div><div><div className="field"><label>Status</label><select value={status} onChange={e=>setStatus(e.target.value)}>{['open','assigned','in-progress','on-hold','awaiting-customer','resolved','closed'].map(x=><option>{x}</option>)}</select></div><br/><div className="field"><label>Assigned engineer</label><input value={eng} onChange={e=>setEng(e.target.value)} placeholder="Engineer name / UID"/></div><br/><div className="field"><label>Internal note</label><textarea rows="7" value={note} onChange={e=>setNote(e.target.value)} placeholder="Add operational note..."/></div><br/><div className="actions"><button className="btn primary" onClick={save}>Save changes</button><button className="btn" onClick={()=>window.open('https://wa.me/'+String(t.phone||'').replace(/\D/g,''),'_blank')}>WhatsApp</button></div></div></div></div>}
function SimpleTable({title,headers,rows}){return <div className="card"><h3>{title}</h3><div className="table"><table><thead><tr>{headers.map(h=><th>{h}</th>)}</tr></thead><tbody>{rows.map(r=><tr>{r.map(c=><td>{c}</td>)}</tr>)}</tbody></table>{!rows.length&&<div className="empty">No records available.</div>}</div></div>}
function Engineers({data}){return <SimpleTable title="Engineer Roster" headers={['Engineer','Email','Role','Status','Skills']} rows={data.map(x=>[x.name||x.displayName||x.email,x.email||'—',x.role||'Engineer',x.status||'active',(x.skills||[]).join(', ')||'—'])}/>}
function Customers({data}){return <SimpleTable title="Customer Accounts" headers={['Company','Contact','Email','Phone','Status']} rows={data.map(x=>[x.company||x.name||'—',x.name||'—',x.email||'—',x.phone||'—',x.status||'active'])}/>}
function Assets({data}){return <SimpleTable title="Asset Register" headers={['Asset','Customer','Serial','Type','Status']} rows={data.map(x=>[x.name||x.assetTag||'—',x.company||x.customerName||'—',x.serialNumber||'—',x.deviceType||x.type||'—',x.status||'active'])}/>}
function Quotes({data}){return <SimpleTable title="Quotes & Invoices" headers={['Reference','Customer','Amount','Status','Updated']} rows={data.map(x=>[x.ref||x.quotationRef||x.id,x.company||x.customerName||'—',x.total||x.amount||'—',x.status||'pending',fmt(x.updatedAt||x.createdAt)])}/>}
function SLA({tickets}){return <SimpleTable title="SLA Watchlist" headers={['Ticket','Priority','SLA','Engineer','Status']} rows={tickets.filter(t=>t.slaStatus||t.priority==='urgent').map(x=>[x.ref||x.id,x.priority||'—',x.slaStatus||'—',x.assignedEngineer||'Unassigned',x.status||'open'])}/>}
function Reports({tickets,engineers,customers}){const counts={};tickets.forEach(t=>counts[t.serviceCategoryLabel||t.serviceType||'General']=(counts[t.serviceCategoryLabel||t.serviceType||'General']||0)+1);return <div className="grid"><div className="card"><h3>Service Volume</h3>{Object.entries(counts).map(([k,v])=><p>{k}: <b>{v}</b></p>)}</div><div className="card"><h3>Workforce</h3><p>Engineers: <b>{engineers.length}</b></p><p>Customers: <b>{customers.length}</b></p></div><div className="card"><h3>Ticket Outcomes</h3><p>Resolved: <b>{tickets.filter(t=>t.status==='resolved').length}</b></p><p>Closed: <b>{tickets.filter(t=>t.status==='closed').length}</b></p></div></div>}
function Audit({data}){return <SimpleTable title="Audit Trail" headers={['Time','Actor','Action','Ticket']} rows={data.slice(0,100).map(x=>[fmt(x.createdAt),x.actor||'—',x.action||'—',x.ticketRef||'—'])}/>}
function Settings({user}){return <div className="card"><h3>Management Configuration</h3><p>Signed in as <b>{user.email}</b></p><p className="muted">Firebase configuration is preserved from the existing Cyber I.T Masters project. Production security rules should enforce role-based access before this portal is exposed to staff.</p><div className="actions"><button className="btn" onClick={()=>auth.sendPasswordResetEmail(user.email)}>Send password reset</button></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
