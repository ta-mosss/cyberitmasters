*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;font-family:'Plus Jakarta Sans',sans-serif}body{background:#050810;color:#e5edf7}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.shell{display:flex;min-height:100vh}.side{width:245px;background:#080d18;border-right:1px solid #162235;padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 20px;border-bottom:1px solid #162235}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#00c896,#0ea5e9);display:grid;place-items:center;color:#031017;font-weight:800}.brand b{display:block;font-size:13px}.brand small{color:#64748b;font-size:9px;text-transform:uppercase;letter-spacing:.12em}.nav{padding-top:16px}.nav button{width:100%;border:0;background:transparent;color:#8fa0b7;text-align:left;padding:11px 12px;border-radius:9px;margin-bottom:3px}.nav button:hover,.nav button.on{background:#0e1928;color:#00c896}.sidefoot{margin-top:auto;color:#64748b;font-size:10px;padding:12px}.main{flex:1;min-width:0}.top{height:62px;border-bottom:1px solid #162235;background:#080d18;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:16px;margin:0}.top span{font-size:11px;color:#64748b}.content{padding:24px;max-width:1600px;margin:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:#080d18;border:1px solid #162235;border-radius:12px}.stat{padding:15px}.stat strong{font:600 24px 'IBM Plex Mono';display:block}.stat small{color:#64748b}.grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px}.cardhead{padding:15px 18px;border-bottom:1px solid #162235;display:flex;justify-content:space-between;align-items:center}.cardhead b{font-size:13px}.body{padding:18px}.filters{display:flex;gap:8px;margin-bottom:12px}.input{background:#050810;border:1px solid #1d2b40;color:#dbe6f3;border-radius:8px;padding:9px 11px;width:100%}.btn{border:1px solid #203048;background:#0b1422;color:#b7c5d7;border-radius:8px;padding:9px 13px;font-weight:600;font-size:12px}.btn.primary{background:linear-gradient(135deg,#00c896,#0ea5e9);color:#041018;border:0}.btn.good{border-color:#087a5e;color:#42e0b0}.btn.warn{border-color:#8b6415;color:#fbbf24}.btn.danger{border-color:#74303a;color:#fb7185}.ticket{padding:14px;border:1px solid #162235;border-radius:10px;margin-bottom:8px;background:#070c15;cursor:pointer}.ticket:hover,.ticket.sel{border-color:#00c896;background:#09121e}.row{display:flex;justify-content:space-between;gap:10px}.ticket h3{font-size:13px;margin:0 0 5px}.muted{color:#718096;font-size:11px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase}.open{background:#143329;color:#45e0b0}.progress{background:#122b45;color:#63b3ed}.pending{background:#3b2b0d;color:#fbbf24}.resolved{background:#252b34;color:#a8b3c2}.urgent{background:#401b24;color:#fb7185}.detail{position:sticky;top:78px;max-height:calc(100vh - 102px);overflow:auto}.section{border-bottom:1px solid #162235;padding:15px 0}.section:first-child{padding-top:0}.label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#64748b;font-weight:800;margin-bottom:5px}.value{font-size:12px;color:#d7e1ec;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:7px}.timeline{border-left:2px solid #1b2c42;margin-left:7px;padding-left:14px}.event{margin-bottom:14px;position:relative}.event:before{content:'';position:absolute;left:-20px;top:4px;width:7px;height:7px;border-radius:50%;background:#00c896}.event b{font-size:11px}.event p{font-size:11px;color:#8190a4;margin:4px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#10243b,#050810 50%)}.loginbox{width:min(420px,100%);background:#080d18;border:1px solid #1b2b40;border-radius:16px;padding:28px}.loginbox h1{margin:0 0 6px}.loginbox p{color:#718096;font-size:12px;line-height:1.6}.loginbox .input{margin:7px 0 12px}.error{color:#fb7185;font-size:11px;margin:8px 0}.toast{position:fixed;right:20px;bottom:20px;background:#0d1928;border:1px solid #28405d;border-radius:9px;padding:12px 15px;z-index:20;font-size:12px}.empty{text-align:center;padding:40px;color:#64748b;font-size:12px}.upload{border:1px dashed #29405b;border-radius:9px;padding:12px}.upload input{display:none}.mobilebar{display:none}@media(max-width:1050px){.grid{grid-template-columns:1fr}.detail{position:static;max-height:none}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.side{display:none}.content{padding:14px}.top{padding:0 14px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#080d18;border-top:1px solid #162235;padding:8px;gap:6px;z-index:10}.mobilebar button{flex:1}.content{padding-bottom:78px}}

<script>
const firebaseConfig={apiKey:"AIzaSyBpoDnbWKvWQdvcZnhUZwFr24iox2fWJto",authDomain:"test-bot-49f99.firebaseapp.com",projectId:"test-bot-49f99",storageBucket:"test-bot-49f99.firebasestorage.app",messagingSenderId:"522231357803",appId:"1:522231357803:web:bf65a73d1df7269615ac2e"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth(),storage=firebase.storage();
</script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const STATUSES=['open','assigned','in_progress','on_hold','awaiting_customer','resolved','closed'];
const LABELS={open:'Open',assigned:'Assigned',in_progress:'In Progress',on_hold:'On Hold',awaiting_customer:'Awaiting Customer',resolved:'Resolved',closed:'Closed'};
const fmt=v=>{if(!v)return '—';try{return new Date(v.seconds? v.seconds*1000:v).toLocaleString()}catch{return String(v)}};
const now=()=>new Date().toISOString();
function Login({onLogin}){const [email,setEmail]=useState(''),[pw,setPw]=useState(''),[busy,setBusy]=useState(false),[err,setErr]=useState('');async function go(e){e.preventDefault();setBusy(true);setErr('');try{const c=await auth.signInWithEmailAndPassword(email,pw);const u=c.user;const token=await u.getIdTokenResult(true);let profile=null;try{const s=await db.collection('engineers').doc(u.uid).get();if(s.exists)profile={id:s.id,...s.data()}}catch{}if(!profile){try{const q=await db.collection('mgmt_staff').where('email','==',u.email).limit(1).get();if(!q.empty)profile={id:q.docs[0].id,...q.docs[0].data()}}catch{} }const role=String(profile?.role||'').toLowerCase();if(!(token.claims.admin||token.claims.engineer||['engineer','senior engineer','team lead','technician'].includes(role))){await auth.signOut();throw new Error('This account is not authorised for the Engineer Portal.');}onLogin({u,profile,token});}catch(x){setErr(x.message||'Sign-in failed')}finally{setBusy(false)}}return <div className="login"><form className="loginbox" onSubmit={go}><div className="logo">⚡</div><h1>Engineer Portal</h1><p>Cyber I.T Masters field-service workspace. Sign in with your Firebase engineer account.</p><label className="label">Email</label><input className="input" type="email" required value={email} onChange={e=>setEmail(e.target.value)}/><label className="label">Password</label><input className="input" type="password" required value={pw} onChange={e=>setPw(e.target.value)}/>{err&&<div className="error">{err}</div>}<button className="btn primary" style={{width:'100%',marginTop:8}} disabled={busy}>{busy?'Signing in…':'Sign in securely'}</button><button type="button" className="btn" style={{width:'100%',marginTop:8}} onClick={()=>auth.sendPasswordResetEmail(email).then(()=>setErr('Password reset email sent.')).catch(e=>setErr(e.message))}>Forgot password</button></form></div>}
function App({session}){const [tab,setTab]=useState('jobs'),[tickets,setTickets]=useState([]),[selected,setSelected]=useState(null),[loading,setLoading]=useState(true),[toast,setToast]=useState(''),[search,setSearch]=useState(''),[filter,setFilter]=useState('active'),[note,setNote]=useState(''),[status,setStatus]=useState(''),[time,setTime]=useState(null),[uploading,setUploading]=useState(false);const uid=session.u.uid;const name=session.profile?.name||session.profile?.fullName||session.u.displayName||session.u.email;
useEffect(()=>{setLoading(true);const refs=[db.collection('tickets').where('assignedEngineerId','==',uid),db.collection('tickets').where('assignedEngineer','==',name)];let alive=true;let data={};const unsubs=refs.map((q,i)=>q.onSnapshot(s=>{data[i]=s.docs.map(d=>({id:d.id,...d.data()}));if(alive){const m=new Map();Object.values(data).flat().forEach(t=>m.set(t.id,t));setTickets([...m.values()].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))));setLoading(false)}},()=>setLoading(false)));return()=>{alive=false;unsubs.forEach(x=>x())}},[uid,name]);
const active=tickets.filter(t=>!['resolved','closed'].includes(String(t.status)));const shown=useMemo(()=>tickets.filter(t=>filter==='all'||(filter==='active'?!['resolved','closed'].includes(t.status):t.status===filter)).filter(t=>(t.ref||t.ticketNumber||'').toLowerCase().includes(search.toLowerCase())||(t.issueTitle||t.problemDescription||'').toLowerCase().includes(search.toLowerCase())||(t.clientName||t.name||'').toLowerCase().includes(search.toLowerCase())),[tickets,filter,search]);
function flash(x){setToast(x);setTimeout(()=>setToast(''),2600)}
async function update(ch,msg){if(!selected)return;await db.collection('tickets').doc(selected.id).update({...ch,updatedAt:now()});setSelected(s=>({...s,...ch}));flash(msg||'Updated')}
async function requestClientSignoff(){
  if(!selected)return;
  try{
    const u=auth.currentUser;
    if(!u) throw new Error('Your session has expired. Please sign in again.');
    const token=await u.getIdToken(true);
    const res=await fetch('/.netlify/functions/authorise',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
      body:JSON.stringify({mode:'create-link',ticketId:selected.ref||selected.id})
    });
    const result=await res.json().catch(()=>({}));
    if(!res.ok||!result.success)throw new Error(result.error||'Could not create sign-off link.');
    setSelected(t=>({...t,status:'awaiting-signoff',signoffRequestedAt:new Date().toISOString()}));
    try{await navigator.clipboard.writeText(result.link);flash('Secure sign-off link created and copied to clipboard ✓');}
    catch{flash(`Secure sign-off link created: ${result.link}`);}
  }catch(e){flash(e.message||'Could not create sign-off link.');}
}
async function addNote(){if(!note.trim()||!selected)return;const notes=[...(selected.notes||[]),{id:crypto.randomUUID(),txt:note.trim(),author:name,authorId:uid,at:now(),source:'engineer'}];await update({notes},'Engineer note added');setNote('')}
async function changeStatus(s){await update({status:s,engineerStatus:s,engineerId:uid,engineerName:name},`Status changed to ${LABELS[s]||s}`)}
async function upload(e){const files=[...e.target.files].slice(0,6);if(!files.length||!selected)return;setUploading(true);try{const arr=[...(selected.attachments||[])];for(const f of files){const path=`ticket-attachments/${selected.ref||selected.id}/engineer/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const r=await storage.ref(path).put(f);const url=await r.ref.getDownloadURL();arr.push({name:f.name,size:f.size,url,path,uploadedAt:now(),uploadedBy:uid,uploadedByName:name});}await update({attachments:arr},'Files uploaded')}catch(e){flash(e.message)}finally{setUploading(false);e.target.value=''}}
async function startTimer(){if(time)return;const x={startedAt:now()};setTime(x);if(selected)await update({workStartedAt:x.startedAt},'Work timer started')}async function stopTimer(){if(!time)return;const mins=Math.max(1,Math.round((Date.now()-new Date(time.startedAt).getTime())/60000));const old=Number(selected?.timeSpentMinutes||0);await update({timeSpentMinutes:old+mins,workLastStoppedAt:now()},`Logged ${mins} minutes`);setTime(null)}
<button className="btn" onClick={requestClientSignoff}>Request secure sign-off</button>
function Root(){const [session,setSession]=useState(null),[checking,setChecking]=useState(true);useEffect(()=>auth.onAuthStateChanged(async u=>{if(!u){setSession(null);setChecking(false);return}try{const token=await u.getIdTokenResult(true);let profile=null;const s=await db.collection('engineers').doc(u.uid).get();if(s.exists)profile={id:s.id,...s.data()};else{const q=await db.collection('mgmt_staff').where('email','==',u.email).limit(1).get();if(!q.empty)profile={id:q.docs[0].id,...q.docs[0].data()}}const role=String(profile?.role||'').toLowerCase();if(token.claims.admin||token.claims.engineer||['engineer','senior engineer','team lead','technician'].includes(role))setSession({u,profile,token});else await auth.signOut()}catch(e){console.error(e)}finally{setChecking(false)}}),[]);if(checking)return <div className="login"><div className="loginbox"><h1>Loading Engineer Portal…</h1><p>Checking Firebase authentication and engineer permissions.</p></div></div>;return session?<App session={session}/>:<Login onLogin={setSession}/>};ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script></body></html>
