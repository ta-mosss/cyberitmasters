<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#030712;color:#E2E8F0;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}

button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00C896!important;box-shadow:0 0 0 3px rgba(0,200,150,0.12)!important;}

/* VARS */
:root{
  --bg:#030712;--bg2:#07111F;--bg3:#0B1929;
  --border:#0F1C2E;--border2:#1A2A3A;

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes scanline{0%{top:-100%;}100%{top:200%;}}

.fu{animation:fadeUp .35s ease forwards;}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden;}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,200,150,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,150,.04) 1px,transparent 1px);background-size:48px 48px;}
.login-scan{position:absolute;left:0;right:0;height:200px;background:linear-gradient(to bottom,transparent,rgba(0,200,150,.04),transparent);animation:scanline 4s linear infinite;pointer-events:none;}
.login-box{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:40px;width:380px;position:relative;z-index:2;box-shadow:0 0 60px rgba(0,200,150,.08);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px;}
.login-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.03em;}
.login-sub{font-size:12px;color:var(--text3);margin-top:4px;}

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ── CONSTANTS ── */
const SUPER_ADMIN={user:"admin",pass:"Moses2026"};
const AC="#00C896",AC2="#0EA5E9",DANGER="#EF4444",WARN="#F59E0B";

const DEFAULT_SLA={
  Urgent:{hours:4,warn:2,breach:0},
  High:{hours:8,warn:4,breach:0},
  Medium:{hours:24,warn:8,breach:0},
  Low:{hours:48,warn:12,breach:0}
};

const DEFAULT_ESCALATION=[
  {tier:1,name:"First Response",triggerHours:2,notifyRoles:["Engineer","Team Lead"],actions:["Auto-assign ticket","Send WhatsApp alert to engineer"],color:"#10B981"},
  {tier:2,name:"Manager Escalation",triggerHours:8,notifyRoles:["Manager","Senior Engineer"],actions:["Notify department manager","Flag ticket as critical"],color:WARN},
  {tier:3,name:"Director Escalation",triggerHours:24,notifyRoles:["Director","All Engineers"],actions:["Immediate director notification","Client priority callback"],color:DANGER},
];

const STATUS_META={
  open:{l:"Open",c:"#3B82F6"},
  "in-progress":{l:"In Progress",c:WARN},
  awaiting:{l:"Awaiting Parts",c:"#8B5CF6"},
  resolved:{l:"Resolved",c:AC},
  closed:{l:"Closed",c:"#6B7280"},
  quoted:{l:"Quoted",c:"#EC4899"},
};

const PRIORITY_COLORS={Urgent:DANGER,High:WARN,Medium:AC2,Low:AC};

/* ── HELPERS ── */
const fmtDate=d=>d?new Date(d).toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fmtDateTime=d=>d?new Date(d).toLocaleString("en-ZA",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";

function getSLAStatus(ticket,slaConfig){
  if(!ticket||!ticket.createdAt||!ticket.priority) return null;
  const cfg=slaConfig[ticket.priority]||{hours:24,warn:2};
  const created=new Date(ticket.createdAt).getTime();
  const deadline=created+(cfg.hours*3600000);
  const now=Date.now();
  const diff=deadline-now;
  const diffH=Math.round(diff/3600000);
  if(["resolved","closed"].includes(ticket.status)) return{status:"done",label:"Met"};
  if(diff<0) return{status:"breach",label:`Breached ${Math.abs(diffH)}h ago`};
  if(diff<cfg.warn*3600000) return{status:"warn",label:`${diffH}h left`};
  return{status:"ok",label:`${diffH}h left`};
}

/* ── SPINNER ── */
function Spinner(){

/* ── LOGIN ── */
function Login({onLogin}){
  const [u,setU]=useState("");
  const [p,setP]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    const activeSession=localStorage.getItem("cyberit_superadmin_auth");
    if(activeSession==="true") onLogin();
  },[]);

  const doLogin=()=>{
    setLoading(true);
    setTimeout(()=>{
      if(u===SUPER_ADMIN.user&&p===SUPER_ADMIN.pass){
        localStorage.setItem("cyberit_superadmin_auth","true");
        onLogin();
      }else{
        setErr("Invalid credentials. Access denied.");
        setLoading(false);
      }
    },700);
  };

  const onKey=e=>e.key==="Enter"&&doLogin();

  return(
    <div className="login-wrap">
      <div className="login-grid"/>
      <div className="login-scan"/>
      <div className="login-box fu">
        <div className="login-logo">
          <div className="login-icon">⚡</div>
          <div className="login-title">Cyber I.T Masters</div>
          <div className="login-sub">Super Admin Portal</div>
          <div className="login-badge">🔒 Restricted Access</div>
        </div>
        {err&&<div className="login-err">⚠️ {err}</div>}
        <div className="fi">
          <label>Username</label>
          <input value={u} onChange={e=>setU(e.target.value)} onKeyDown={onKey} placeholder="Enter username" autoFocus/>
        </div>
        <div className="fi">
          <label>Password</label>
          <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={onKey} placeholder="Enter password"/>
        </div>
        <button className="btn btn-primary" style={{width:"100%",marginTop:4}} onClick={doLogin} disabled={loading||!u||!p}>
          {loading?"Authenticating…":"🔐 Access Portal"}
        </button>
        <div style={{textAlign:"center",marginTop:16,fontSize:11,color:"var(--text3)"}}>
          Unauthorised access is strictly prohibited.<br/>All sessions are logged and monitored.
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   DASHBOARD PAGE
═══════════════════════════════════════ */
function Dashboard({tickets,slaConfig}){
  const total=tickets.length;
  const open=tickets.filter(t=>t.status==="open").length;
  const inProg=tickets.filter(t=>t.status==="in-progress").length;
  const resolved=tickets.filter(t=>["resolved","closed"].includes(t.status)).length;
  const breached=tickets.filter(t=>{
    const s=getSLAStatus(t,slaConfig);
    return s&&s.status==="breach";
  }).length;
  const urgent=tickets.filter(t=>t.priority==="Urgent"&&!["resolved","closed"].includes(t.status)).length;
  const unassigned=tickets.filter(t=>(!t.assignedEngineer||t.assignedEngineer==="Unassigned")&&!["resolved","closed"].includes(t.status)).length;
  const today=new Date();today.setHours(0,0,0,0);
  const todayTickets=tickets.filter(t=>new Date(t.createdAt)>=today).length;

  // Engineer workload
  const engMap={};
  tickets.filter(t=>!["resolved","closed"].includes(t.status)).forEach(t=>{
    const eng=t.assignedEngineer||"Unassigned";
    engMap[eng]=(engMap[eng]||0)+1;
  });

  // Status breakdown
  const statusMap={};
  tickets.forEach(t=>{statusMap[t.status]=(statusMap[t.status]||0)+1;});

  // Priority breakdown
  const priMap={};
  tickets.forEach(t=>{priMap[t.priority]=(priMap[t.priority]||0)+1;});

  // Last 7 days tickets
  const days7=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);d.setHours(0,0,0,0);
    const next=new Date(d);next.setDate(next.getDate()+1);
    days7.push({
      label:d.toLocaleDateString("en-ZA",{weekday:"short"}),
      count:tickets.filter(t=>{const c=new Date(t.createdAt);return c>=d&&c<next;}).length
    });
  }
  const maxDay=Math.max(...days7.map(d=>d.count),1);

  // Resolution rate

/* ── DONUT CHART (SVG) ── */
function DonutChart({data,total}){
  if(!data||data.length===0) return null;
  const r=45,cx=60,cy=60,stroke=14;
  const circumference=2*Math.PI*r;
  let offset=0;
  const segments=data.map(d=>{
    const pct=total>0?d.value/total:0;
    const dash=pct*circumference;
    const gap=circumference-dash;
    const seg={...d,dash,gap,offset};
    offset+=dash;
    return seg;
  });
  return(
    <div className="donut-wrap">
      <svg viewBox="0 0 120 120" width="120" height="120">
        {segments.map((s,i)=>(
          <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={stroke}
            strokeDasharray={`${s.dash} ${s.gap}`} strokeDashoffset={-s.offset}
            style={{transform:"rotate(-90deg)",transformOrigin:`${cx}px ${cy}px`}}/>
        ))}
      </svg>
      <div className="donut-center">
        <div className="donut-val">{total}</div>
        <div className="donut-lbl">Total</div>
      </div>
    </div>
  );
}

function EscalationMatrix({showToast}){

  const [loaded,setLoaded]=useState(false);

    db.collection("meta").doc("escalationMatrix").get().then(snap=>{
      if(snap.exists&&snap.data().tiers) setMatrix(snap.data().tiers);
      setLoaded(true);
    }).catch(()=>setLoaded(true));
  },[]);

  const save=async()=>{
    setSaving(true);
    try{
      await db.collection("meta").doc("escalationMatrix").set({tiers:matrix,updatedAt:new Date().toISOString()});
      showToast("Escalation matrix saved ✓");

    setMatrix(prev=>prev.map((t,i)=>i===idx?{...t,[field]:val}:t));

    setMatrix(prev=>prev.map((t,i)=>i===tierIdx?{...t,actions:[...(t.actions||[]),action]}:t));

              <div style={{width:28,height:28,borderRadius:"50%",background:`${tier.color}20`,border:`2px solid ${tier.color}`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:13,color:tier.color}}>
                {tier.tier}

function TicketReports({tickets,slaConfig}){
  const [tab,setTab]=useState("summary");
  const [filter,setFilter]=useState({from:"",to:"",status:"all",priority:"all",engineer:"all"});

  const engineers=[...new Set(tickets.map(t=>t.assignedEngineer||"Unassigned"))].sort();

  const filtered=tickets.filter(t=>{
    if(filter.status!=="all"&&t.status!==filter.status) return false;
    if(filter.priority!=="all"&&t.priority!==filter.priority) return false;
    if(filter.engineer!=="all"&&(t.assignedEngineer||"Unassigned")!==filter.engineer) return false;
    if(filter.from&&new Date(t.createdAt)<new Date(filter.from)) return false;
    if(filter.to){const to=new Date(filter.to);to.setHours(23,59,59,999);if(new Date(t.createdAt)>to) return false;}
    return true;
  });

  // SLA stats
  const slaStats=filtered.reduce((a,t)=>{
    const s=getSLAStatus(t,slaConfig);
    if(!s) return a;
    a[s.status]=(a[s.status]||0)+1;
    return a;
  },{ok:0,warn:0,breach:0,done:0});

  // Tickets per engineer
  const engStats={};
  filtered.forEach(t=>{
    const eng=t.assignedEngineer||"Unassigned";
    if(!engStats[eng]) engStats[eng]={total:0,resolved:0,open:0,breached:0};
    engStats[eng].total++;
    if(["resolved","closed"].includes(t.status)) engStats[eng].resolved++;
    else engStats[eng].open++;
    const s=getSLAStatus(t,slaConfig);
    if(s&&s.status==="breach") engStats[eng].breached++;
  });

  const exportCSV=()=>{
    const headers=["Ref","Date","Client","Company","Service","Priority","Status","Engineer","Issue","SLA Status"];
    const rows=filtered.map(t=>[
      t.ref||"",
      fmtDate(t.createdAt),
      t.clientName||t.name||"",
      t.company||"",
      t.serviceType||"",
      t.priority||"",
      STATUS_META[t.status]?.l||t.status||"",
      t.assignedEngineer||"Unassigned",
      `"${(t.issueTitle||t.problemDescription||"").replace(/"/g,'""')}"`,
      getSLAStatus(t,slaConfig)?.label||""
    ]);
    const csv=[headers,...rows].map(r=>r.join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`tickets-report-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();URL.revokeObjectURL(url);
  };

  const printReport=()=>window.print();

  return(
    <div className="fu">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>

function AuditLog({tickets}){
  const events=[];
  tickets.forEach(t=>{
    events.push({at:t.createdAt,type:"created",ref:t.ref,detail:`Ticket created — ${t.clientName||t.name||"?"} (${t.priority})`});
    if(t.updatedAt&&t.updatedAt!==t.createdAt){
      events.push({at:t.updatedAt,type:"updated",ref:t.ref,detail:`Status: ${STATUS_META[t.status]?.l||t.status}`});
    }
    (t.notes||[]).forEach(n=>{
      events.push({at:n.at,type:"note",ref:t.ref,detail:`Note added${n.engineer?" by "+n.engineer:""}: ${(n.txt||"").slice(0,60)}${n.txt&&n.txt.length>60?"…":""}`});
    });
  });
  events.sort((a,b)=>new Date(b.at)-new Date(a.at));

  const typeColor={created:AC,updated:AC2,note:WARN};
  const typeIcon={created:"🎫",updated:"🔄",note:"📝"};

  return(
    <div className="fu">
      <div style={{marginBottom:20}}>
        <div style={{fontSize:20,fontWeight:800,color:"var(--text)",marginBottom:4}}>Audit Log</div>
        <div style={{fontSize:13,color:"var(--text3)"}}>{events.length} events recorded</div>
      </div>
      <div className="card">
        <div className="ch"><div className="ct">📋 System Activity</div><div style={{fontSize:11,color:"var(--text3)"}}>Last 500 events</div></div>
        <div style={{maxHeight:600,overflowY:"auto"}}>
          {events.slice(0,500).map((e,i)=>(
            <div key={i} style={{display:"flex",gap:12,padding:"10px 16px",borderBottom:"1px solid var(--border)",alignItems:"flex-start"}}>
              <div style={{fontSize:14,flexShrink:0,marginTop:1}}>{typeIcon[e.type]}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:2}}>
                  <span style={{fontSize:11,fontFamily:"'IBM Plex Mono',monospace",color:typeColor[e.type]||AC,fontWeight:700}}>{e.ref}</span>
                  <span style={{fontSize:10,background:`${typeColor[e.type]||AC}18`,color:typeColor[e.type]||AC,padding:"1px 7px",borderRadius:10,fontWeight:700,textTransform:"uppercase"}}>{e.type}</span>
                </div>
                <div style={{fontSize:12,color:"var(--text2)",marginBottom:2}}>{e.detail}</div>
              </div>
              <div style={{fontSize:10,color:"var(--text3)",fontFamily:"'IBM Plex Mono',monospace",flexShrink:0,marginTop:3}}>{fmtDateTime(e.at)}</div>
            </div>
          ))}
          {events.length===0&&<div style={{padding:32,textAlign:"center",color:"var(--text3)",fontSize:13}}>No activity recorded yet</div>}
        </div>
      </div>
    </div>
  );
}

function App(){

  const [toast,setToast]=useState({msg:"",type:"ok"});
  const [slaConfig,setSlaConfig]=useState(DEFAULT_SLA);

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3200);};

  useEffect(()=>{
    if(!authed) return;
    // Load SLA config
    db.collection("meta").doc("slaConfig").get().then(snap=>{
      if(snap.exists){
        const d=snap.data();
        setSlaConfig({
          Urgent:d.Urgent||DEFAULT_SLA.Urgent,
          High:d.High||DEFAULT_SLA.High,
          Medium:d.Medium||DEFAULT_SLA.Medium,
          Low:d.Low||DEFAULT_SLA.Low,
        });
      }
    }).catch(()=>{});
    // Live tickets
    const unsub=db.collection("tickets").orderBy("createdAt","desc")
      .onSnapshot(snap=>{
        setTickets(snap.docs.map(d=>({id:d.id,...d.data()})));
        setLoading(false);
      },err=>{console.error(err);setLoading(false);showToast("Firebase error","error");});
    return()=>unsub();
  },[authed]);

  if(!authed) return <Login onLogin={()=>setAuthed(true)}/>;
  if(loading) return <Spinner/>;

  const navItems=[
    {section:"Overview",items:[

    {section:"Configuration",items:[
      {key:"sla",icon:"⏱",label:"SLA Timeframes"},
      {key:"escalation",icon:"🚨",label:"Escalation Matrix"},
    ]},
    {section:"Reporting",items:[
      {key:"reports",icon:"📈",label:"Ticket Reports"},
    ]},
    {section:"System",items:[
      {key:"settings",icon:"⚙️",label:"System Settings"},
    ]},
  ];

  const pageTitle={
    dashboard:"Dashboard",tickets:"Ticket Management",sla:"SLA Management",escalation:"Escalation Matrix",
    reports:"Ticket Reports",settings:"System Settings",audit:"Audit Log"
  }[page]||"Dashboard";

  const breachCount=tickets.filter(t=>{
    const s=getSLAStatus(t,slaConfig);
    return s&&s.status==="breach";
  }).length;

  return(
    <div className="shell">
      {/* Sidebar */}
      <div className="sidebar">
        <div className="sb-head">
          <div className="sb-brand">
            <div className="sb-icon">⚡</div>
            <div>
              <div className="sb-name">Cyber I.T Masters</div>
              <div className="sb-tag">⬡ Super Admin</div>
            </div>
          </div>
        </div>
        <div className="sb-nav">
          {navItems.map(section=>(
            <div key={section.section} className="sb-section">
              <div className="sb-label">{section.section}</div>
              {section.items.map(item=>(
                <button key={item.key} className={`sb-item ${page===item.key?"active":""}`} onClick={()=>setPage(item.key)}>
                  <span className="si">{item.icon}</span>
                  {item.label}
                  {item.key==="sla"&&breachCount>0&&(
                    <span style={{marginLeft:"auto",background:DANGER,color:"#fff",fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>{breachCount}</span>
                  )}
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="sb-foot">
          <div className="sb-user">
            <div className="sb-avatar">A</div>
            <div>
              <div className="sb-uname">admin</div>
              <div className="sb-urole">Super Admin</div>
            </div>
          </div>
          <button className="btn btn-ghost btn-sm" style={{width:"100%",marginTop:6,fontSize:12,color:"var(--text3)"}}
            onClick={()=>{setAuthed(false);setPage("dashboard");}}>
            🚪 Sign Out
          </button>
        </div>
      </div>

      {/* Main */}
      <div className="main">
        <div className="topbar">
          <div className="tb-left">
            <div style={{width:6,height:6,borderRadius:"50%",background:DANGER,boxShadow:`0 0 6px ${DANGER}`}}/>
            <div className="tb-title">{pageTitle}</div>
            <div className="tb-crumb" style={{color:"var(--text3)"}}>/ Super Admin</div>
          </div>
          <div className="tb-right">
            {breachCount>0&&(
              <div style={{background:`${DANGER}18`,border:`1px solid ${DANGER}40`,borderRadius:8,padding:"5px 12px",fontSize:12,color:DANGER,fontWeight:700}}>
                🔴 {breachCount} SLA Breach{breachCount>1?"es":""}
              </div>
            )}
            <div style={{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",background:"var(--bg3)",border:"1px solid var(--border2)",borderRadius:8}}>
              <div className="status-dot"/>
              <span style={{fontSize:12,color:"var(--text3)"}}>Live · {tickets.length} tickets</span>
            </div>
          </div>
        </div>

        <div className="page">
          {page==="dashboard"&&<Dashboard tickets={tickets} slaConfig={slaConfig}/>}{page==="tickets"&&<TicketManagement tickets={tickets} showToast={showToast}/>}
          {page==="sla"&&<SLAManagement slaConfig={slaConfig} setSlaConfig={setSlaConfig} showToast={showToast}/>}
          {page==="escalation"&&<EscalationMatrix showToast={showToast}/>}
          {page==="reports"&&<TicketReports tickets={tickets} slaConfig={slaConfig}/>}
          {page==="settings"&&<SystemSettings showToast={showToast}/>}
          {page==="audit"&&<AuditLog tickets={tickets}/>}
        </div>
      </div>

      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
